    <p class="lede">拖動點 <i>P</i>，看它到每一條邊的距離。什麼一直在變？什麼沒有變？</p>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), strip = $("strip");
  const H = 78, SIDE = 2 * H / Math.sqrt(3);
  const COLORS = ["--s1", "--s2", "--s3", "--s4", "--s5"];

  function regular(n, apothem, startDeg){
    const R = apothem / Math.cos(Math.PI / n), v = [];
    for (let k = 0; k < n; k++){ const a = (startDeg + 360 * k / n) * Math.PI / 180; v.push([R * Math.cos(a), R * Math.sin(a)]); }
    return v;
  }
  // 頂點一律逆時針，內側在每條邊的左邊
  const SHAPES = {
    tri:  { v: [[0,0],[SIDE,0],[SIDE/2,H]], names: ["B","C","A"], sides: ["到 BC","到 CA","到 AB"],
            start: bary(20,25,33) },
    sq:   { v: [[0,0],[60,0],[60,60],[0,60]], names: [], sides: ["到下邊","到右邊","到上邊","到左邊"] },
    rect: { v: [[0,0],[84,0],[84,48],[0,48]], names: [], sides: ["到下邊","到右邊","到上邊","到左邊"] },
    pent: { v: regular(5, 38, 234), names: [], sides: ["到邊 1","到邊 2","到邊 3","到邊 4","到邊 5"] },
    scal: { v: [[0,0],[100,0],[26,62]], names: ["B","C","A"], sides: ["到 BC","到 CA","到 AB"] },
  };
  function bary(a, b, c){ // 到 BC、CA、AB 的距離 → 正三角形中的位置
    const A = [SIDE/2, H], B = [0,0], C = [SIDE,0];
    return [(a*A[0] + b*B[0] + c*C[0]) / H, (a*A[1] + b*B[1] + c*C[1]) / H];
  }

  let shapeKey = "tri", P = SHAPES.tri.start.slice(), signed = false, cut = false, running = false;
  let view = null;

  function sdist(p, a, b){ // 有向距離：在邊的內側為正
    const ex = b[0]-a[0], ey = b[1]-a[1], L = Math.hypot(ex, ey);
    return (ex*(p[1]-a[1]) - ey*(p[0]-a[0])) / L;
  }
  function footOf(p, a, b){
    const ex = b[0]-a[0], ey = b[1]-a[1], t = ((p[0]-a[0])*ex + (p[1]-a[1])*ey) / (ex*ex + ey*ey);
    return [a[0] + t*ex, a[1] + t*ey];
  }
  function dists(p){
    const v = SHAPES[shapeKey].v;
    return v.map((a, i) => { const d = sdist(p, a, v[(i+1) % v.length]); return signed ? d : Math.abs(d); });
  }
  function inside(p){ const v = SHAPES[shapeKey].v; return v.every((a, i) => sdist(p, a, v[(i+1) % v.length]) > 0); }
  function centroid(v){ let x = 0, y = 0; v.forEach(q => { x += q[0]; y += q[1]; }); return [x / v.length, y / v.length]; }

  function computeView(){
    const v = SHAPES[shapeKey].v;
    const xs = v.map(q => q[0]), ys = v.map(q => q[1]);
    const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
    const w = maxx - minx, h = maxy - miny;
    const k = Math.min(300 / w, 280 / h);
    const cx = (minx + maxx) / 2, cy = (miny + maxy) / 2;
    view = { k, tx: 220 - cx * k, ty: 200 + cy * k };
  }
  const X = (p) => [view.tx + p[0] * view.k, view.ty - p[1] * view.k];
  const M = (sx, sy) => [(sx - view.tx) / view.k, (view.ty - sy) / view.k];

  function el(tag, attrs, parent){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const colorVar = (i) => `var(${COLORS[i % COLORS.length]})`;

  function extendLine(a, b){ // 邊所在直線延長到畫面外
    const ex = b[0]-a[0], ey = b[1]-a[1], L = Math.hypot(ex, ey), ux = ex / L, uy = ey / L, big = 400 / view.k;
    return [[a[0] - ux*big, a[1] - uy*big], [b[0] + ux*big, b[1] + uy*big]];
  }

  function draw(){
    const S = SHAPES[shapeKey], v = S.v, n = v.length;
    stage.innerHTML = "";
    const out = !inside(P);
    if (out) v.forEach((a, i) => { const [p, q] = extendLine(a, v[(i+1) % n]); const A = X(p), B = X(q);
      el("line", { x1: A[0], y1: A[1], x2: B[0], y2: B[1], class: "ext" }, stage); });
    el("polygon", { points: v.map(q => X(q).join(",")).join(" "), class: "shape" }, stage);
    if (cut) v.forEach((a, i) => {
      const b = v[(i+1) % n];
      el("polygon", { points: [P, a, b].map(q => X(q).join(",")).join(" "), fill: colorVar(i), "fill-opacity": .16,
        stroke: colorVar(i), "stroke-width": 1.4, "stroke-opacity": .8 }, stage);
    });
    v.forEach((a, i) => {
      const b = v[(i+1) % n], f = footOf(P, a, b), A = X(P), F = X(f);
      el("line", { x1: A[0], y1: A[1], x2: F[0], y2: F[1], class: "foot", stroke: colorVar(i) }, stage);
    });
    const c = centroid(v);
    S.names.forEach((name, i) => {
      const q = v[i], dx = q[0] - c[0], dy = q[1] - c[1], L = Math.hypot(dx, dy);
      const T = X([q[0] + dx / L * 12 / view.k * 1.6, q[1] + dy / L * 12 / view.k * 1.6]);
      const t = el("text", { x: T[0], y: T[1] + 7, "text-anchor": "middle", class: "vlab" }, stage); t.textContent = name;
    });
    const Pp = X(P);
    el("circle", { cx: Pp[0], cy: Pp[1], r: 8, class: "pdot" }, stage);
    const t = el("text", { x: Pp[0] + 12, y: Pp[1] - 12, class: "plab" }, stage); t.textContent = "P";
    readout();
  }

  function fmt(x){ return (Math.round(x * 10) / 10).toFixed(1).replace("-", "−"); }

  function buildRows(){
    const S = SHAPES[shapeKey];
    $("rows").innerHTML = S.sides.map((name, i) =>
      `<div class="row"><span class="sw" style="background:${colorVar(i)}"></span><span>${name}</span><span class="val" id="d${i}">0.0</span></div>`).join("");
  }

  function scaleMax(){
    const v = SHAPES[shapeKey].v, keep = signed;
    signed = false; const m = Math.max(...v.map(q => dists(q).reduce((a, b) => a + b, 0))); signed = keep;
    return Math.ceil(m * 1.3 / 20) * 20;
  }

  function readout(){
    const d = dists(P), s = d.reduce((a, b) => a + b, 0);
    d.forEach((x, i) => { const e = $("d" + i); if (e){ e.textContent = fmt(x); e.classList.toggle("neg", x < -0.05); } });
    $("sum").textContent = fmt(s);
    drawStrip(d);
  }

  function drawStrip(d){
    strip.innerHTML = "";
    const max = scaleMax(), L = 12, R = 388, k = (R - L) / max, y = 12, h = 20;
    el("rect", { x: L, y: y, width: R - L, height: h, fill: "none", stroke: "var(--edge)", "stroke-width": 1 }, strip);
    let x = L;
    d.forEach((val, i) => {
      if (val >= 0){
        const w = Math.min(val * k, R - x);
        if (w > 0) el("rect", { x: x, y: y, width: w, height: h, fill: colorVar(i) }, strip);
        x += val * k;
      }
    });
    d.forEach((val, i) => { // 負的那一段從尾端往回扣
      if (val < 0){
        const w = -val * k, x0 = Math.max(L, x - w);
        el("rect", { x: x0, y: y + 3, width: x - x0, height: h - 6, fill: "var(--paper)", stroke: "var(--crimson)", "stroke-width": 1.5, "stroke-dasharray": "4 3" }, strip);
        x -= w;
      }
    });
    const end = Math.max(L, Math.min(R, x));
    el("line", { x1: end, y1: y - 6, x2: end, y2: y + h + 6, stroke: "var(--orange)", "stroke-width": 2.5 }, strip);
    const step = max <= 120 ? 20 : 40;
    for (let t = 0; t <= max; t += step){
      const tx = L + t * k;
      el("line", { x1: tx, y1: y + h, x2: tx, y2: y + h + 4, stroke: "var(--ink-3)", "stroke-width": 1 }, strip);
      const tt = el("text", { x: tx, y: y + h + 17, "text-anchor": "middle", class: "tick" }, strip); tt.textContent = t;
    }
  }

  function clearStat(){ const s = $("stat"); s.textContent = ""; s.className = "stat"; }

  // ---- 拖動 ----
  function toModel(ev){
    const r = stage.getBoundingClientRect();
    const sx = (ev.clientX - r.left) / r.width * 440, sy = (ev.clientY - r.top) / r.height * 400;
    return M(Math.max(4, Math.min(436, sx)), Math.max(4, Math.min(396, sy)));
  }
  let dragging = false;
  stage.addEventListener("pointerdown", (ev) => { if (running) return; dragging = true; stage.setPointerCapture(ev.pointerId); P = toModel(ev); clearStat(); draw(); });
  stage.addEventListener("pointermove", (ev) => { if (!dragging) return; P = toModel(ev); draw(); });
  const stop = () => { dragging = false; };
  stage.addEventListener("pointerup", stop); stage.addEventListener("pointercancel", stop);
  stage.addEventListener("keydown", (ev) => {
    const step = (ev.shiftKey ? 5 : 1);
    const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] }[ev.key];
    if (!mv || running) return;
    ev.preventDefault(); P = [P[0] + mv[0], P[1] + mv[1]]; clearStat(); draw();
  });

  // ---- 隨機跑 ----
  function randInside(){
    const v = SHAPES[shapeKey].v, xs = v.map(q => q[0]), ys = v.map(q => q[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    for (let t = 0; t < 500; t++){ const p = [x0 + Math.random() * (x1 - x0), y0 + Math.random() * (y1 - y0)]; if (inside(p)) return p; }
    return centroid(v);
  }
  $("run").addEventListener("click", () => {
    if (running) return;
    running = true; $("run").disabled = true;
    const N = 1000; let done = 0, lo = Infinity, hi = -Infinity;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const per = reduce ? N : 12;
    const s = $("stat"); s.className = "stat";
    function tick(){
      for (let i = 0; i < per && done < N; i++, done++){
        P = randInside(); const sum = dists(P).reduce((a, b) => a + b, 0);
        lo = Math.min(lo, sum); hi = Math.max(hi, sum);
      }
      draw();
      s.innerHTML = `檢查了 <b>${done}</b> 個點：加起來最小 <b>${fmt(lo)}</b>，最大 <b>${fmt(hi)}</b>`;
      if (done < N) requestAnimationFrame(tick);
      else {
        running = false; $("run").disabled = false;
        if (hi - lo < 0.05){ s.classList.add("same"); s.innerHTML = `檢查了 <b>${N}</b> 個點，加起來每一次都是 <b>${fmt(lo)}</b>`; }
      }
    }
    requestAnimationFrame(tick);
  });

  $("home").addEventListener("click", () => {
    if (running) return;
    const S = SHAPES[shapeKey]; P = (S.start || centroid(S.v)).slice(); clearStat(); draw();
  });
  $("signed").addEventListener("change", (e) => { signed = e.target.checked; clearStat(); draw(); });
  $("cut").addEventListener("click", (e) => { cut = !cut; e.currentTarget.setAttribute("aria-pressed", String(cut));
    e.currentTarget.textContent = cut ? "拿掉連線" : "把 P 連到每個頂點"; draw(); });
  $("shapes").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-shape]"); if (!b || running) return;
    shapeKey = b.dataset.shape;
    document.querySelectorAll("#shapes button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    const S = SHAPES[shapeKey]; P = (S.start || centroid(S.v)).slice();
    computeView(); buildRows(); clearStat(); draw();
  });

  computeView(); buildRows(); draw();
})();
</script>
