<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元六　第 2 節</div>
    <h1>站在兩個圓中間</h1>
    <p class="lede">從 <i>P</i> 對兩個圓各畫一條切線。拖 <i>P</i>，找兩條一樣長的地方。圓心和藍色把手也可以拖。</p>
  </header>

  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 460 380" role="img" aria-label="兩個圓與可拖動的點 P" tabindex="0"></svg>
      <p class="hint">橘色是 <i>P</i>；灰色拖圓心，藍色拖半徑（可以縮成 0）。單位 mm，預設和學習單第 1 頁一樣。</p>
    </div>

    <div class="panel">
      <div class="rows">
        <div class="row"><span class="sw" style="background:var(--ink)"></span><span id="k1">到圓 1 的切線</span><span class="val" id="v1"></span></div>
        <div class="row"><span class="sw" style="background:var(--ink)"></span><span id="k2">到圓 2 的切線</span><span class="val" id="v2"></span></div>
        <div class="row" id="rowS" hidden><span class="sw" style="background:var(--orange)"></span><span><i>PO</i>₁² − <i>PO</i>₂²　│　<i>r</i>₁² − <i>r</i>₂²</span><span class="val" id="vS" style="font-size:20px"></span></div>
      </div>
      <div class="sum"><span class="k">相差</span><span class="v" id="vd" style="font-size:clamp(34px,5vw,48px)"></span></div>

      <div class="controls">
        <div class="btns">
          <button type="button" class="btn" id="foot" aria-pressed="false">留下腳印</button>
          <button type="button" class="btn primary" id="run">隨機找 1000 個一樣長的點</button>
        </div>
        <div class="btns">
          <button type="button" class="btn" id="third" aria-pressed="false">第三個圓</button>
          <button type="button" class="btn" id="home">回到學習單的圖</button>
        </div>
        <div class="stat" id="stat" aria-live="polite"></div>
        <p class="q" id="ask" hidden>電腦找了一千個點。你還需要什麼？</p>
        <details id="more">
          <summary>更多</summary>
          <div class="btns">
            <button type="button" class="btn" id="perp" aria-pressed="false">連心線與垂足</button>
            <button type="button" class="btn" id="sub" aria-pressed="false">兩個量相減</button>
          </div>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage"), K = 3.6, O0 = [230, 220];
  const HOME = () => ({ C: [[-25, 0, 20], [25, 0, 10], [0, 30, 16]], P: [3, 20] });
  let s = HOME(), third = false, showPerp = false, showSub = false, foot = false, prints = [], cloud = [], running = false, drag = null;
  const X = (p) => [O0[0] + p[0]*K, O0[1] - p[1]*K];
  const W = (q) => [(q[0] - O0[0]) / K, (O0[1] - q[1]) / K];
  function el(tag, a){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls, fill){ const e = el("text", { x, y, class: cls, "text-anchor": "middle", "dominant-baseline": "middle" }); if (fill) e.style.fill = fill; e.textContent = t; return e; }
  function line(P, Q, cls){ const a = X(P), b = X(Q); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: cls }); }
  function dot(P, c, r){ const q = X(P); el("circle", { cx: q[0], cy: q[1], r: r || 4.2, fill: c }); }
  const pw = (P, c) => (P[0]-c[0])**2 + (P[1]-c[1])**2 - c[2]*c[2];
  function radLine(a, b){ // pw(P,a) − pw(P,b) = 0 ：g·P = h
    const g = [2*(b[0]-a[0]), 2*(b[1]-a[1])], h = (b[0]*b[0]+b[1]*b[1]-b[2]*b[2]) - (a[0]*a[0]+a[1]*a[1]-a[2]*a[2]);
    const L = Math.hypot(...g); if (L < 1e-9) return null; const n = [g[0]/L, g[1]/L], c = h/L, F = [n[0]*c, n[1]*c], t = [-n[1], n[0]];
    return { F, t, n, c };
  }
  function tangentPt(P, c){ const dx = c[0]-P[0], dy = c[1]-P[1], L = Math.hypot(dx, dy); if (L <= c[2] + 1e-9) return null;
    const a = Math.asin(c[2]/L), b = Math.atan2(dy, dx), t = Math.sqrt(L*L - c[2]*c[2]); return [P[0] + t*Math.cos(b + a), P[1] + t*Math.sin(b + a)]; }
  const f2 = (v) => v.toFixed(2);
  const fmt = (g) => g < 1e-6 ? "＜ 0.000001" : (g < 0.01 ? g.toExponential(1) : g.toFixed(3));
  function show(c, i){ const v = pw(s.P, c); return v >= 0 ? f2(Math.sqrt(v)) + " mm" : "圓內，乘積 " + f2(-v); }
  function draw(){
    svg.innerHTML = "";
    const cs = third ? s.C : s.C.slice(0, 2);
    cs.forEach((c) => { const q = X(c); el("circle", { cx: q[0], cy: q[1], r: c[2]*K, class: "circ" }); });
    const pairs = third ? [[0, 1], [1, 2], [0, 2]] : (showPerp ? [[0, 1]] : []);
    if (third) pairs.forEach(([i, j]) => { const r = radLine(s.C[i], s.C[j]); if (r) line([r.F[0] - r.t[0]*90, r.F[1] - r.t[1]*90], [r.F[0] + r.t[0]*90, r.F[1] + r.t[1]*90], "rad"); });
    if (showPerp){ line([s.C[0][0], s.C[0][1]], [s.C[1][0], s.C[1][1]], "cl");
      const a = s.C[0], b = s.C[1], u = [b[0]-a[0], b[1]-a[1]], L2 = u[0]*u[0] + u[1]*u[1], t = ((s.P[0]-a[0])*u[0] + (s.P[1]-a[1])*u[1]) / L2, F = [a[0] + t*u[0], a[1] + t*u[1]];
      line(s.P, F, "perp"); dot(F, "var(--orange)", 3.5); const q = X(F); txt(q[0] + 12, q[1] + 14, "F", "lab2", "var(--orange)"); }
    cloud.forEach((p) => dot(p, "var(--indigo)", 1.8));
    prints.forEach((p) => dot(p, "var(--green)", 3));
    s.C.slice(0, 2).forEach((c) => { const T = tangentPt(s.P, c); if (T){ line(s.P, T, "tan"); dot(T, "var(--ink)", 3.5); } });
    cs.forEach((c, i) => { const q = X(c); txt(q[0] - 12, q[1] + 15, "O" + "₁₂₃"[i], "lab2", "var(--ink-2)");
      el("circle", { cx: q[0], cy: q[1], r: 16, class: "hit", "data-h": "c" + i }); el("circle", { cx: q[0], cy: q[1], r: 6, class: "cen", "data-h": "c" + i });
      const h = X([c[0] + c[2], c[1]]); el("circle", { cx: h[0], cy: h[1], r: 16, class: "hit", "data-h": "r" + i }); el("circle", { cx: h[0], cy: h[1], r: 6, class: "rh", "data-h": "r" + i }); });
    const p = X(s.P); el("circle", { cx: p[0], cy: p[1], r: 18, class: "hit", "data-h": "P" }); el("circle", { cx: p[0], cy: p[1], r: 8, class: "drag", "data-h": "P" });
    txt(p[0] + 14, p[1] - 14, "P", "lab2", "var(--orange)");
    const v1 = pw(s.P, s.C[0]), v2 = pw(s.P, s.C[1]);
    $("v1").textContent = show(s.C[0]); $("v2").textContent = show(s.C[1]);
    $("vd").textContent = (v1 >= 0 && v2 >= 0) ? f2(Math.abs(Math.sqrt(v1) - Math.sqrt(v2))) + " mm" : "—";
    const d1 = (s.P[0]-s.C[0][0])**2 + (s.P[1]-s.C[0][1])**2, d2 = (s.P[0]-s.C[1][0])**2 + (s.P[1]-s.C[1][1])**2;
    $("vS").textContent = f2(d1 - d2) + "　│　" + f2(s.C[0][2]**2 - s.C[1][2]**2); $("rowS").hidden = !showSub;
    if (foot && Math.abs(v1 - v2) < 6) prints.push(s.P.slice());
  }
  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const w = W(svgPt(ev));
    if (Math.abs(w[0]) > 62 || Math.abs(w[1]) > 58) return;
    if (drag === "P") s.P = w;
    else { const i = +drag[1], c = s.C[i];
      if (drag[0] === "c"){ c[0] = w[0]; c[1] = w[1]; } else c[2] = Math.max(0, Math.min(40, Math.hypot(w[0]-c[0], w[1]-c[1])));
      prints = []; cloud = []; }
    clearStat(); draw(); });
  const end = () => { drag = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }
  function tog(id, f){ $(id).addEventListener("click", () => { const v = f(); $(id).setAttribute("aria-pressed", String(v)); draw(); }); }
  tog("foot", () => { foot = !foot; if (!foot) prints = []; return foot; });
  tog("third", () => { third = !third; clearStat(); return third; });
  tog("perp", () => (showPerp = !showPerp)); tog("sub", () => (showSub = !showSub));
  $("home").addEventListener("click", () => { if (running) return; s = HOME(); prints = []; cloud = []; clearStat(); draw(); });
  $("run").addEventListener("click", () => {
    if (running) return; clearStat(); running = true; $("run").disabled = true; cloud = [];
    const a = s.C[0], b = s.C[1], N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 40;
    const f = (P) => pw(P, a) - pw(P, b); let done = 0;
    function tick(){
      for (let i = 0; i < step && done < N; i++){
        const Q = [-60 + Math.random()*120, -55 + Math.random()*110], th = Math.random()*Math.PI, u = [Math.cos(th), Math.sin(th)];
        const slope = 2*((Q[0]-a[0])*u[0] + (Q[1]-a[1])*u[1]) - 2*((Q[0]-b[0])*u[0] + (Q[1]-b[1])*u[1]);
        if (Math.abs(slope) < 1e-3) continue; const t = -f(Q) / slope, Z = [Q[0] + t*u[0], Q[1] + t*u[1]];
        if (Math.abs(Z[0]) > 62 || Math.abs(Z[1]) > 58) continue; cloud.push(Z); done++;
      }
      draw(); $("stat").innerHTML = `找到 <b>${done}</b> 個點`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false;
        let i0 = 0, i1 = 0, best = -1; for (let i = 0; i < cloud.length; i++) for (let j = i + 1; j < cloud.length; j += 37){ const dd = Math.hypot(cloud[i][0]-cloud[j][0], cloud[i][1]-cloud[j][1]); if (dd > best){ best = dd; i0 = i; i1 = j; } }
        const A = cloud[i0], B = cloud[i1], L = Math.hypot(B[0]-A[0], B[1]-A[1]);
        let worst = 0; cloud.forEach((p) => { worst = Math.max(worst, Math.abs((B[0]-A[0])*(p[1]-A[1]) - (B[1]-A[1])*(p[0]-A[0])) / L); });
        $("stat").innerHTML = `${done} 個切線一樣長的點：離同一條直線最遠 <b>${fmt(worst)}</b> mm`; $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  svg.addEventListener("keydown", (ev) => { const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[ev.key]; if (!mv) return;
    ev.preventDefault(); s.P = [s.P[0] + mv[0], s.P[1] + mv[1]]; clearStat(); draw(); });
  draw();
})();
</script>
