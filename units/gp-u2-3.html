<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元二　第 3 節</div>
    <h1>三條路接成一條</h1>
    <p class="lede">三個村子要蓋一個轉運站 <i>P</i>，各修一條直路過去。<i>P</i> 蓋在哪裡，三條路加起來最短？</p>
  </header>

  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 340" role="img" aria-label="三角形與轉運站" tabindex="0"></svg>
      <p class="hint">拖動藍色的 <i>P</i>，也可以拖橘色的村子。單位 mm；預設和學習單第 1 頁一樣大。</p>
    </div>

    <div class="panel">
      <div class="seg" role="group" aria-label="要比的量">
        <button type="button" id="mSum" aria-pressed="true">距離和</button>
        <button type="button" id="mSq" aria-pressed="false">距離平方和</button>
      </div>
      <div class="rows" style="margin-top:12px">
        <div class="row"><span class="sw" style="background:var(--indigo)"></span><span><i>PA</i>　<i>PB</i>　<i>PC</i></span><span class="val" id="vD" style="min-width:9ch;font-size:22px"></span></div>
        <div class="row"><span class="sw" style="background:var(--crimson)"></span><span>∠<i>APB</i>　∠<i>BPC</i>　∠<i>CPA</i></span><span class="val" id="vAng" style="min-width:9ch;font-size:22px"></span></div>
        <div class="sum"><span class="k" id="kLab"><i>PA</i> ＋ <i>PB</i> ＋ <i>PC</i></span><span class="v" id="vS"></span></div>

          <button type="button" class="btn" id="iBtn">放到內心</button>
          <button type="button" class="btn" id="home">回到學習單的圖</button>
        </div>

    </div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage"), R2D = 180 / Math.PI;
  const fmt = (x) => (Math.round(x * 10) / 10).toFixed(1);
  const HOME = { A: [32.649, 32.156], B: [0, 0], C: [78.102, 0], P: [33.29, 22.177] };
  const s = JSON.parse(JSON.stringify(HOME));
  let sq = false, showRot = false, running = false, drag = null, K = 4, O = [0, 0];

  function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls){ const e = el("text", { x, y, class: cls, "text-anchor": "middle" }); e.textContent = t; return e; }
  const line = (p, q, cls) => el("line", { x1: p[0], y1: p[1], x2: q[0], y2: q[1], class: cls });
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const cross = (o, a, b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  function rot(p, c, deg){ const t = deg / R2D, x = p[0]-c[0], y = p[1]-c[1]; return [c[0] + x*Math.cos(t) - y*Math.sin(t), c[1] + x*Math.sin(t) + y*Math.cos(t)]; }
  function ang(P, Q, R){ const u = [Q[0]-P[0], Q[1]-P[1]], v = [R[0]-P[0], R[1]-P[1]]; const L = Math.hypot(...u) * Math.hypot(...v); return L ? Math.acos(Math.max(-1, Math.min(1, (u[0]*v[0] + u[1]*v[1]) / L))) * R2D : 0; }
  const val = (P) => sq ? dist(P, s.A)**2 + dist(P, s.B)**2 + dist(P, s.C)**2 : dist(P, s.A) + dist(P, s.B) + dist(P, s.C);
  const centroid = () => [(s.A[0]+s.B[0]+s.C[0])/3, (s.A[1]+s.B[1]+s.C[1])/3];
  function incenter(){ const a = dist(s.B, s.C), b = dist(s.C, s.A), c = dist(s.A, s.B), t = a + b + c; return [(a*s.A[0] + b*s.B[0] + c*s.C[0]) / t, (a*s.A[1] + b*s.B[1] + c*s.C[1]) / t]; }
  function outward(){ // 以 AB 為邊往外（遠離 C）畫正三角形，繞 B 轉的方向
    const a1 = rot(s.A, s.B, 60), sgnC = Math.sign(cross(s.A, s.B, s.C)); return Math.sign(cross(s.A, s.B, a1)) !== sgnC ? 60 : -60; }
  function inside(P){ const c1 = cross(s.A, s.B, P), c2 = cross(s.B, s.C, P), c3 = cross(s.C, s.A, P); return (c1 >= 0 && c2 >= 0 && c3 >= 0) || (c1 <= 0 && c2 <= 0 && c3 <= 0); }

  function frame(){ if (drag) return; const pts = [s.A, s.B, s.C, s.P];
    if (showRot){ const d = outward(); pts.push(rot(s.A, s.B, d), rot(s.P, s.B, d)); }
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    K = Math.min(380 / (x1 - x0 || 1), 270 / (y1 - y0 || 1));
    O = [30 + (380 - (x1 - x0) * K) / 2 - x0 * K, 34 + (270 - (y1 - y0) * K) / 2 + y1 * K]; }
  const X = (p) => [O[0] + p[0]*K, O[1] - p[1]*K];
  const W = (q) => [(q[0] - O[0]) / K, (O[1] - q[1]) / K];

  function draw(){
    frame(); svg.innerHTML = "";
    const A = X(s.A), B = X(s.B), C = X(s.C), P = X(s.P);
    el("polygon", { points: [A, B, C].map(p => p.join(",")).join(" "), class: "ln" });
    if (showRot){
      const d = outward(), Ap = X(rot(s.A, s.B, d)), Pp = X(rot(s.P, s.B, d));
      line(A, Ap, "ghost"); line(B, Ap, "ghost"); line(B, Pp, "ghost"); line(P, Pp, "ghost");
      line(Ap, C, "ghost2");
      el("polyline", { points: [Ap, Pp, P, C].map(p => p.join(",")).join(" "), class: "chain" });
      el("circle", { cx: Ap[0], cy: Ap[1], r: 5, class: "mark" }); el("circle", { cx: Pp[0], cy: Pp[1], r: 5, class: "mark" });
      txt(Ap[0] - 16, Ap[1] - 6, "A′", "lab2"); txt(Pp[0] - 14, Pp[1] - 8, "P′", "lab2");
      const wA = rot(s.A, s.B, d), wP = rot(s.P, s.B, d);
      $("rotNote").innerHTML = `<i>A</i>′<i>P</i>′ ＋ <i>P</i>′<i>P</i> ＋ <i>PC</i> ＝ ${fmt(dist(wA, wP) + dist(wP, s.P) + dist(s.P, s.C))}　<i>A</i>′<i>C</i> ＝ ${fmt(dist(wA, s.C))}`;
    }
    [A, B, C].forEach(q => line(P, q, "road"));
    const cen = [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3];
    const out = (p, dd) => { const v = [p[0] - cen[0], p[1] - cen[1]], L = Math.hypot(...v) || 1; return [p[0] + v[0] / L * dd, p[1] + v[1] / L * dd + 6]; };
    [[A, "A"], [B, "B"], [C, "C"]].forEach(([p, t]) => { const q = out(p, 20); txt(q[0], q[1], t, "lab"); });
    txt(P[0] + 16, P[1] - 10, "P", "lab");
    [["A", A], ["B", B], ["C", C]].forEach(([k, p]) => handle(p, k, false)); handle(P, "P", true);
    $("vD").textContent = `${fmt(dist(s.P, s.A))}　${fmt(dist(s.P, s.B))}　${fmt(dist(s.P, s.C))}`;
    $("vAng").textContent = `${Math.round(ang(s.P, s.A, s.B))}°　${Math.round(ang(s.P, s.B, s.C))}°　${Math.round(ang(s.P, s.C, s.A))}°`;
    $("vS").textContent = fmt(val(s.P));
  }
  function handle(p, id, on){
    el("circle", { cx: p[0], cy: p[1], r: 18, class: "hit", "data-h": id });
    el("circle", { cx: p[0], cy: p[1], r: 8, class: "drag" + (on ? " on" : ""), "data-h": id });
  }

  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); clearStat(); });
  svg.addEventListener("pointermove", (ev) => {
    if (!drag) return; const w = W(svgPt(ev)), old = s[drag]; s[drag] = w;
    const ar = Math.abs(cross(s.A, s.B, s.C)) / 2; if (ar < 150) s[drag] = old;
    if (drag !== "P" && !inside(s.P)) s.P = centroid();
    draw();
  });
  const end = () => { if (drag){ drag = null; draw(); } };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("stat").className = "stat"; $("ask").hidden = true; }

  function setMode(m){ if (running) return; sq = m; $("mSum").setAttribute("aria-pressed", String(!m)); $("mSq").setAttribute("aria-pressed", String(m));
    $("kLab").innerHTML = m ? "<i>PA</i>² ＋ <i>PB</i>² ＋ <i>PC</i>²" : "<i>PA</i> ＋ <i>PB</i> ＋ <i>PC</i>"; clearStat(); draw(); }
  $("mSum").addEventListener("click", () => setMode(false));
  $("mSq").addEventListener("click", () => setMode(true));
  $("gBtn").addEventListener("click", () => { if (running) return; s.P = centroid(); clearStat(); draw(); });
  $("iBtn").addEventListener("click", () => { if (running) return; s.P = incenter(); clearStat(); draw(); });
  $("home").addEventListener("click", () => { if (running) return; Object.assign(s, JSON.parse(JSON.stringify(HOME))); clearStat(); draw(); });
  $("rot").addEventListener("click", (e) => { showRot = !showRot; e.currentTarget.setAttribute("aria-pressed", String(showRot));
    e.currentTarget.textContent = showRot ? "收起轉 60°" : "轉 60°"; $("rotNote").hidden = !showRot; draw(); });

  $("run").addEventListener("click", () => {
    if (running) return; running = true; $("run").disabled = true; clearStat();
    const N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 10;
    let done = 0, best = Infinity, arg = null; const st = $("stat");
    function tick(){
      for (let i = 0; i < step && done < N; i++, done++){
        let u = Math.random(), v = Math.random(); if (u + v > 1){ u = 1 - u; v = 1 - v; }
        const Q = [s.A[0] + u*(s.B[0]-s.A[0]) + v*(s.C[0]-s.A[0]), s.A[1] + u*(s.B[1]-s.A[1]) + v*(s.C[1]-s.A[1])];
        const vv = val(Q); if (vv < best){ best = vv; arg = Q; } s.P = Q;
      }
      draw(); st.innerHTML = `試了 <b>${done}</b> 個位置，目前最小 <b>${fmt(best)}</b>`;
      if (done < N) requestAnimationFrame(tick);
      else { s.P = arg; running = false; $("run").disabled = false; draw();
        st.innerHTML = `試了 <b>${N}</b> 個位置：最小 <b>${fmt(best)}</b>，那時三個角 <b>${$("vAng").textContent}</b>`; $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  svg.addEventListener("keydown", (ev) => { const m = { ArrowLeft: [-0.5, 0], ArrowRight: [0.5, 0], ArrowUp: [0, 0.5], ArrowDown: [0, -0.5] }[ev.key]; if (!m) return; ev.preventDefault();
    const Q = [s.P[0] + m[0], s.P[1] + m[1]]; if (inside(Q)) s.P = Q; clearStat(); draw(); });

  draw();
})();
</script>
