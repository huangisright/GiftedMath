<script>
(function(){
  const NS="http://www.w3.org/2000/svg", $=(id)=>document.getElementById(id), svg=$("stage"), side=$("side");
  const N=3;
  const HOME=()=>({tc:[1.5,1.5],D:3.2,h:2.0,phi:70,pit:0});
  const P2=()=>({tc:[0.5,0.5],D:1.7,h:0.8,phi:65,pit:0});
  let s=HOME(), showExt=false, showMid=false, showSide=false, running=false;
  const sub=(a,b)=>a.map((x,i)=>x-b[i]), dot=(a,b)=>a.reduce((t,x,i)=>t+x*b[i],0);
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  function cam(st){
    const p=st.phi*Math.PI/180, t=st.pit*Math.PI/180;
    const E=[st.tc[0]-Math.cos(p)*st.D, st.tc[1]-Math.sin(p)*st.D, st.h];
    const f=[Math.cos(p)*Math.cos(t), Math.sin(p)*Math.cos(t), -Math.sin(t)];
    const r=[Math.sin(p),-Math.cos(p),0], u=cross(r,f);
    return {E,f,r,u,proj(X){const q=sub(X,E),d=dot(q,f); if(d<1e-3) return null; return [dot(q,r)/d, dot(q,u)/d];},
      vp(d){const z=dot(d,f); if(z<1e-6) return null; return [dot(d,r)/z, dot(d,u)/z];}};
  }
  function el(tag,a,par){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(par||svg).appendChild(e);return e;}
  let fit=null;
  function mkfit(pts){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; pts.forEach(p=>{if(!p)return;x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);});
    const k=Math.min(360/(x1-x0||1),300/(y1-y0||1)); const cx=(x0+x1)/2, cy=(y0+y1)/2;
    return p=>[220+(p[0]-cx)*k, 250-(p[1]-cy)*k]; }
  function grid(c){ const G={}; for(let i=0;i<=N;i++)for(let j=0;j<=N;j++)G[i+","+j]=c.proj([i,j,0]); return G; }
  function clipLine(a,b){ // 延長到畫面邊界
    const d=[b[0]-a[0],b[1]-a[1]], L=Math.hypot(...d)||1, u=[d[0]/L,d[1]/L];
    return [[a[0]-u[0]*900,a[1]-u[1]*900],[a[0]+u[0]*900,a[1]+u[1]*900]]; }
  function line(a,b,cls){ return el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:cls}); }
  function draw(){
    svg.innerHTML=""; const c=cam(s), G=grid(c);
    const pts=Object.values(G); fit=mkfit(pts); const T=(p)=>fit(p);
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){ const q=[G[i+","+j],G[(i+1)+","+j],G[(i+1)+","+(j+1)],G[i+","+(j+1)]].map(T);
      el("polygon",{points:q.map(p=>p.join(",")).join(" "),class:(i+j)%2==0?"tileA":"tileB"}); }
    if(showExt){
      const v1=c.vp([0,1,0]), v2=c.vp([1,0,0]);
      for(let i=0;i<=N;i++){ const [a,b]=clipLine(T(G[i+",0"]),T(G[i+","+N])); line(a,b,"ex"); }
      for(let j=0;j<=N;j++){ const [a,b]=clipLine(T(G["0,"+j]),T(G[N+","+j])); line(a,b,"ex"); }
      const hz=[c.vp([1,0,0]),c.vp([0,1,0]),c.vp([1,1,0]),c.vp([1,-1,0])].filter(Boolean);
      if(hz.length>=2){ const [a,b]=clipLine(T(hz[0]),T(hz[1])); line(a,b,"hz"); }
      [v1,v2].forEach(v=>{ if(v){const p=T(v); if(p[0]>-5&&p[0]<445&&p[1]>-5&&p[1]<445) el("circle",{cx:p[0],cy:p[1],r:5,fill:"var(--ink)"});} });
    }
    for(let i=0;i<=N;i++) line(T(G[i+",0"]),T(G[i+","+N]),"gl");
    for(let j=0;j<=N;j++) line(T(G["0,"+j]),T(G[N+","+j]),"gl");
    // 長度比
    let mx=0,mn=1e9; for(let i=0;i<N;i++)for(let j=0;j<=N;j++){ const a=T(G[i+","+j]),b=T(G[(i+1)+","+j]),L=Math.hypot(a[0]-b[0],a[1]-b[1]); mx=Math.max(mx,L); mn=Math.min(mn,L);
      const a2=T(G[j+","+i]),b2=T(G[j+","+(i+1)]),L2=Math.hypot(a2[0]-b2[0],a2[1]-b2[1]); mx=Math.max(mx,L2); mn=Math.min(mn,L2); }
    $("vl").textContent=(mx/mn).toFixed(2)+" 倍";
    if(showMid){
      const A=T(c.proj([0,0,0])),B=T(c.proj([1,0,0])),C=T(c.proj([1,1,0])),D=T(c.proj([0,1,0]));
      el("polygon",{points:[A,B,C,D].map(p=>p.join(",")).join(" "),class:"hl"});
      const m1=[(A[0]+B[0])/2,(A[1]+B[1])/2], m2=[(D[0]+C[0])/2,(D[1]+C[1])/2];
      line(m1,m2,"meas"); const t1=T(c.proj([0.5,0,0])), t2=T(c.proj([0.5,1,0])); line(t1,t2,"tru");
      [m1,m2].forEach(p=>el("circle",{cx:p[0],cy:p[1],r:4,fill:"#c0392b"}));
      const AB=Math.hypot(A[0]-B[0],A[1]-B[1]); $("vm").textContent=(Math.hypot(m1[0]-t1[0],m1[1]-t1[1])/AB*100).toFixed(1)+"％ 的 AB";
      [[A,"A",-14,10],[B,"B",14,6],[C,"C",12,-6],[D,"D",-14,-4]].forEach(([p,t,dx,dy])=>{const e=el("text",{x:p[0]+dx,y:p[1]+dy,class:"lab","text-anchor":"middle"});e.textContent=t;});
    }
    $("rowM").hidden=!showMid;
    $("hv").textContent=s.h.toFixed(1); $("phiv").textContent=s.phi+"°"; $("pitv").textContent=s.pit+"°";
    if(showSide) drawSide(c,G);
  }
  // 從旁邊看：一個固定的觀察者看眼睛、畫紙、地板
  function drawSide(c,G){
    side.innerHTML="";
    const p=-35*Math.PI/180, ob={E:null};
    const OE=[c.E[0]+Math.cos(p)*0+6.5, c.E[1]-6.5, Math.max(4.5,c.E[2]+3)];
    const tgt=[1.2,0.6,0.6]; const fw=sub(tgt,OE), Lf=Math.hypot(...fw); const f=fw.map(x=>x/Lf);
    let r=cross(f,[0,0,1]); const Lr=Math.hypot(...r); r=r.map(x=>x/Lr); const u=cross(r,f);
    const pr=(X)=>{const q=sub(X,OE),d=dot(q,f); return [dot(q,r)/d,dot(q,u)/d];};
    // 畫紙：眼前 0.6 處的長方形
    const dd=0.6, W=0.55, H=0.45;
    const corner=(a,b)=>[c.E[0]+c.f[0]*dd+c.r[0]*a+c.u[0]*b, c.E[1]+c.f[1]*dd+c.r[1]*a+c.u[1]*b, c.E[2]+c.f[2]*dd+c.r[2]*a+c.u[2]*b];
    const pp=[corner(-W,-H),corner(W,-H),corner(W,H),corner(-W,H)];
    const X0=[0,0,0], X1=[N,N,0];
    const toPaper=(X)=>{const q=c.proj(X); return q?corner(q[0]*dd,q[1]*dd):null;};
    const all=[c.E,...pp,[0,0,0],[N,0,0],[N,N,0],[0,N,0]].map(pr);
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; all.forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);});
    const k=Math.min(400/(x1-x0),220/(y1-y0)), T=(X)=>{const q=pr(X);return [220+(q[0]-(x0+x1)/2)*k,130-(q[1]-(y0+y1)/2)*k];};
    const poly=(arr,cls)=>el("polygon",{points:arr.map(X=>T(X).join(",")).join(" "),class:cls},side);
    for(let i=0;i<=N;i++){const a=T([i,0,0]),b=T([i,N,0]);el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:"var(--ink-3)","stroke-width":1},side);}
    for(let j=0;j<=N;j++){const a=T([0,j,0]),b=T([N,j,0]);el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:"var(--ink-3)","stroke-width":1},side);}
    poly([c.E,X0,X1],"fan");
    poly(pp,"pp");
    const a=T(X0),b=T(X1); el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:"var(--indigo)","stroke-width":2.6},side);
    const q0=toPaper(X0), q1=toPaper(X1); if(q0&&q1){const A=T(q0),B=T(q1); el("line",{x1:A[0],y1:A[1],x2:B[0],y2:B[1],class:"cut"},side);}
    const e=T(c.E); el("circle",{cx:e[0],cy:e[1],r:5,fill:"var(--orange)"},side);
    const t=el("text",{x:e[0]+10,y:e[1]-8,"font-size":14,fill:"var(--ink-2)"},side); t.textContent="眼睛";
    const t2=T(pp[2]); const tt=el("text",{x:t2[0]+4,y:t2[1]-4,"font-size":14,fill:"var(--ink-2)"},side); tt.textContent="畫紙";
  }
  // 拖曳：左右拖改方向
  let dragX=null;
  svg.addEventListener("pointerdown",ev=>{ if(running)return; dragX=[ev.clientX,s.phi]; svg.setPointerCapture(ev.pointerId); });
  svg.addEventListener("pointermove",ev=>{ if(dragX==null)return; s.phi=Math.max(0,Math.min(90,Math.round(dragX[1]-(ev.clientX-dragX[0])*0.3))); $("phi").value=s.phi; clearStat(); draw(); });
  const end=()=>{dragX=null;}; svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);
  function clearStat(){$("stat").textContent="";$("ask").hidden=true;}
  [["h","h",parseFloat],["phi","phi",parseInt],["pit","pit",parseInt]].forEach(([id,k,fn])=>$(id).addEventListener("input",()=>{s[k]=fn($(id).value);clearStat();draw();}));
  function tog(id,f){$(id).addEventListener("click",()=>{const v=f();$(id).setAttribute("aria-pressed",String(v));draw();});}
  tog("ext",()=>showExt=!showExt); tog("mid",()=>showMid=!showMid);
  tog("sv",()=>{showSide=!showSide; if(showSide) side.removeAttribute("hidden"); else side.setAttribute("hidden",""); return showSide;});
  function setS(n){ s=n; $("h").value=s.h; $("phi").value=s.phi; $("pit").value=s.pit; clearStat(); draw(); }
  $("home").addEventListener("click",()=>{if(!running)setS(HOME());});
  $("p2").addEventListener("click",()=>{if(running)return; showMid=true; $("mid").setAttribute("aria-pressed","true"); setS(P2());});
  $("run").addEventListener("click",()=>{
    if(running)return; clearStat(); running=true; $("run").disabled=true;
    const keep=JSON.parse(JSON.stringify(s)), M=1000, reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches, step=reduce?M:25;
    let done=0, worst=0, ratio=1;
    function tick(){
      for(let i=0;i<step&&done<M;i++){
        const st={tc:[1.5,1.5],D:2.6+Math.random()*4,h:0.3+Math.random()*6,phi:Math.round(Math.random()*90),pit:Math.round(Math.random()*80)};
        const c=cam(st), G=grid(c); if(Object.values(G).some(p=>!p)) continue;
        const F=mkfit(Object.values(G)), g=(i,j)=>F(G[i+","+j]);
        const chk=(a,b,m)=>{const d=[b[0]-a[0],b[1]-a[1]]; return Math.abs(d[0]*(m[1]-a[1])-d[1]*(m[0]-a[0]))/Math.hypot(...d);};
        for(let k=0;k<=N;k++){ for(let t=1;t<N;t++){ worst=Math.max(worst,chk(g(k,0),g(k,N),g(k,t)),chk(g(0,k),g(N,k),g(t,k))); } }
        for(let t=1;t<N;t++) worst=Math.max(worst,chk(g(0,0),g(N,N),g(t,t)),chk(g(N,0),g(0,N),g(N-t,t)));
        s=st; done++;
      }
      $("h").value=s.h; $("phi").value=s.phi; $("pit").value=s.pit; draw(); $("stat").innerHTML=`換了 <b>${done}</b> 種看法`;
      if(done<M) requestAnimationFrame(tick);
      else { running=false; $("run").disabled=false; setS(keep);
        $("stat").innerHTML=`${done} 張畫：每一條格線、每一條大對角線上的格點，離那條直線最多 <b>${worst<1e-6?"＜ 0.000001":worst.toExponential(1)}</b> 像素`; $("ask").hidden=false; }
    }
    requestAnimationFrame(tick);
  });
  draw();
})();
</script>
