    <h1>三個尖，一條線</h1>

      <p class="hint" id="hintH" hidden>拖 <i>X</i>、<i>Y</i> 與三角形的頂點。一格 5 mm，和學習單第 2 頁一樣。</p>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage");
  function el(tag, a){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls, fill){ const e = el("text", { x, y, class: cls, "text-anchor": "middle", "dominant-baseline": "middle" }); if (fill) e.style.fill = fill; e.textContent = t; return e; }
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const lerp = (p, q, t) => [p[0] + (q[0]-p[0])*t, p[1] + (q[1]-p[1])*t];
  const cross = (o, p, q) => (p[0]-o[0])*(q[1]-o[1]) - (p[1]-o[1])*(q[0]-o[0]);
  const fmt = (g) => g < 1e-6 ? "＜ 0.000001" : (g < 0.01 ? g.toExponential(1) : g.toFixed(2));
  let mode = "c", drag = null, running = false;

  // ===== 三個圓 =====
  const HOMEC = { O: [[99, 42], [53, 21], [22, 45]], r: [4, 7, 16] };
  let C = JSON.parse(JSON.stringify(HOMEC)), inner = [false, false, false];
  const PAIRS = [[0, 1], [1, 2], [0, 2]];
  const KC = 2.55, OC = [26, 268];
  const XC = (p) => [OC[0] + (p[0] + 2)*KC, OC[1] - (p[1] + 4)*KC];
  const WC = (q) => [(q[0] - OC[0]) / KC - 2, (OC[1] - q[1]) / KC - 4];
  function tip(i, j, inn, c){ const [O1, O2] = [c.O[i], c.O[j]], [r1, r2] = [c.r[i], c.r[j]];
    if (inn) return [(r2*O1[0] + r1*O2[0])/(r1+r2), (r2*O1[1] + r1*O2[1])/(r1+r2)];
    if (Math.abs(r1 - r2) < 1e-9) return null;
    return [(r2*O1[0] - r1*O2[0])/(r2-r1), (r2*O1[1] - r1*O2[1])/(r2-r1)]; }
  function tps(Xp, O, r){ const dx = O[0]-Xp[0], dy = O[1]-Xp[1], L = Math.hypot(dx, dy); if (L <= r) return [];
    const a = Math.asin(r/L), b = Math.atan2(dy, dx), t = Math.sqrt(L*L - r*r); return [1, -1].map(s => [Xp[0] + t*Math.cos(b + s*a), Xp[1] + t*Math.sin(b + s*a)]); }
  function off3(T){ if (T.some(t => !t)) return null; const L = Math.max(dist(T[0], T[1]), dist(T[1], T[2]), dist(T[0], T[2])); return L < 1e-9 ? 0 : Math.abs(cross(T[0], T[1], T[2])) / L; }
  function lineC(P, Q, cls){ const a = XC(P), b = XC(Q); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: cls }); }
  function drawC(){
    svg.setAttribute("viewBox", "0 0 460 300"); svg.innerHTML = "";
    const T = PAIRS.map(([i, j], k) => tip(i, j, inner[k], C));
    PAIRS.forEach(([i, j], k) => { const t = T[k]; if (!t) return;
      [i, j].forEach(c => tps(t, C.O[c], C.r[c]).forEach(p => lineC(t, lerp(t, p, 1.06), "tan" + (inner[k] ? " in" : "")))); });
    const ok = T.filter(Boolean);
    if (ok.length === 3){ let a = 0, b = 1; [[0,1],[1,2],[0,2]].forEach(([u, v]) => { if (dist(T[u], T[v]) > dist(T[a], T[b])){ a = u; b = v; } });
      const d = [T[b][0]-T[a][0], T[b][1]-T[a][1]], L = Math.hypot(...d) || 1; lineC([T[a][0] - d[0]/L*12, T[a][1] - d[1]/L*12], [T[b][0] + d[0]/L*12, T[b][1] + d[1]/L*12], "thru"); }
    else if (ok.length === 2){ const d = [ok[1][0]-ok[0][0], ok[1][1]-ok[0][1]], L = Math.hypot(...d) || 1; lineC([ok[0][0] - d[0]/L*200, ok[0][1] - d[1]/L*200], [ok[1][0] + d[0]/L*200, ok[1][1] + d[1]/L*200], "thru"); }
    C.O.forEach((O, i) => { const q = XC(O); el("circle", { cx: q[0], cy: q[1], r: C.r[i]*KC, class: "cir" }); });
    T.forEach((t, k) => { if (!t) return; const q = XC(t); el("circle", { cx: q[0], cy: q[1], r: 5, fill: inner[k] ? "var(--indigo)" : "var(--ink)" }); txt(q[0], q[1] - 14, ["12", "23", "13"][k], "lab2"); });
    C.O.forEach((O, i) => { const q = XC(O), h = XC([O[0] + C.r[i], O[1]]);
      txt(q[0], q[1] + C.r[i]*KC + 13, String(i + 1), "lab2");
      el("circle", { cx: q[0], cy: q[1], r: 16, class: "hit", "data-h": "o" + i }); el("circle", { cx: q[0], cy: q[1], r: 6, class: "drag", "data-h": "o" + i });
      el("circle", { cx: h[0], cy: h[1], r: 14, class: "hit", "data-h": "r" + i }); el("circle", { cx: h[0], cy: h[1], r: 5, class: "rh", "data-h": "r" + i }); });
    const o = off3(T); $("vD").textContent = o === null ? "有一個尖跑到很遠" : fmt(o);
    $("vD").style.fontSize = o === null ? "20px" : "clamp(30px,5vw,44px)";
  }

  // ===== 兩次縮放 =====
  const HOMEH = { X: [12, 3], Y: [18, 3], P: [[14, 13], [20, 9], [12, 9]] };
  let Hs = JSON.parse(JSON.stringify(HOMEH)), k1 = 0.5, k2 = 2, showZ = false;
  const KH = 16, OH = [14, 284];
  const XH = (p) => [OH[0] + p[0]*KH, OH[1] - p[1]*KH];
  const WH = (q) => [(q[0] - OH[0]) / KH, (OH[1] - q[1]) / KH];
  const hm = (Z, k, P) => [Z[0] + k*(P[0]-Z[0]), Z[1] + k*(P[1]-Z[1])];
  const KOPT = [[0.5, "½"], [2, "2"], [-0.5, "−½"]];
  function mkSeg(id, get, set){ const box = $(id); KOPT.forEach(([v, t]) => { const b = document.createElement("button"); b.type = "button"; b.textContent = t; b.dataset.v = v;
      b.addEventListener("click", () => { set(v); [...box.children].forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.v === get()))); draw(); }); box.appendChild(b); });
    [...box.children].forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.v === get()))); }
  mkSeg("k1", () => k1, v => k1 = v); mkSeg("k2", () => k2, v => k2 = v);
  function poly(P, cls){ el("polygon", { points: P.map(p => XH(p).join(",")).join(" "), class: cls }); }
  function drawH(){
    svg.setAttribute("viewBox", "0 0 460 300"); svg.innerHTML = "";
    for (let i = 0; i <= 27; i++){ const a = XH([i, 0]), b = XH([i, 17]); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: "glx" }); }
    for (let j = 0; j <= 17; j++){ const a = XH([0, j]), b = XH([27, j]); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: "glx" }); }
    const P1 = Hs.P.map(p => hm(Hs.X, k1, p)), P2 = P1.map(p => hm(Hs.Y, k2, p)), K = k1*k2;
    let info = "";
    if (showZ){ if (Math.abs(K - 1) < 1e-9){ const v = [P2[0][0]-Hs.P[0][0], P2[0][1]-Hs.P[0][1]]; info = `兩個比相乘是 1：沒有中心，整個三角形搬了 (${v[0].toFixed(1).replace("-", "−")}, ${v[1].toFixed(1).replace("-", "−")}) 格。`;
        Hs.P.forEach((p, i) => { const a = XH(p), b = XH(P2[i]); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: "zl" }); }); }
      else { const Z = [(Hs.Y[0]*(1-k2) + k2*(1-k1)*Hs.X[0])/(1-K), (Hs.Y[1]*(1-k2) + k2*(1-k1)*Hs.X[1])/(1-K)];
        const a = XH(Hs.X), b = XH(Hs.Y), u = [b[0]-a[0], b[1]-a[1]], L = Math.hypot(...u) || 1;
        el("line", { x1: a[0] - u[0]/L*400, y1: a[1] - u[1]/L*400, x2: b[0] + u[0]/L*400, y2: b[1] + u[1]/L*400, class: "zl" });
        Hs.P.forEach(p => { const q = XH(p), z = XH(Z); el("line", { x1: z[0], y1: z[1], x2: q[0], y2: q[1], class: "zl" }); });
        const z = XH(Z); el("circle", { cx: z[0], cy: z[1], r: 5.5, fill: "var(--indigo)" }); txt(z[0], z[1] + 16, "Z", "lab", "var(--indigo)");
        info = `合起來是從 Z 一次縮放，比 ${K.toFixed(2).replace("-", "−")}；Z ＝ (${Z[0].toFixed(2).replace("-", "−")}, ${Z[1].toFixed(2).replace("-", "−")})，在直線 XY 上。`; } }
    $("zInfo").textContent = info;
    poly(Hs.P, "tri0"); poly(P1, "tri1"); poly(P2, "tri2");
    [["X", Hs.X], ["Y", Hs.Y]].forEach(([t, p]) => { const q = XH(p); txt(q[0], q[1] + 17, t, "lab"); el("circle", { cx: q[0], cy: q[1], r: 16, class: "hit", "data-h": t }); el("circle", { cx: q[0], cy: q[1], r: 7, class: "drag", "data-h": t }); });
    ["P", "Q", "R"].forEach((t, i) => { const q = XH(Hs.P[i]); txt(q[0] + 14, q[1] - 10, t, "lab"); el("circle", { cx: q[0], cy: q[1], r: 14, class: "hit", "data-h": "p" + i }); el("circle", { cx: q[0], cy: q[1], r: 5, class: "drag", "data-h": "p" + i }); });
    $("vK").textContent = (Math.abs(K) < 1 ? (K < 0 ? "−" : "") + "1/" + Math.round(1/Math.abs(K)) : (K < 0 ? "−" : "") + Math.abs(K).toFixed(0)) + (K < 0 ? "（倒過來）" : "");
  }

  function draw(){ mode === "c" ? drawC() : drawH(); }
  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const q = svgPt(ev);
    if (mode === "c"){ const w = WC(q), i = +drag[1];
      if (drag[0] === "o") C.O[i] = w; else C.r[i] = Math.max(2, Math.min(30, dist(w, C.O[i])));
      clearStat(); }
    else { let w = WH(q); w = [Math.round(w[0]*2)/2, Math.round(w[1]*2)/2];
      if (drag === "X") Hs.X = w; else if (drag === "Y") Hs.Y = w; else Hs.P[+drag[1]] = w; }
    draw(); });
  const end = () => { drag = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }
  document.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => { const k = +b.dataset.p; inner[k] = !inner[k];
    b.setAttribute("aria-pressed", String(inner[k])); b.textContent = b.textContent.replace(/[外內]$/, inner[k] ? "內" : "外"); clearStat(); draw(); }));
  document.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => { if (running) return; mode = b.dataset.m;
    document.querySelectorAll("[data-m]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("panelC").hidden = mode !== "c"; $("hintC").hidden = mode !== "c"; $("panelH").hidden = mode !== "h"; $("hintH").hidden = mode !== "h"; draw(); }));
  $("home").addEventListener("click", () => { if (running) return; C = JSON.parse(JSON.stringify(HOMEC)); clearStat(); draw(); });
  $("homeH").addEventListener("click", () => { Hs = JSON.parse(JSON.stringify(HOMEH)); draw(); });
  $("showZ").addEventListener("click", () => { showZ = !showZ; $("showZ").setAttribute("aria-pressed", String(showZ)); draw(); });
  $("run").addEventListener("click", () => {
    if (running) return; clearStat(); running = true; $("run").disabled = true;
    const keep = JSON.parse(JSON.stringify(C)), N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 25;
    let done = 0, worst = 0;
    function tick(){
      for (let i = 0; i < step && done < N; i++){
        const c = { O: [0, 1, 2].map(() => [10 + Math.random()*140, 5 + Math.random()*90]), r: [0, 1, 2].map(() => 3 + Math.random()*17) };
        let ok = true; for (const [a, b] of PAIRS) if (dist(c.O[a], c.O[b]) < c.r[a] + c.r[b] + 2 || Math.abs(c.r[a] - c.r[b]) < 0.5) ok = false;
        if (!ok) continue;
        const T = PAIRS.map(([a, b], k) => tip(a, b, inner[k], c)), o = off3(T); if (o === null) continue;
        done++; worst = Math.max(worst, o); C = c;
      }
      draw(); $("stat").innerHTML = `換了 <b>${done}</b> 組圓`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false; C = keep; draw();
        $("stat").innerHTML = `${done} 組圓：三個尖離一直線最遠 <b>${fmt(worst)}</b> mm`; $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  draw();
})();
</script>
