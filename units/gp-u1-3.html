<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元一　第 3 節</div>
    <h1>三條線，交在一點</h1>
    <p class="lede">拖動點 <i>O</i>。從三個頂點各畫一條線穿過它，碰到對邊於 <i>D</i>、<i>E</i>、<i>F</i>。三個比一直在變，什麼沒有變？</p>
  </header>

  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 420" role="img" aria-label="可以拖動點 O 的三角形" tabindex="0"></svg>
      <p class="hint">在圖上按住拖動，或點一下把 <i>O</i> 移過去。選取圖形後也可以用方向鍵微調。單位：mm。</p>
    </div>

    <div class="panel">
      <div class="rows" id="rows">
        <div class="row"><span class="sw" style="background:var(--s1)"></span><span class="frac">AF / FB</span><span class="val" id="r0"></span></div>
        <div class="row"><span class="sw" style="background:var(--s2)"></span><span class="frac">BD / DC</span><span class="val" id="r1"></span></div>
        <div class="row"><span class="sw" style="background:var(--s3)"></span><span class="frac">CE / EA</span><span class="val" id="r2"></span></div>
      </div>
      <div class="sum"><span class="k">三個比乘起來</span><span class="v" id="prod"></span></div>
      <p class="note" id="lens"></p>

          <button type="button" class="btn" id="home">回到學習單上的點</button>
          <button type="button" class="btn" id="cen">放到中線的交點</button>
        </div>
        <div class="stat" id="stat" aria-live="polite"></div>
        <label class="check"><input type="checkbox" id="out"> <i>O</i> 可以跑到三角形外面</label>

            <button type="button" class="btn" id="pieces" aria-pressed="false">顯示三塊</button>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const stage = $("stage");
  // 和學習單同一個三角形：AB 75、BC 70、CA 90 mm
  const B = [0, 0], C = [70, 0];
  const Ax = (75*75 - 90*90 + 70*70) / 140, A = [Ax, Math.sqrt(75*75 - Ax*Ax)];
  const lerp = (p, q, t) => [p[0] + (q[0]-p[0])*t, p[1] + (q[1]-p[1])*t];
  function meet(p1, p2, p3, p4){ // 直線 p1p2 與 p3p4 的交點
    const d = (p2[0]-p1[0])*(p4[1]-p3[1]) - (p2[1]-p1[1])*(p4[0]-p3[0]);
    if (Math.abs(d) < 1e-9) return null;
    const t = ((p3[0]-p1[0])*(p4[1]-p3[1]) - (p3[1]-p1[1])*(p4[0]-p3[0])) / d;
    return [p1[0] + t*(p2[0]-p1[0]), p1[1] + t*(p2[1]-p1[1])];
  }
  const START = meet(A, [40, 0], C, lerp(A, B, 45/75));
  const CEN = [(A[0]+B[0]+C[0])/3, (A[1]+B[1]+C[1])/3];
  let O = START.slice(), outside = false, pieces = false, two = false, running = false;

  const cross = (o, p, q) => (p[0]-o[0])*(q[1]-o[1]) - (p[1]-o[1])*(q[0]-o[0]);
  const area = (p, q, r) => Math.abs(cross(p, q, r)) / 2;
  const len = (p, q) => Math.hypot(p[0]-q[0], p[1]-q[1]);
  function inside(p){ return cross(B, C, p) > 0 && cross(C, A, p) > 0 && cross(A, B, p) > 0; }

  // 視窗：外面模式時放大範圍
  let view;
  function computeView(){
    const pad = outside ? 60 : 8, xs = [A[0], B[0], C[0]], ys = [A[1], B[1], C[1]];
    const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
    const k = Math.min(400 / (x1 - x0), 380 / (y1 - y0));
    view = { k, tx: 220 - (x0 + x1) / 2 * k, ty: 210 + (y0 + y1) / 2 * k };
  }
  const X = (p) => [view.tx + p[0]*view.k, view.ty - p[1]*view.k];
  const M = (sx, sy) => [(sx - view.tx) / view.k, (view.ty - sy) / view.k];
  function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  function line(p, q, cls, extra){ const P = X(p), Q = X(q); return el("line", Object.assign({ x1: P[0], y1: P[1], x2: Q[0], y2: Q[1], class: cls }, extra || {}), stage); }
  function label(p, txt, away, cls){ const c = CEN, dx = p[0]-(away ? away[0] : c[0]), dy = p[1]-(away ? away[1] : c[1]), L = Math.hypot(dx, dy) || 1;
    const T = X([p[0] + dx/L*12/view.k*1.5, p[1] + dy/L*12/view.k*1.5]);
    const t = el("text", { x: T[0], y: T[1] + 7, "text-anchor": "middle", class: cls || "vlab" }, stage); t.textContent = txt; }

  function feet(o){ return { D: meet(A, o, B, C), E: meet(B, o, C, A), F: meet(C, o, A, B) }; }
  function ratios(o){
    const { D, E, F } = feet(o);
    if (!D || !E || !F) return null;
    return { D, E, F, r: [len(A, F)/len(F, B), len(B, D)/len(D, C), len(C, E)/len(E, A)] };
  }
  const fmt = (x) => !isFinite(x) ? "∞" : x >= 1000 ? x.toFixed(0) : x.toFixed(3);

  function draw(){
    stage.innerHTML = "";
    el("polygon", { points: [A, B, C].map(q => X(q).join(",")).join(" "), class: "shape" }, stage);
    if (two){ drawTwo(); return; }
    const R = ratios(O);
    if (R){
      const { D, E, F } = R;
      if (pieces){
        [[B, C, "--s3"], [C, A, "--s1"], [A, B, "--s2"]].forEach(([p, q, c]) =>
          el("polygon", { points: [O, p, q].map(z => X(z).join(",")).join(" "), fill: `var(${c})`, "fill-opacity": .2, class: "piece" }, stage));
      }
      // 不在邊上的點，畫出邊的延長線
      const onSeg = (P, p, q) => Math.abs(len(p, P) + len(P, q) - len(p, q)) < 1e-6;
      if (!onSeg(D, B, C)) line(len(D, B) < len(D, C) ? B : C, D, "ext");
      if (!onSeg(E, C, A)) line(len(E, C) < len(E, A) ? C : A, E, "ext");
      if (!onSeg(F, A, B)) line(len(F, A) < len(F, B) ? A : B, F, "ext");
      [[A, D], [B, E], [C, F]].forEach(([v, f]) => { line(v, f, "cev"); if (len(v, O) > len(v, f)) line(f, O, "cevx"); });
      [[D, "D"], [E, "E"], [F, "F"]].forEach(([p, n]) => { const P = X(p); el("circle", { cx: P[0], cy: P[1], r: 3.5, class: "ptdot" }, stage); label(p, n, O); });
    }
    label(A, "A"); label(B, "B"); label(C, "C");
    const P = X(O);
    el("circle", { cx: P[0], cy: P[1], r: 8, class: "pdot" }, stage);
    const t = el("text", { x: P[0] + 12, y: P[1] - 12, class: "plab" }, stage); t.textContent = "O";
    readout(R);
  }

  function readout(R){
    if (!R){ ["r0","r1","r2"].forEach(i => $(i).textContent = "—"); $("prod").textContent = "—"; $("lens").textContent = "有一條線和對邊平行，碰不到。"; return; }
    R.r.forEach((x, i) => $("r" + i).textContent = fmt(x));
    $("prod").textContent = fmt(R.r[0] * R.r[1] * R.r[2]);
    const { D, E, F } = R, f = (x) => x.toFixed(1);
    $("lens").innerHTML = `<i>AF</i> ${f(len(A,F))}　<i>FB</i> ${f(len(F,B))}　<i>BD</i> ${f(len(B,D))}　<i>DC</i> ${f(len(D,C))}　<i>CE</i> ${f(len(C,E))}　<i>EA</i> ${f(len(E,A))}`;
    if (pieces){ const a1 = area(O, B, C), a2 = area(O, C, A), a3 = area(O, A, B);
      $("pnote").hidden = false;
      $("pnote").innerHTML = `△<i>BOC</i> ${a1.toFixed(1)}　△<i>COA</i> ${a2.toFixed(1)}　△<i>AOB</i> ${a3.toFixed(1)}（mm²）<br><i>AF</i>/<i>FB</i> ＝ △<i>COA</i>/△<i>BOC</i> ＝ ${fmt(a2/a1)}，<i>BD</i>/<i>DC</i> ＝ △<i>AOB</i>/△<i>COA</i> ＝ ${fmt(a3/a2)}，<i>CE</i>/<i>EA</i> ＝ △<i>BOC</i>/△<i>AOB</i> ＝ ${fmt(a1/a3)}`; }
  }

  function drawTwo(){
    const D = lerp(B, C, 2/3), E = lerp(C, A, 2/3), F = lerp(A, B, 2/3);
    const P = meet(A, D, B, E), Q = meet(B, E, C, F), R = meet(C, F, A, D);
    el("polygon", { points: [P, Q, R].map(z => X(z).join(",")).join(" "), fill: "var(--orange)", "fill-opacity": .3, stroke: "var(--orange)", "stroke-width": 1.5 }, stage);
    line(A, D, "cev"); line(B, E, "cev"); line(C, F, "cev");
    [[D, "D"], [E, "E"], [F, "F"]].forEach(([p, n]) => { const Z = X(p); el("circle", { cx: Z[0], cy: Z[1], r: 3.5, class: "ptdot" }, stage); label(p, n); });
    label(A, "A"); label(B, "B"); label(C, "C");
    ["r0","r1","r2"].forEach(i => $(i).textContent = "2.000"); $("prod").textContent = "8.000";
    $("lens").textContent = "三條線沒有交在一點，圍出了一個小三角形。";
    $("pnote").hidden = false;
    $("pnote").innerHTML = `中間小三角形 ${area(P, Q, R).toFixed(1)} mm²，整個三角形 ${area(A, B, C).toFixed(1)} mm²，比是 1 : ${(area(A, B, C)/area(P, Q, R)).toFixed(3)}`;
  }

  function clearStat(){ const s = $("stat"); s.textContent = ""; s.className = "stat"; }
  function toModel(ev){ const r = stage.getBoundingClientRect(); return M((ev.clientX - r.left) / r.width * 440, (ev.clientY - r.top) / r.height * 420); }
  function setO(p){ if (!outside && !inside(p)) return; O = p; }
  let dragging = false;
  stage.addEventListener("pointerdown", (ev) => { if (running || two) return; dragging = true; stage.setPointerCapture(ev.pointerId); setO(toModel(ev)); clearStat(); draw(); });
  stage.addEventListener("pointermove", (ev) => { if (!dragging) return; setO(toModel(ev)); draw(); });
  const stop = () => { dragging = false; }; stage.addEventListener("pointerup", stop); stage.addEventListener("pointercancel", stop);
  stage.addEventListener("keydown", (ev) => {
    const st = ev.shiftKey ? 3 : 0.5, mv = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, st], ArrowDown: [0, -st] }[ev.key];
    if (!mv || running || two) return; ev.preventDefault(); setO([O[0] + mv[0], O[1] + mv[1]]); clearStat(); draw();
  });

  function randPoint(){
    for (let i = 0; i < 1000; i++){
      const p = outside ? [-50 + Math.random()*170, -50 + Math.random()*170] : [Math.random()*70, Math.random()*A[1]];
      if (outside ? !!ratios(p) : inside(p)) return p;
    }
    return CEN.slice();
  }
  $("run").addEventListener("click", () => {
    if (running || two) return; running = true; $("run").disabled = true;
    const N = 1000; let done = 0, lo = Infinity, hi = -Infinity; const s = $("stat"); s.className = "stat";
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, per = reduce ? N : 12;
    function tick(){
      for (let i = 0; i < per && done < N; i++){ const p = randPoint(), R = ratios(p); if (!R) continue;
        const pr = R.r[0]*R.r[1]*R.r[2]; if (!isFinite(pr)) continue; O = p; lo = Math.min(lo, pr); hi = Math.max(hi, pr); done++; }
      draw();
      s.innerHTML = `檢查了 <b>${done}</b> 個點：乘起來最小 <b>${lo.toFixed(6)}</b>，最大 <b>${hi.toFixed(6)}</b>`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false;
        if (hi - lo < 1e-6){ s.classList.add("same"); s.innerHTML = `檢查了 <b>${N}</b> 個點，三個比乘起來每一次都是 <b>1</b>`; } }
    }
    requestAnimationFrame(tick);
  });
  $("home").addEventListener("click", () => { if (running) return; two = false; syncTwo(); O = START.slice(); clearStat(); draw(); });
  $("cen").addEventListener("click", () => { if (running) return; two = false; syncTwo(); O = CEN.slice(); clearStat(); draw(); });
  $("out").addEventListener("change", (e) => { outside = e.target.checked; if (!outside && !inside(O)) O = START.slice(); computeView(); clearStat(); draw(); });
  $("pieces").addEventListener("click", (e) => { pieces = !pieces; e.currentTarget.setAttribute("aria-pressed", String(pieces));
    e.currentTarget.textContent = pieces ? "收起三塊" : "顯示三塊"; if (!pieces && !two) $("pnote").hidden = true; draw(); });
  function syncTwo(){ const b = $("two"); b.setAttribute("aria-pressed", String(two)); b.textContent = two ? "回到拖動" : "三個比都是 2"; if (!two && !pieces) $("pnote").hidden = true; }
  $("two").addEventListener("click", () => { if (running) return; two = !two; syncTwo(); clearStat(); draw(); });

  computeView(); draw();
})();
</script>
