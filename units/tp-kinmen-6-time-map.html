<script>
/* ================================================================
   專題　金門有多大？　等時線互動探索站
   每一站各自包在一個函式裡；共用的只有畫布、配色與小工具。
================================================================ */
const $ = id => document.getElementById(id);
const PAL = {};
const PAL_KEYS = ['paper', 'card', 'edge', 'edge-soft', 'ink', 'ink-2', 'ink-3', 'indigo', 'indigo-soft',
  'orange', 'orange-soft', 'green', 'green-soft', 'crimson', 'violet', 'teal', 'gold'];
function readPal() {
  const cs = getComputedStyle(document.documentElement);
  PAL_KEYS.forEach(k => { PAL[k] = cs.getPropertyValue('--' + k).trim(); });
}
function rgba(c, a) {
  const h = (c || '#000000').replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
const sans = () => getComputedStyle(document.body).fontFamily;
const MATHF = '"Crimson Text","Times New Roman",Georgia,serif';
function fmt(v, d) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  return v.toFixed(d || 0).replace('-', '−');
}
const fmtMin = v => (Math.round(v * 10) / 10).toString().replace('-', '−');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.round(m % 60)).padStart(2, '0');

const REDRAW = [];
function stage(id, W, H, draw) {
  const cv = $(id), ctx = cv.getContext('2d');
  cv.style.aspectRatio = W + ' / ' + H;
  const s = { cv, ctx, W, H, w: 0, h: 0, k: 1 };
  s.resize = () => {
    const r = cv.getBoundingClientRect();
    if (!r.width) return;
    const dpr = window.devicePixelRatio || 1;
    s.w = r.width; s.h = r.width * H / W;
    cv.width = Math.round(s.w * dpr); cv.height = Math.round(s.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    s.k = s.w / W;
    draw();
  };
  s.pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / s.k, y: (e.clientY - r.top) / s.k }; };
  new ResizeObserver(s.resize).observe(cv);
  REDRAW.push(() => { if (s.w) draw(); });
  return s;
}
function boxes(el, list) {
  el.innerHTML = list.map(b => `<div class="statbox ${b[2] || ''}"><div class="k">${b[0]}</div><div class="v">${b[1]}</div></div>`).join('');
}
function segbind(id, cb) {
  const w = $(id);
  w.querySelectorAll('.seg').forEach(b => {
    b.setAttribute('aria-pressed', b.classList.contains('on'));
    b.addEventListener('click', () => {
      w.querySelectorAll('.seg').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
      cb(b.dataset.v);
    });
  });
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
/* 等高線：在格點上找變號，線性內插連線 */
function gridVals(f, x0, y0, x1, y1, nx, ny) {
  const v = new Float64Array((nx + 1) * (ny + 1)), dx = (x1 - x0) / nx, dy = (y1 - y0) / ny;
  for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) v[j * (nx + 1) + i] = f(x0 + i * dx, y0 + j * dy);
  return { v, x0, y0, dx, dy, nx, ny };
}
function contourGrid(c, g, level, X, Y, keep) {
  const { v, x0, y0, dx, dy, nx, ny } = g;
  c.beginPath();
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = v[j * (nx + 1) + i] - level, b = v[j * (nx + 1) + i + 1] - level,
      d = v[(j + 1) * (nx + 1) + i] - level, e = v[(j + 1) * (nx + 1) + i + 1] - level;
    if (![a, b, d, e].every(isFinite)) continue;
    const pts = [];
    const ed = (p, q, ax, ay, bx, by) => { if ((p < 0) !== (q < 0)) { const t = p / (p - q); pts.push([ax + (bx - ax) * t, ay + (by - ay) * t]); } };
    const xa = x0 + i * dx, ya = y0 + j * dy, xb = xa + dx, yb = ya + dy;
    ed(a, b, xa, ya, xb, ya); ed(b, e, xb, ya, xb, yb); ed(d, e, xa, yb, xb, yb); ed(a, d, xa, ya, xa, yb);
    if (pts.length >= 2) {
      if (keep && !keep((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2)) continue;
      c.moveTo(X(pts[0][0]), Y(pts[0][1])); c.lineTo(X(pts[1][0]), Y(pts[1][1]));
      if (pts.length === 4) { c.moveTo(X(pts[2][0]), Y(pts[2][1])); c.lineTo(X(pts[3][0]), Y(pts[3][1])); }
    }
  }
  c.stroke();
}
function label(c, txt, x, y, opt) {
  opt = opt || {};
  c.font = (opt.weight || '500') + ' ' + (opt.size || 13) + 'px ' + (opt.font || sans());
  c.textAlign = opt.align || 'center'; c.textBaseline = opt.base || 'alphabetic';
  if (opt.halo !== false) { c.lineWidth = 4; c.strokeStyle = opt.haloColor || PAL.card; c.lineJoin = 'round'; c.strokeText(txt, x, y); }
  c.fillStyle = opt.color || PAL.ink; c.fillText(txt, x, y);
  c.textBaseline = 'alphabetic';
}

/* ================================================================
   LAB 7　⑥ 時間地圖
================================================================ */
function lab7() {
  const HOME = { lat: 24.433, lon: 118.317 };
  const PLACES = [
    { name: '烈嶼東林', lat: 24.432, lon: 118.243, mode: 'car', t: 21 },
    { name: '廈門五通碼頭', lat: 24.519, lon: 118.182, mode: 'ferry', t: 30 },
    { name: '泉州石井碼頭', lat: 24.633, lon: 118.428, mode: 'ferry', t: 70 },
    { name: '澎湖馬公', lat: 23.568, lon: 119.628, mode: 'fly', t: 40 },
    { name: '台中', lat: 24.264, lon: 120.621, mode: 'fly', t: 50 },
    { name: '台北松山', lat: 25.069, lon: 121.552, mode: 'fly', t: 55 },
    { name: '高雄', lat: 22.577, lon: 120.350, mode: 'fly', t: 55 }
  ];
  const MODE_NAME = { car: '開車經大橋', ferry: '小三通', fly: '飛機' };
  const R_EARTH = 6371, rad = Math.PI / 180;
  PLACES.forEach(p => {
    const dl = (p.lat - HOME.lat) * rad, dn = (p.lon - HOME.lon) * rad;
    const a = Math.sin(dl / 2) ** 2 + Math.cos(HOME.lat * rad) * Math.cos(p.lat * rad) * Math.sin(dn / 2) ** 2;
    p.km = 2 * R_EARTH * Math.asin(Math.sqrt(a));
    const dx = dn * Math.cos((p.lat + HOME.lat) / 2 * rad), dy = dl;
    p.ang = Math.atan2(dy, dx);
  });
  const maxKm = Math.max(...PLACES.map(p => p.km));
  let sel = 5;
  const st = stage('m7cv', 100, 72, draw);
  const cx = 50, cy = 36, R = 31;
  const COLS = () => ({ car: PAL.gold, ferry: PAL.teal, fly: PAL.violet });

  function minutes(p) {
    const wait = $('m7wait').checked, ty = $('m7typhoon').checked, br = $('m7bridge').checked;
    if (p.mode === 'car') {
      if (!br) return p.t;
      return ty ? Infinity : 41;
    }
    if (ty) return Infinity;
    if (!wait) return p.t;
    return p.t + (p.mode === 'ferry' ? 90 : +$('m7fly').value);
  }
  const ringStep = mx => mx <= 80 ? 10 : mx <= 160 ? 20 : 30;
  function geo() {
    const s = +$('m7s').value / 100;
    const ts = PLACES.map(minutes), fin = ts.filter(isFinite);
    const step = ringStep(Math.max(...fin, 10));
    const maxMin = Math.ceil(Math.max(...fin, 10) / step) * step;
    const pos = PLACES.map((p, i) => {
      const rr = p.km / maxKm * R, rt = isFinite(ts[i]) ? ts[i] / maxMin * R : R * 1.12;
      const r = (1 - s) * rr + s * rt;
      return { x: cx + r * Math.cos(p.ang), y: cy - r * Math.sin(p.ang), t: ts[i] };
    });
    return { s, ts, maxMin, step, pos };
  }

  function draw() {
    if (!st.w) return;
    const c = st.ctx, k = st.k, g = geo(), Cm = COLS(), fs = clamp(k * 1.5, 10, 13.5);
    const X = x => x * k, Y = y => y * k;
    c.fillStyle = PAL.card; c.fillRect(0, 0, st.w, st.h);
    const dirs = ['東', '東北', '北', '西北', '西', '西南', '南', '東南'];
    dirs.forEach((nm, i) => {
      const a = i * Math.PI / 4;
      c.setLineDash([3, 5]); c.strokeStyle = PAL['edge-soft']; c.lineWidth = 1;
      c.beginPath(); c.moveTo(X(cx), Y(cy)); c.lineTo(X(cx + R * Math.cos(a)), Y(cy - R * Math.sin(a))); c.stroke(); c.setLineDash([]);
      label(c, nm, X(cx + (R + 2.6) * Math.cos(a)), Y(cy - (R + 2.6) * Math.sin(a)) + 4, { size: fs - 1, color: PAL['ink-3'], weight: 700 });
    });
    const rings = (alpha, step, max, txt) => {
      if (alpha <= 0.02) return;
      c.strokeStyle = rgba(PAL['ink-3'], 0.45 * alpha); c.lineWidth = 1;
      for (let v = step; v <= max + 1e-9; v += step) {
        const r = v / max * R; c.beginPath(); c.arc(X(cx), Y(cy), r * k, 0, Math.PI * 2); c.stroke();
        c.globalAlpha = alpha; label(c, v + ' ' + txt, X(cx) + 3, Y(cy - r) - 3, { size: fs - 2.5, align: 'left', color: PAL['ink-3'], halo: false }); c.globalAlpha = 1;
      }
    };
    rings(1 - 2 * g.s, 50, maxKm, '公里');
    rings(2 * g.s - 1, g.step, g.maxMin, '分');
    // 到不了的圈
    if (g.ts.some(t => !isFinite(t)) && g.s > 0.02) {
      c.setLineDash([6, 5]); c.strokeStyle = rgba(PAL.crimson, 0.6 * g.s); c.lineWidth = 1.5;
      c.beginPath(); c.arc(X(cx), Y(cy), R * 1.12 * k, 0, Math.PI * 2); c.stroke(); c.setLineDash([]);
    }
    // 選中的地方
    const ps = g.pos[sel];
    c.strokeStyle = PAL.ink; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(X(cx), Y(cy)); c.lineTo(X(ps.x), Y(ps.y)); c.stroke();
    // 地點
    const boxesUsed = [[X(cx) - 4, Y(cy) - 4, 60, 22]];
    const order = PLACES.map((p, i) => i).sort((a, b) => (a === sel ? -1 : b === sel ? 1 : 0));
    const hidden = [];
    for (const i of order) {
      const p = PLACES[i], q = g.pos[i], x = X(q.x), y = Y(q.y), off = !isFinite(q.t);
      c.beginPath(); c.arc(x, y, i === sel ? 7 : 5.5, 0, Math.PI * 2);
      c.fillStyle = off ? PAL.card : Cm[p.mode]; c.fill();
      c.strokeStyle = off ? PAL.crimson : PAL.card; c.lineWidth = 2; c.stroke();
      if (i === sel) { c.strokeStyle = PAL.ink; c.lineWidth = 2; c.beginPath(); c.arc(x, y, 11, 0, Math.PI * 2); c.stroke(); }
      const txt = p.name + (off ? '（停駛）' : '');
      c.font = '600 ' + fs + 'px ' + sans();
      const tw = c.measureText(txt).width, left = q.x < cx - 2;
      const bx = left ? x - 10 - tw : x + 10, by = y - fs + 2, bb = [bx - 2, by - 2, tw + 4, fs + 6];
      const clash = boxesUsed.some(u => bb[0] < u[0] + u[2] && bb[0] + bb[2] > u[0] && bb[1] < u[1] + u[3] && bb[1] + bb[3] > u[1]);
      if (clash && i !== sel) { hidden.push(p.name); continue; }
      boxesUsed.push(bb);
      label(c, txt, left ? x - 10 : x + 10, y + fs / 3, { size: fs, weight: 600, align: left ? 'right' : 'left', color: off ? PAL.crimson : PAL.ink });
    }
    c.fillStyle = PAL.ink; c.fillRect(X(cx) - 6, Y(cy) - 6, 12, 12);
    label(c, '金城', X(cx) + 9, Y(cy) + 16, { size: fs, weight: 700, align: 'left' });
    if (hidden.length) label(c, '有 ' + hidden.length + ' 個地方擠在一起，用下面的按鈕看', 8, st.h - 10, { size: fs - 2, align: 'left', color: PAL['ink-3'] });
  }

  function panel() {
    $('m7flyrow').hidden = !$('m7wait').checked;
    $('m7flyv').textContent = $('m7fly').value + ' 分';
    const notes = ['只算坐在交通工具上的時間，取自旅遊網站整理（2026 年）；烈嶼東林的時間是示意。方向和真的地圖一樣。'];
    if ($('m7wait').checked) notes.push('小三通以提早 90 分鐘到碼頭計，飛機的提早時間可以自己調。');
    if ($('m7typhoon').checked) notes.push('颱風天船和飛機都停了。');
    if ($('m7bridge').checked) notes.push('大橋封閉時，到烈嶼改搭船，約 41 分（含等船，見 ⑤）。');
    $('m7note').textContent = notes.join('');
    const Cm = COLS();
    $('m7legend').innerHTML = Object.keys(MODE_NAME).map(m => `<span><i style="background:${Cm[m]}"></i>${MODE_NAME[m]}</span>`).join('');
    $('m7pick').innerHTML = PLACES.map((p, i) => `<button class="btn${i === sel ? ' on' : ''}" data-i="${i}" aria-pressed="${i === sel}">${p.name}</button>`).join('');
    const p = PLACES[sel], t = minutes(p);
    const how = p.mode === 'car' && $('m7bridge').checked ? '搭船（大橋封閉）' : MODE_NAME[p.mode];
    boxes($('m7probe'), [
      ['地點', p.name], ['交通方式', how], ['離金城（直線）', fmt(p.km, 0) + ' 公里', 'blue'],
      ['要幾分鐘', isFinite(t) ? fmt(t, 0) + ' 分' : '停駛', 'hot'], ['每公里幾分鐘', isFinite(t) ? fmt(t / p.km, 2) : '—']
    ]);
    const rows = PLACES.map(q => ({ q, t: minutes(q) })).sort((a, b) => (b.t / b.q.km) - (a.t / a.q.km));
    $('m7tbl').innerHTML = '<thead><tr><th>地點</th><th>公里</th><th>分鐘</th><th>每公里幾分鐘</th></tr></thead><tbody>' +
      rows.map(r => `<tr><td>${r.q.name}</td><td>${fmt(r.q.km, 0)}</td><td>${isFinite(r.t) ? fmt(r.t, 0) : '停駛'}</td><td>${isFinite(r.t) ? fmt(r.t / r.q.km, 2) : '—'}</td></tr>`).join('') + '</tbody>';
  }
  function refresh() { panel(); draw(); }
  ['m7s', 'm7fly'].forEach(id => $(id).addEventListener('input', refresh));
  ['m7wait', 'm7typhoon', 'm7bridge'].forEach(id => $(id).addEventListener('change', refresh));
  $('m7pick').addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (b) { sel = +b.dataset.i; refresh(); } });
  st.cv.addEventListener('pointerdown', e => {
    const p = st.pos(e), g = geo();
    let b = -1, bd = 4;
    g.pos.forEach((q, i) => { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; b = i; } });
    if (b >= 0) { sel = b; refresh(); }
  });
  REDRAW.push(panel);
  panel();
}


readPal();
lab7(); 
const recolor = () => { readPal(); REDRAW.forEach(f => f()); };
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', recolor);
new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(recolor);

</script>
