    <p class="lede">四片一樣的直角三角形，放在同一個大正方形裡。把它們搬一搬，白色的部分變形了。什麼沒有變？</p>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const stage = $("stage"), garf = $("garf");
  const COL = ["--s1", "--s2", "--s3", "--s4"];
  let a = 30, b = 40, t = 0, target = 0, anim = null, running = false, showAng = false;

  function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  const rad = (d) => d * Math.PI / 180;
  // 直角頂點 R，股 a 沿角度 th，股 b 沿 th+90°
  function tri(R, th, a, b){ return [R, [R[0] + a*Math.cos(rad(th)), R[1] + a*Math.sin(rad(th))], [R[0] + b*Math.cos(rad(th+90)), R[1] + b*Math.sin(rad(th+90))]]; }
  function layout(a, b, t){
    const s = a + b, ROT = [0, 90, 180, 270];
    const P1 = [[0,0],[s,0],[s,s],[0,s]], P2 = [[0,a],[s,0],[a,s],[a,a]];
    return ROT.map((th, i) => tri([P1[i][0] + (P2[i][0]-P1[i][0])*t, P1[i][1] + (P2[i][1]-P1[i][1])*t], th, a, b));
  }
  function shoelace(p){ let s = 0; for (let i = 0; i < p.length; i++){ const q = p[i], r = p[(i+1) % p.length]; s += q[0]*r[1] - r[0]*q[1]; } return Math.abs(s) / 2; }
  // 擺法 1：中間的四邊形由四片三角形的斜邊圍成；擺法 2：兩塊白色正方形由三角形的頂點量出邊長
  function white1(a, b){ const T = layout(a, b, 0); return shoelace([T[0][1], T[1][1], T[2][1], T[3][1]]); }
  function white2(a, b){ // 左下、右上兩塊白色正方形：邊長由第 4 片三角形的直角頂點位置量出
    const T = layout(a, b, 1), R = T[3][0], sA = R[0], sB = (a + b) - R[1]; return [sA * sA, sB * sB]; }

  const fmt = (x) => (Math.round(x * 10) / 10).toFixed(1);
  const fmt0 = (x) => String(Math.round(x));

  function draw(){
    const s = a + b, k = s > 0 ? 360 / s : 1, ox = 40, oy = 400;
    const X = (p) => [ox + p[0]*k, oy - p[1]*k];
    stage.innerHTML = "";
    el("rect", { x: ox, y: oy - s*k, width: s*k, height: s*k, class: "box" }, stage);
    const T = layout(a, b, t);
    T.forEach((tr, i) => el("polygon", { points: tr.map(p => X(p).join(",")).join(" "), class: "tri", fill: `var(${COL[i]})`, "fill-opacity": .32 }, stage));
    if (t === 0 && showAng && a > 0 && b > 0){
      const Q = [T[0][1], T[1][1], T[2][1], T[3][1]];
      Q.forEach((q, i) => { const p = Q[(i+3) % 4], r = Q[(i+1) % 4];
        const v1 = [p[0]-q[0], p[1]-q[1]], v2 = [r[0]-q[0], r[1]-q[1]];
        const ang = Math.acos((v1[0]*v2[0] + v1[1]*v2[1]) / (Math.hypot(...v1) * Math.hypot(...v2))) * 180 / Math.PI;
        const m = [(p[0]+r[0])/2 - q[0], (p[1]+r[1])/2 - q[1]], L = Math.hypot(...m) || 1;
        const pos = X([q[0] + m[0]/L*s*0.11, q[1] + m[1]/L*s*0.11]);
        const tx = el("text", { x: pos[0], y: pos[1] + 5, "text-anchor": "middle", class: "ang" }, stage); tx.textContent = fmt(ang) + "°";
      });
    }
    // 底邊標 a、b
    const y = oy + 24;
    const la = el("text", { x: ox + a*k/2, y: y, "text-anchor": "middle", class: "lab" }, stage); la.textContent = "a";
    const lb = el("text", { x: ox + (a + b/2)*k, y: y, "text-anchor": "middle", class: "lab" }, stage); lb.textContent = "b";
    readout();
  }

  function readout(){
    const w1 = white1(a, b), [x, y] = white2(a, b);
    $("f1").textContent = `${fmt0(w1)} mm²`;
    $("f2").textContent = `${fmt0(x)} ＋ ${fmt0(y)} ＝ ${fmt0(x + y)} mm²`;
    $("a1").classList.toggle("on", t === 0); $("a2").classList.toggle("on", t === 1);
    $("now").textContent = t === 0 ? fmt0(w1) : t === 1 ? fmt0(x + y) : "…";
    $("va").textContent = a; $("vb").textContent = b;
    const c = Math.hypot(a, b);
    if (showAng) $("angInfo").textContent = (t === 0) ? `中間那塊：四條邊都是 ${fmt(c)}（每一條都是一片三角形的斜邊）。` : "搬回擺法 1 才看得到中間那塊。";
    drawGarf();
  }

  function drawGarf(){
    if ($("garfBox").hidden) return;
    garf.innerHTML = "";
    const s = a + b; if (s === 0) return;
    const k = 270 / s, ox = 40, oy = 300, X = (p) => [ox + p[0]*k, oy - p[1]*k];
    const t1 = [[0,0],[0,a],[b,0]], t2 = [[0,s],[0,a],[a,s]], mid = [[0,a],[b,0],[a,s]];
    [[t1, "--s1"], [t2, "--s2"], [mid, "--s3"]].forEach(([p, c]) => el("polygon", { points: p.map(q => X(q).join(",")).join(" "), class: "tri", fill: `var(${c})`, "fill-opacity": .32 }, garf));
    el("polygon", { points: [[0,0],[b,0],[a,s],[0,s]].map(q => X(q).join(",")).join(" "), fill: "none", stroke: "var(--ink)", "stroke-width": 2.4 }, garf);
    $("garfNote").innerHTML = `整個梯形：½(<i>a</i>＋<i>b</i>)(<i>a</i>＋<i>b</i>) ＝ ${fmt(s*s/2)}<br>拆成三塊：½<i>ab</i> ＋ ½<i>ab</i> ＋ ½<i>c</i>² ＝ ${fmt(a*b + (a*a + b*b)/2)}`;
  }

  function go(to){
    if (anim) cancelAnimationFrame(anim);
    target = to; $("move").textContent = to === 1 ? "搬回來" : "搬過去";
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce){ t = to; draw(); return; }
    const t0 = t, start = performance.now(), dur = 1400;
    function step(now){ const u = Math.min(1, (now - start) / dur), e = u < .5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2) / 2;
      t = u >= 1 ? to : t0 + (to - t0) * e; draw(); if (u < 1) anim = requestAnimationFrame(step); else anim = null; }
    anim = requestAnimationFrame(step);
  }

  $("move").addEventListener("click", () => { if (!running) go(target === 0 ? 1 : 0); });
  $("ra").addEventListener("input", (e) => { a = +e.target.value; clearStat(); draw(); });
  $("rb").addEventListener("input", (e) => { b = +e.target.value; clearStat(); draw(); });
  $("home").addEventListener("click", () => { a = 30; b = 40; $("ra").value = 30; $("rb").value = 40; clearStat(); draw(); });
  function clearStat(){ const s = $("stat"); s.textContent = ""; s.className = "stat"; }

  $("run").addEventListener("click", () => {
    if (running) return; running = true; $("run").disabled = true;
    const N = 1000; let done = 0, worst = 0; const s = $("stat"); s.className = "stat";
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const per = reduce ? N : 10;
    function tick(){
      for (let i = 0; i < per && done < N; i++, done++){
        const A = Math.random() * 60, B = Math.random() * 60;
        const w1 = white1(A, B), [x, y] = white2(A, B);
        worst = Math.max(worst, Math.abs(w1 - x - y));
        if (i === per - 1 || done === N - 1){ a = Math.round(A); b = Math.round(B); }
      }
      $("ra").value = a; $("rb").value = b; draw();
      s.innerHTML = `檢查了 <b>${done}</b> 組 <i>a</i>、<i>b</i>：兩種擺法的白色部分，最多差 <b>${worst.toFixed(6)}</b> mm²`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false;
        if (worst < 1e-6){ s.classList.add("same"); s.innerHTML = `檢查了 <b>${N}</b> 組 <i>a</i>、<i>b</i>，兩種擺法的白色部分<b>每一次都一樣大</b>`; } }
    }
    requestAnimationFrame(tick);
  });

  $("angBtn").addEventListener("click", (e) => { showAng = !showAng; e.currentTarget.setAttribute("aria-pressed", String(showAng));
    $("angInfo").hidden = !showAng; e.currentTarget.textContent = showAng ? "收起角度" : "中間那塊的角"; if (showAng && target !== 0) go(0); else draw(); });
  $("garfBtn").addEventListener("click", (e) => { const on = $("garfBox").hidden; $("garfBox").hidden = !on;
    e.currentTarget.setAttribute("aria-pressed", String(on)); e.currentTarget.textContent = on ? "收起兩片的拼法" : "兩片的拼法"; draw(); });
  stage.addEventListener("keydown", (ev) => { if (ev.key === " " || ev.key === "Enter"){ ev.preventDefault(); if (!running) go(target === 0 ? 1 : 0); } });

  draw();
})();
</script>
