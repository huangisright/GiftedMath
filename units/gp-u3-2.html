    <p class="lede">底邊不動，拖動頂點 <i>A</i>。三段長度的平方，乘什麼數加起來，才會一直不變？</p>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const fmt = (x) => (Math.round(x * 10) / 10).toFixed(1);
  const ax = (34*34 - 62*62 + 60*60) / 120;
  const HOME = { A: [ax, Math.sqrt(34*34 - ax*ax)], t: 0.5, mode: "0.5", c: [1, 1, -1] };
  const s = JSON.parse(JSON.stringify(HOME));
  const B = [0, 0], C = [60, 0];
  let showAlt = false, running = false, drag = null;
  const K = 4, O = [100, 260];
  const X = (p) => [O[0] + p[0]*K, O[1] - p[1]*K];
  const W = (q) => [(q[0] - O[0]) / K, (O[1] - q[1]) / K];
  function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls){ const e = el("text", { x, y, class: cls, "text-anchor": "middle" }); e.textContent = t; return e; }
  const d2 = (a, b) => (a[0]-b[0])**2 + (a[1]-b[1])**2;
  const Pp = () => [60 * s.t, 0];
  const comb = (A) => s.c[0]*d2(A, B) + s.c[1]*d2(A, C) + s.c[2]*d2(A, Pp());
  const names = ["<i>AB</i>²", "<i>AC</i>²", "<i>AP</i>²"];

  function buildCoef(){
    const g = $("coef"); g.innerHTML = "";
    names.forEach((n, i) => {
      const lab = document.createElement("span"); lab.innerHTML = n; g.appendChild(lab);
      const sq = document.createElement("span"); sq.className = "sq"; sq.id = "sq" + i; g.appendChild(sq);
      const m = document.createElement("button"); m.type = "button"; m.textContent = "−"; m.setAttribute("aria-label", "減少"); g.appendChild(m);
      const v = document.createElement("span"); v.className = "num"; v.id = "c" + i; g.appendChild(v);
      const p = document.createElement("button"); p.type = "button"; p.textContent = "＋"; p.setAttribute("aria-label", "增加"); g.appendChild(p);
      m.addEventListener("click", () => { s.c[i] = Math.max(-6, s.c[i] - 1); clearStat(); draw(); });
      p.addEventListener("click", () => { s.c[i] = Math.min(6, s.c[i] + 1); clearStat(); draw(); });
    });
  }
  function draw(){
    svg.innerHTML = "";
    const A = X(s.A), b = X(B), c = X(C), P = X(Pp());
    el("line", { x1: X([-24, 0])[0], y1: b[1], x2: X([84, 0])[0], y2: b[1], class: "base" });
    el("polygon", { points: [A, b, c].map(p => p.join(",")).join(" "), class: "ln" });
    el("line", { x1: A[0], y1: A[1], x2: P[0], y2: P[1], class: "cev" });
    if (showAlt){ const H = X([s.A[0], 0]);
      el("line", { x1: A[0], y1: A[1], x2: H[0], y2: H[1], class: "alt" });
      el("line", { x1: P[0], y1: P[1], x2: H[0], y2: H[1], class: "xseg" });
      el("circle", { cx: H[0], cy: H[1], r: 4, class: "pt" }); txt(H[0], H[1] + 24, "H", "lab");
      const x = s.A[0] - Pp()[0];
      txt((P[0] + H[0]) / 2, P[1] - 10, "x", "lab2");
      $("note").innerHTML = `<i>x</i> ＝ <i>PH</i> ＝ ${x >= 0 ? "" : "−"}${fmt(Math.abs(x))}（<i>H</i> 在 <i>P</i> ${x >= 0 ? "右" : "左"}邊）`; $("note").hidden = false;
    } else $("note").hidden = true;
    el("circle", { cx: P[0], cy: P[1], r: 5, class: "pt" });
    txt(b[0] - 14, b[1] + 22, "B", "lab"); txt(c[0] + 14, c[1] + 22, "C", "lab");
    txt(P[0], P[1] + 24, s.t === 0.5 ? "M" : "P", "lab"); txt(A[0], A[1] - 16, "A", "lab");
    handle(A, "A", false); if (s.mode === "free") handle(P, "P", true);
    [d2(s.A, B), d2(s.A, C), d2(s.A, Pp())].forEach((v, i) => { $("sq" + i).textContent = fmt(v); $("c" + i).textContent = (s.c[i] > 0 ? "+" : s.c[i] < 0 ? "−" : "") + Math.abs(s.c[i]); });
    const bp = 60 * s.t, pc = 60 - bp;
    $("vR").textContent = fmt(bp) + " : " + fmt(pc);
    $("vS").textContent = fmt(comb(s.A));
  }
  function handle(p, id, on){
    el("circle", { cx: p[0], cy: p[1], r: 18, class: "hit", "data-h": id });
    el("circle", { cx: p[0], cy: p[1], r: 8, class: "drag" + (on ? " on" : ""), "data-h": id });
  }
  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); clearStat(); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const w = W(svgPt(ev));
    if (drag === "A"){ w[0] = Math.max(-22, Math.min(82, w[0])); w[1] = Math.max(4, Math.min(60, w[1])); s.A = w; }
    else s.t = Math.max(0.02, Math.min(0.98, w[0] / 60));
    draw(); });
  const end = () => { drag = null; };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }

  document.querySelectorAll(".seg3 .btn").forEach(bt => bt.addEventListener("click", () => {
    if (running) return; const t = bt.getAttribute("data-t"); s.mode = t;
    if (t !== "free") s.t = +t;
    document.querySelectorAll(".seg3 .btn").forEach(o => o.setAttribute("aria-pressed", String(o === bt)));
    clearStat(); draw(); }));
  $("home").addEventListener("click", () => { if (running) return; Object.assign(s, JSON.parse(JSON.stringify(HOME)));
    document.querySelectorAll(".seg3 .btn").forEach(o => o.setAttribute("aria-pressed", String(o.getAttribute("data-t") === "0.5"))); clearStat(); draw(); });
  $("alt").addEventListener("click", () => { showAlt = !showAlt; $("alt").setAttribute("aria-pressed", String(showAlt)); draw(); });

  $("run").addEventListener("click", () => {
    if (running) return; running = true; $("run").disabled = true; clearStat();
    const N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 10;
    let done = 0, lo = Infinity, hi = -Infinity; const keep = s.A.slice();
    function tick(){
      for (let i = 0; i < step && done < N; i++, done++){
        const A = [-22 + Math.random() * 104, 4 + Math.random() * 56];
        const v = comb(A); lo = Math.min(lo, v); hi = Math.max(hi, v); s.A = A;
      }
      draw(); $("stat").innerHTML = `試了 <b>${done}</b> 個 <i>A</i>：最小 <b>${fmt(lo)}</b>，最大 <b>${fmt(hi)}</b>`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false; s.A = keep; draw();
        $("stat").innerHTML = `試了 <b>${N}</b> 個 <i>A</i>：最小 <b>${fmt(lo)}</b>，最大 <b>${fmt(hi)}</b>` + (Math.abs(hi - lo) < 0.05 ? "　一直沒變" : "　會變");
        if (Math.abs(hi - lo) < 0.05) $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  svg.addEventListener("keydown", (ev) => { const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[ev.key]; if (!m) return;
    ev.preventDefault(); s.A = [Math.max(-22, Math.min(82, s.A[0] + m[0])), Math.max(4, Math.min(60, s.A[1] + m[1]))]; clearStat(); draw(); });
  buildCoef(); draw();
})();
</script>
