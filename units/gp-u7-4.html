(function(){
  const NS="http://www.w3.org/2000/svg", $=(id)=>document.getElementById(id), svg=$("stage");

  let kind="3", g={r:false,a:0}, anim=null, showAx=false, morley=false, log=[];
  function shapeDef(k){
    if(k==="R"){ const w=1, h=0.62, L=Math.hypot(w,h), t=Math.atan2(h,w)*180/Math.PI;
      return { angs:[180-t,180+t,360-t,t], radius:R0, rots:[["轉半圈",180]], axes:[["翻 直",90],["翻 橫",0]], letters:"ABCD" }; }
    const n=+k, st=k==="4"?135:90, angs=[...Array(n)].map((_,i)=>st+360/n*i);
    const rn=["轉","轉兩次","轉三次","轉四次"], rots=[...Array(n-1)].map((_,i)=>[rn[i],360/n*(i+1)]);
    let axes;
    if(n===4) axes=[["翻 1",135],["翻 2",45],["翻 直",90],["翻 橫",0]];
    else axes=[...Array(n)].map((_,i)=>["翻 "+(i+1),norm(angs[i])%180]);
    return { angs, radius:R0*(n===5?0.95:1), rots, axes, letters:"ABCDE".slice(0,n) };
  }
  let S=shapeDef(kind);
  const app=(m,x)=>m.r?{r:!x.r,a:norm(m.a-x.a)}:{r:x.r,a:norm(m.a+x.a)};   // 先 x 再 m
  const act=(x,p)=>{ const y=x.r?-p[1]:p[1], c=Math.cos(rad(x.a)), s=Math.sin(rad(x.a)); return [p[0]*c-y*s, p[0]*s+y*c]; };
  const ID={r:false,a:0};
  function moves(){ return [["不動",ID]].concat(S.rots.map(([n,t])=>[n,{r:false,a:t}])).concat(S.axes.map(([n,f])=>[n,{r:true,a:norm(2*f)}])); }
  const same=(x,y)=>x.r===y.r&&Math.min(norm(x.a-y.a),360-norm(x.a-y.a))<1e-6;
  const nameOf=(x)=>{ const m=moves().find(([n,y])=>same(x,y)); return m?m[0]:"?"; };
  const V=(i)=>[Math.cos(rad(S.angs[i])),Math.sin(rad(S.angs[i]))];
  const X=(p,r)=>[C0[0]+p[0]*(r||S.radius), C0[1]-p[1]*(r||S.radius)];
  function el(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
  function txt(q,t,cls,fill){const e=el("text",{x:q[0],y:q[1],class:cls,"text-anchor":"middle","dominant-baseline":"middle"});if(fill)e.style.fill=fill;e.textContent=t;return e;}
  function arrangement(x){ const n=S.angs.length, out=Array(n);
    for(let j=0;j<n;j++){ const p=act(x,V(j)); let best=0,bd=9; for(let i=0;i<n;i++){const v=V(i),d=Math.hypot(p[0]-v[0],p[1]-v[1]); if(d<bd){bd=d;best=i;}} out[best]=S.letters[j]; }
    return out.join(""); }
  function drawSym(){
    svg.innerHTML=""; const n=S.angs.length;
    el("polygon",{points:[...Array(n)].map((_,i)=>X(V(i)).join(",")).join(" "),class:"base"});
    for(let i=0;i<n;i++){ const v=V(i); txt(X([v[0]*1.17,v[1]*1.17]),String(i+1),"pos"); }
    if(showAx){ const cols=["var(--orange)","var(--green)","var(--indigo)","var(--s4)","var(--s5)"];
      S.axes.forEach(([nm,f],i)=>{ const u=[Math.cos(rad(f)),Math.sin(rad(f))], a=X([-u[0]*1.32,-u[1]*1.32]), b=X([u[0]*1.32,u[1]*1.32]);
        const e=el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:"axis"}); e.style.stroke=cols[i%5];
        txt(X([u[0]*1.25+0.06,u[1]*1.25+0.08]),nm,"axl",cols[i%5]); }); }
    // 卡片：g 之後，若正在動畫則插值
    let pts=[...Array(n)].map((_,j)=>act(g,V(j))), flipped=g.r;
    if(anim){ const {from,m,t}=anim; const p0=[...Array(n)].map((_,j)=>act(from,V(j)));
      if(!m.r){ pts=p0.map(p=>{const c=Math.cos(rad(m.a*t)),s=Math.sin(rad(m.a*t));return [p[0]*c-p[1]*s,p[0]*s+p[1]*c];}); flipped=from.r; }
      else { const f=m.a/2, u=[Math.cos(rad(f)),Math.sin(rad(f))], w=(1-Math.cos(Math.PI*t))/2;
        pts=p0.map(p=>{const d=p[0]*u[0]+p[1]*u[1], q=[2*d*u[0]-p[0],2*d*u[1]-p[1]];return [p[0]+(q[0]-p[0])*w,p[1]+(q[1]-p[1])*w];}); flipped=t<0.5?from.r:!from.r; } }
    el("polygon",{points:pts.map(p=>X(p,S.radius*0.94).join(",")).join(" "),class:"card "+(flipped?"back":"front")});
    pts.forEach((p,j)=>txt(X([p[0]*0.72,p[1]*0.72]),S.letters[j],"let"));
    $("arr").textContent=arrangement(g);
  }
  function setShape(k){ kind=k; S=shapeDef(k); g=ID; log=[]; anim=null; $("log").textContent=""; $("tbl").innerHTML="";
    document.querySelectorAll("#shape button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.s===k)));
    const box=$("mvbtns"); box.innerHTML=""; moves().slice(1).forEach(([nm,m])=>{ const b=document.createElement("button"); b.type="button"; b.className="btn"; b.textContent=nm; b.addEventListener("click",()=>doMove(nm,m)); box.appendChild(b); });
    drawSym(); }
  function doMove(nm,m){ if(anim) return; const from=g, to=app(m,g); log.push(nm); $("log").textContent="做過："+log.join(" → ")+"　＝　"+nameOf(to);
    const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduce){ g=to; drawSym(); return; } const t0=performance.now();
    function f(t){ const u=Math.min(1,(t-t0)/600); anim={from,m,t:u}; drawSym(); if(u<1) requestAnimationFrame(f); else { anim=null; g=to; drawSym(); } }
    requestAnimationFrame(f); }
  document.querySelectorAll("#shape button").forEach(b=>b.addEventListener("click",()=>setShape(b.dataset.s)));
  $("clear").addEventListener("click",()=>{ g=ID; log=[]; $("log").textContent=""; $("tbl").innerHTML=""; drawSym(); });
  $("fill").addEventListener("click",()=>{ const M=moves(); let h='<table class="ct"><tr><th>先＼再</th>'+M.map(([n])=>"<th>"+n+"</th>").join("")+"</tr>";
    M.forEach(([a,x])=>{ h+="<tr><th>"+a+"</th>"+M.map(([b,y])=>{const z=app(y,x),nm=nameOf(z);return '<td class="'+(z.r?"flp":(nm==="不動"?"":"rot"))+'">'+nm+"</td>";}).join("")+"</tr>"; });
    $("tbl").innerHTML=h+"</table>"; });
  $("axes").addEventListener("click",()=>{ showAx=!showAx; $("axes").setAttribute("aria-pressed",String(showAx)); if(!morley) drawSym(); });

  // ===== 莫利 =====
  let T={A:[-0.2,0.85],B:[-0.85,-0.55],C:[0.95,-0.5]}, drag=null, mrunning=false;
  const MK=170, MX=(p)=>[C0[0]+p[0]*MK, C0[1]-p[1]*MK+10], MW=(q)=>[(q[0]-C0[0])/MK,(C0[1]+10-q[1])/MK];
  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]), cr=(o,p,q)=>(p[0]-o[0])*(q[1]-o[1])-(p[1]-o[1])*(q[0]-o[0]);
  const rotv=(v,d)=>{const c=Math.cos(rad(d)),s=Math.sin(rad(d));return [v[0]*c-v[1]*s,v[0]*s+v[1]*c];};
  const ang=(p,q,r)=>{const u=sub(q,p),v=sub(r,p);return Math.acos(Math.max(-1,Math.min(1,(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v)))))*180/Math.PI;};
  function inter(p,u,q,v){const d=u[0]*v[1]-u[1]*v[0];const t=((q[0]-p[0])*v[1]-(q[1]-p[1])*v[0])/d;return [p[0]+u[0]*t,p[1]+u[1]*t];}
  function mpt(P,Q,R){ // 靠近 PQ 邊的交點，R 為第三頂點
    const sgP=Math.sign(cr(P,Q,R)), sgQ=Math.sign(cr(Q,P,R));
    const u=rotv(sub(Q,P),sgP*ang(P,Q,R)/3), v=rotv(sub(P,Q),sgQ*ang(Q,P,R)/3); return [inter(P,u,Q,v),u,v]; }
  function morleyPts(t){ return [mpt(t.B,t.C,t.A),mpt(t.C,t.A,t.B),mpt(t.A,t.B,t.C)]; }
  function drawMor(){
    svg.innerHTML=""; const M=morleyPts(T);
    const tri=[T.A,T.B,T.C]; el("polygon",{points:tri.map(p=>MX(p).join(",")).join(" "),class:"mtri"});
    [[T.B,T.C],[T.C,T.A],[T.A,T.B]].forEach(([P,Q],i)=>{ const p=M[i][0]; [P,Q].forEach(V0=>{const a=MX(V0),b=MX(p);const e=el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:"trs"});}); });
    el("polygon",{points:M.map(m=>MX(m[0]).join(",")).join(" "),class:"mor"});
    const G=[(T.A[0]+T.B[0]+T.C[0])/3,(T.A[1]+T.B[1]+T.C[1])/3];
    ["A","B","C"].forEach(h=>{const p=T[h],v=sub(p,G),L=Math.hypot(...v)||1,q=MX(p);txt([q[0]+v[0]/L*22,q[1]-v[1]/L*22],h,"let");
      el("circle",{cx:q[0],cy:q[1],r:18,class:"hit","data-h":h}); el("circle",{cx:q[0],cy:q[1],r:7,class:"drag","data-h":h});});
    const d=[dist(M[0][0],M[1][0]),dist(M[1][0],M[2][0]),dist(M[2][0],M[0][0])].map(x=>x*30);
    $("m1").textContent=d.map(x=>x.toFixed(2)).join("　"); const gp=Math.max(...d)-Math.min(...d); $("md").textContent=gp<0.005?"0.00":gp.toFixed(2);
  }
  function svgPt(ev){const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());return [q.x,q.y];}
  svg.addEventListener("pointerdown",(ev)=>{ if(!morley||mrunning) return; const h=ev.target.getAttribute&&ev.target.getAttribute("data-h"); if(!h) return; drag=h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove",(ev)=>{ if(!drag) return; const w=MW(svgPt(ev)); const o={...T,[drag]:[Math.max(-1.2,Math.min(1.2,w[0])),Math.max(-1.1,Math.min(1.1,w[1]))]};
    if(Math.abs(cr(o.A,o.B,o.C))<0.02) return; T=o; $("mstat").textContent=""; drawMor(); });
  const end=()=>{drag=null;}; svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);
  $("mor").addEventListener("click",()=>{ morley=!morley; $("mor").setAttribute("aria-pressed",String(morley)); $("symUI").hidden=morley; $("morUI").hidden=!morley;
    $("hint").textContent=morley?"每個角分成三等份，靠近同一邊的兩條交於一點。頂點可以拖。":"底座上的數字是位置，卡片上的字母跟著卡片走。橘色是正面，藍色是背面。";
    if(morley) drawMor(); else drawSym(); });
  $("mrun").addEventListener("click",()=>{ if(mrunning) return; mrunning=true; $("mrun").disabled=true; $("mstat").textContent="";
    const keep=JSON.parse(JSON.stringify(T)), N=1000, reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches, stp=reduce?N:25; let done=0, worst=0;
    function tick(){ for(let i=0;i<stp&&done<N;i++){ const r=()=>[Math.random()*2.2-1.1,Math.random()*2-1]; const t={A:r(),B:r(),C:r()};
        if(Math.abs(cr(t.A,t.B,t.C))<0.05) continue; const M=morleyPts(t); const d=[dist(M[0][0],M[1][0]),dist(M[1][0],M[2][0]),dist(M[2][0],M[0][0])];
        worst=Math.max(worst,(Math.max(...d)-Math.min(...d))/Math.max(...d)); T=t; done++; }
      drawMor(); $("mstat").innerHTML=`換了 <b>${done}</b> 個`;
      if(done<N) requestAnimationFrame(tick); else { mrunning=false; $("mrun").disabled=false; T=keep; drawMor(); $("mstat").innerHTML=`${done} 個三角形：三邊（相對）最多差 <b>${worst<1e-6?"＜ 0.000001":worst.toExponential(1)}</b>`; } }
    requestAnimationFrame(tick); });
  setShape("3");
})();
</script>
