<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元六　第 3 節</div>
    <h1>中點兩邊一樣長</h1>
    <p class="lede"><i>M</i> 是弦 <i>AB</i> 的中點。穿過 <i>M</i> 的兩條弦 <i>CD</i>、<i>EF</i>；連 <i>CF</i>、<i>ED</i>，交 <i>AB</i> 於 <i>P</i>、<i>Q</i>。拖 <i>C</i>、<i>E</i>。</p>
  </header>

  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 420 420" role="img" aria-label="圓、弦 AB 與穿過中點的兩條弦" tabindex="0"></svg>
      <p class="hint">橘色的 <i>C</i>、<i>E</i> 沿著圓拖。單位 mm；預設和學習單第 1 頁一樣。</p>
    </div>

    <div class="panel">
      <div class="rows">
        <div class="row"><span class="sw" style="background:var(--indigo)"></span><span><i>PM</i></span><span class="val" id="vP"></span></div>
        <div class="row"><span class="sw" style="background:var(--indigo)"></span><span><i>MQ</i></span><span class="val" id="vQ"></span></div>
        <div class="row" id="rowX" hidden><span class="sw" style="background:var(--orange)"></span><span><i>CP</i>·<i>PF</i>　│　<i>AP</i>·<i>PB</i></span><span class="val" id="vX" style="font-size:19px"></span></div>
        <div class="row" id="rowY" hidden><span class="sw" style="background:var(--orange)"></span><span><i>EQ</i>·<i>QD</i>　│　<i>AQ</i>·<i>QB</i></span><span class="val" id="vY" style="font-size:19px"></span></div>
      </div>
      <div class="sum"><span class="k">相差（mm）</span><span class="v" id="vd" style="font-size:clamp(34px,5vw,48px)"></span></div>

      <div class="controls">
        <div class="btns">
          <button type="button" class="btn primary" id="run">隨機換 1000 組弦</button>
          <button type="button" class="btn" id="home">回到學習單的圖</button>
        </div>
        <div class="btns">
          <button type="button" class="btn" id="free" aria-pressed="false">讓 <i>M</i> 離開中點</button>
        </div>
        <div class="stat" id="stat" aria-live="polite"></div>
        <p class="q" id="ask" hidden>電腦確認了一千組弦。你還需要什麼？</p>
        <details id="more">
          <summary>更多</summary>
          <div class="btns">
            <button type="button" class="btn" id="tri" aria-pressed="false">塗出四個三角形</button>
            <button type="button" class="btn" id="prod" aria-pressed="false">乘積</button>
          </div>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage"), R = 37, Y0 = -12, HALF = 35, K = 4.5, O0 = [210, 210];
  const rad = (d) => d*Math.PI/180;
  function onLine(M, th){ const u = [Math.cos(th), Math.sin(th)], b = M[0]*u[0] + M[1]*u[1], c = M[0]*M[0] + M[1]*M[1] - R*R, sq = Math.sqrt(b*b - c);
    return [[M[0] + u[0]*(-b + sq), M[1] + u[1]*(-b + sq)], [M[0] + u[0]*(-b - sq), M[1] + u[1]*(-b - sq)]]; }
  const HOME = () => ({ m: 0, C: onLine([0, Y0], rad(64))[0], E: onLine([0, Y0], rad(106))[0] });
  let s = HOME(), free = false, showT = false, showP = false, running = false, drag = null;
  const X = (p) => [O0[0] + p[0]*K, O0[1] - p[1]*K];
  const W = (q) => [(q[0] - O0[0]) / K, (O0[1] - q[1]) / K];
  function el(tag, a){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls, fill){ const e = el("text", { x, y, class: cls, "text-anchor": "middle", "dominant-baseline": "middle" }); if (fill) e.style.fill = fill; e.textContent = t; return e; }
  function line(P, Q, cls){ const a = X(P), b = X(Q); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: cls }); }
  function dot(P, c, r){ const q = X(P); el("circle", { cx: q[0], cy: q[1], r: r || 4, fill: c }); }
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  function cutAB(P, Q){ const t = (Y0 - P[1]) / (Q[1] - P[1]); return [P[0] + t*(Q[0]-P[0]), Y0]; }
  function geo(st){
    const M = [st.m, Y0], A = [-HALF, Y0], B = [HALF, Y0];
    const D = onLine(M, Math.atan2(st.C[1] - Y0, st.C[0] - st.m) + Math.PI)[0], F = onLine(M, Math.atan2(st.E[1] - Y0, st.E[0] - st.m) + Math.PI)[0];
    const P = cutAB(st.C, F), Q = cutAB(st.E, D);
    return { M, A, B, C: st.C, D, E: st.E, F, P, Q };
  }
  const fmt = (g) => g < 1e-6 ? "＜ 0.000001" : (g < 0.01 ? g.toExponential(1) : g.toFixed(3));
  function draw(){
    svg.innerHTML = ""; const g = geo(s);
    const o = X([0, 0]); el("circle", { cx: o[0], cy: o[1], r: R*K, class: "circ" });
    if (showT){ [[g.C, g.M, g.P, "tO"], [g.D, g.M, g.Q, "tO"], [g.E, g.M, g.Q, "tB"], [g.F, g.M, g.P, "tB"]].forEach(([a, b, c, k]) => el("polygon", { points: [a, b, c].map(p => X(p).join(",")).join(" "), class: k })); }
    line(g.A, g.B, "ab"); line(g.C, g.D, "ch"); line(g.E, g.F, "ch"); line(g.C, g.F, "wing"); line(g.E, g.D, "wing");
    [g.A, g.B, g.D, g.F].forEach(p => dot(p, "var(--ink)"));
    dot(g.P, "var(--indigo)"); dot(g.Q, "var(--indigo)"); dot(g.M, free ? "var(--orange)" : "var(--ink)", free ? 6 : 4.5);
    [["A", g.A], ["B", g.B], ["C", g.C], ["D", g.D], ["E", g.E], ["F", g.F]].forEach(([t, V]) => { const L = Math.hypot(...V), q = X([V[0]*(1 + 6/L), V[1]*(1 + 6/L)]); txt(q[0], q[1], t, "lab"); });
    { const q = X(g.M); txt(q[0] - 14, q[1] + 14, "M", "lab2"); const p = X(g.P); txt(p[0] + 10, p[1] - 14, "P", "lab2", "var(--indigo)"); const r = X(g.Q); txt(r[0] - 10, r[1] - 14, "Q", "lab2", "var(--indigo)"); }
    [["C", g.C], ["E", g.E]].concat(free ? [["M", g.M]] : []).forEach(([id, V]) => { const p = X(V); el("circle", { cx: p[0], cy: p[1], r: 18, class: "hit", "data-h": id }); if (id !== "M") el("circle", { cx: p[0], cy: p[1], r: 8, class: "drag", "data-h": id }); });
    const pm = dist(g.P, g.M), mq = dist(g.M, g.Q);
    $("vP").textContent = pm.toFixed(2); $("vQ").textContent = mq.toFixed(2); $("vd").textContent = Math.abs(pm - mq).toFixed(2);
    $("vX").textContent = (dist(g.C, g.P)*dist(g.P, g.F)).toFixed(1) + "　│　" + (dist(g.A, g.P)*dist(g.P, g.B)).toFixed(1);
    $("vY").textContent = (dist(g.E, g.Q)*dist(g.Q, g.D)).toFixed(1) + "　│　" + (dist(g.A, g.Q)*dist(g.Q, g.B)).toFixed(1);
    $("rowX").hidden = !showP; $("rowY").hidden = !showP;
  }
  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const w = W(svgPt(ev));
    if (drag === "M"){ s.m = Math.max(-25, Math.min(25, w[0])); }
    else { let a = Math.atan2(w[1], w[0]); const p = [R*Math.cos(a), R*Math.sin(a)]; if (p[1] < Y0 + 4) return;
      const t = { ...s, [drag]: p }, g = geo(t); if (!isFinite(g.P[0]) || !isFinite(g.Q[0]) || Math.abs(g.P[0]) > 60 || Math.abs(g.Q[0]) > 60) return;
      const aC = Math.atan2(t.C[1] - Y0, t.C[0] - t.m), aE = Math.atan2(t.E[1] - Y0, t.E[0] - t.m); if (aC >= aE - 0.05) return; s = t; }
    clearStat(); draw(); });
  const end = () => { drag = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }
  function tog(id, f){ $(id).addEventListener("click", () => { const v = f(); $(id).setAttribute("aria-pressed", String(v)); draw(); }); }
  tog("free", () => { free = !free; if (!free) s.m = 0; clearStat(); return free; });
  tog("tri", () => (showT = !showT)); tog("prod", () => (showP = !showP));
  $("home").addEventListener("click", () => { if (running) return; const f = free; s = HOME(); if (f) s.m = 0; clearStat(); draw(); });
  $("run").addEventListener("click", () => {
    if (running) return; clearStat(); running = true; $("run").disabled = true;
    const keep = { ...s }, N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 25;
    let done = 0, worst = 0;
    function tick(){
      for (let i = 0; i < step && done < N; i++){
        const M = [s.m, Y0], a1 = rad(15 + Math.random()*75), a2 = rad(95 + Math.random()*70);
        const t = { m: s.m, C: onLine(M, a1)[0], E: onLine(M, a2)[0] }, g = geo(t);
        if (!isFinite(g.P[0]) || !isFinite(g.Q[0])) continue; s = t; worst = Math.max(worst, Math.abs(dist(g.P, g.M) - dist(g.M, g.Q))); done++;
      }
      draw(); $("stat").innerHTML = `換了 <b>${done}</b> 組弦`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false; s = keep; draw();
        $("stat").innerHTML = `${done} 組弦：<i>PM</i> 和 <i>MQ</i> 最多差 <b>${fmt(worst)}</b> mm`; $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  draw();
})();
</script>
