<script>
(function(){
  const NS="http://www.w3.org/2000/svg", $=(id)=>document.getElementById(id), svg=$("stage");
  const HOME=()=>({O:[0,0],A:[17.9,23.8],B:[38,14.9],C:[28.5,0.5],l:[1.65,2.0,3.05]});
  let s=HOME(), showPts=false, mode3=false, lift=0, yaw=-60, pitch=35, topView=false, drag=null, running=false;
  // 平面視窗：固定在 HOME 的範圍
  const VX0=-62, VX1=125, VY0=-20, VY1=80;
  const K=Math.min(420/(VX1-VX0),420/(VY1-VY0));
  const X2=p=>[10+(p[0]-VX0)*K, 220+((VY0+VY1)/2-p[1])*K];
  const W2=q=>[(q[0]-10)/K+VX0, (VY0+VY1)/2-(q[1]-220)/K];
  const sub=(a,b)=>a.map((x,i)=>x-b[i]), add=(a,b)=>a.map((x,i)=>x+b[i]), mul=(a,k)=>a.map(x=>x*k), dot=(a,b)=>a.reduce((t,x,i)=>t+x*b[i],0);
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]], nrm=a=>mul(a,1/Math.hypot(...a));
  function inter(p1,p2,p3,p4){const d=(p1[0]-p2[0])*(p3[1]-p4[1])-(p1[1]-p2[1])*(p3[0]-p4[0]); if(Math.abs(d)<1e-12)return null;
    const t=((p1[0]-p3[0])*(p3[1]-p4[1])-(p1[1]-p3[1])*(p3[0]-p4[0]))/d; return [p1[0]+t*(p2[0]-p1[0]),p1[1]+t*(p2[1]-p1[1])];}
  function inter3(p,u,q,v){ // 兩條空間直線（共面）交點
    const w=sub(p,q), a=dot(u,u), b=dot(u,v), c=dot(v,v), d=dot(u,w), e=dot(v,w), den=a*c-b*b; if(Math.abs(den)<1e-12) return null;
    const t=(b*e-c*d)/den; return add(p,mul(u,t)); }
  const prime=(st,i)=>{const P=[st.A,st.B,st.C][i]; return add(st.O,mul(sub(P,st.O),st.l[i]));};
  function pqr(st){const A=st.A,B=st.B,C=st.C,A1=prime(st,0),B1=prime(st,1),C1=prime(st,2);
    return [inter(B,C,B1,C1),inter(C,A,C1,A1),inter(A,B,A1,B1)];}
  const dev=(P,Q,R)=>{const d=sub(Q,P); return Math.abs(d[0]*(R[1]-P[1])-d[1]*(R[0]-P[0]))/Math.hypot(...d);};
  function el(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
  function txt(q,t,dx,dy,fill){const e=el("text",{x:q[0]+dx,y:q[1]+dy,class:"lab","text-anchor":"middle","dominant-baseline":"middle"});if(fill)e.style.fill=fill;e.textContent=t;}
  const ln=(a,b,cls)=>el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:cls});
  const far=(a,b,X)=>Math.hypot(a[0]-X[0],a[1]-X[1])>Math.hypot(b[0]-X[0],b[1]-X[1])?a:b;
  function handle(q,h){el("circle",{cx:q[0],cy:q[1],r:16,class:"hit","data-h":h});el("circle",{cx:q[0],cy:q[1],r:6.5,class:"drag","data-h":h});}
  function draw2(){
    svg.innerHTML="";
    const A=s.A,B=s.B,C=s.C,A1=prime(s,0),B1=prime(s,1),C1=prime(s,2), [P,Q,R]=pqr(s);
    [A1,B1,C1].forEach((Z,i)=>{const e=sub(Z,s.O); ln(X2(s.O),X2(add(s.O,mul(e,1.12))),"ray");});
    if(showPts&&P&&Q&&R){
      [[B,C,P],[B1,C1,P],[C,A,Q],[C1,A1,Q],[A,B,R],[A1,B1,R]].forEach(([u,v,X])=>ln(X2(far(u,v,X)),X2(X),"ex"));
      const ps=[P,Q,R].sort((a,b)=>a[0]-b[0]); const d=nrm([ps[2][0]-ps[0][0],ps[2][1]-ps[0][1],0]);
      ln(X2([ps[0][0]-d[0]*8,ps[0][1]-d[1]*8]),X2([ps[2][0]+d[0]*8,ps[2][1]+d[1]*8]),"ax");
      [[P,"P"],[Q,"Q"],[R,"R"]].forEach(([X,t])=>{const q=X2(X);el("circle",{cx:q[0],cy:q[1],r:5,fill:"#c0392b"});txt(q,t,0,-14,"#c0392b");});
    }
    el("polygon",{points:[A,B,C].map(p=>X2(p).join(",")).join(" "),class:"t1"});
    el("polygon",{points:[A1,B1,C1].map(p=>X2(p).join(",")).join(" "),class:"t2"});
    [["O",s.O,-14,8],["A",A,-12,-10],["B",B,14,-6],["C",C,4,16],["A′",A1,-14,-10],["B′",B1,16,-6],["C′",C1,8,16]].forEach(([t,p,dx,dy])=>txt(X2(p),t,dx,dy));
    ["O","A","B","C"].forEach(h=>handle(X2(s[h]),h)); [A1,B1,C1].forEach((p,i)=>handle(X2(p),"l"+i));
    $("vd").textContent=(P&&Q&&R)?(dev(P,Q,R)<1e-9?"0":dev(P,Q,R).toExponential(1)):"（有一組平行）";
  }
  // ---- 立起來 ----
  function scene(){
    const c=[(s.A[0]+s.B[0]+s.C[0]+s.O[0])/4,(s.A[1]+s.B[1]+s.C[1]+s.O[1])/4];
    const X=[c[0]+5,c[1]+12,95];
    const z=(p)=>[p[0],p[1],0];
    const A=z(s.A),B=z(s.B),C=z(s.C),O=z(s.O),A1p=z(prime(s,0)),B1=z(prime(s,1)),C1=z(prime(s,2));
    const A3=add(A,mul(sub(X,A),0.45*lift));
    const A31=inter3(O,sub(A3,O),X,sub(A1p,X))||A1p;
    const P3=z(pqr(s)[0]||[0,0]);
    const Q3=inter3(C,sub(A3,C),C1,sub(A31,C1)), R3=inter3(A3,sub(B,A3),A31,sub(B1,A31));
    return {X,A:A3,B,C,O,A1:A31,B1,C1,P:P3,Q:Q3,R:R3,ctr:[c[0],c[1],10]};
  }
  function cam3(sc){
    if(topView){ const E=sc.X; return {E,f:[0,0,-1],r:[1,0,0],u:[0,1,0]}; }
    const y=yaw*Math.PI/180,p=pitch*Math.PI/180, D=230;
    const E=add(sc.ctr,[D*Math.cos(p)*Math.cos(y),D*Math.cos(p)*Math.sin(y),D*Math.sin(p)]);
    const f=nrm(sub(sc.ctr,E)), r=nrm(cross(f,[0,0,1])), u=cross(r,f); return {E,f,r,u};
  }
  function draw3(){
    svg.innerHTML=""; const sc=scene(), cm=cam3(sc);
    const pr=(X)=>{const q=sub(X,cm.E),d=dot(q,cm.f); return [dot(q,cm.r)/d,dot(q,cm.u)/d];};
    const names=["A","B","C","O","A1","B1","C1","P","Q","R"]; const pts=names.map(k=>sc[k]).filter(Boolean).map(pr);
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; pts.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);});
    const k=Math.min(380/(x1-x0),360/(y1-y0)), T=(X)=>{const p=pr(X);return [220+(p[0]-(x0+x1)/2)*k,220-(p[1]-(y0+y1)/2)*k];};
    // 桌面格線
    for(let i=-60;i<=130;i+=20){ln(T([i,-25,0]),T([i,85,0]),"ex").style.opacity=.35;} for(let j=-20;j<=80;j+=20){ln(T([-60,j,0]),T([130,j,0]),"ex").style.opacity=.35;}
    const hull=(P)=>{P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[],up=[];
      for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p);} for(const p of P.slice().reverse()){while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p);} return lo.slice(0,-1).concat(up.slice(0,-1));};
    if(lift>0&&sc.P&&sc.Q&&sc.R){ [[sc.A,sc.B,sc.C,"pl1"],[sc.A1,sc.B1,sc.C1,"pl2"]].forEach(([a,b,c,cls])=>{ const h=hull([a,b,c,sc.P,sc.Q,sc.R].map(T)); el("polygon",{points:h.map(p=>p.join(",")).join(" "),class:cls}); }); }
    [sc.A1,sc.B1,sc.C1].forEach(Z=>ln(T(sc.O),T(add(sc.O,mul(sub(Z,sc.O),1.1))),"ray"));
    if(sc.P&&sc.Q&&sc.R){ [[sc.B,sc.C,sc.P],[sc.B1,sc.C1,sc.P],[sc.C,sc.A,sc.Q],[sc.C1,sc.A1,sc.Q],[sc.A,sc.B,sc.R],[sc.A1,sc.B1,sc.R]].forEach(([u,v,X])=>ln(T(far(u,v,X)),T(X),"ex"));
      const L=[sc.P,sc.Q,sc.R].map(T).sort((a,b)=>a[0]-b[0]); const d=nrm([L[2][0]-L[0][0],L[2][1]-L[0][1],0]); ln([L[0][0]-d[0]*20,L[0][1]-d[1]*20],[L[2][0]+d[0]*20,L[2][1]+d[1]*20],"ax");
      [[sc.P,"P"],[sc.Q,"Q"],[sc.R,"R"]].forEach(([X,t])=>{const q=T(X);el("circle",{cx:q[0],cy:q[1],r:5,fill:"#c0392b"});txt(q,t,0,-14,"#c0392b");}); }
    el("polygon",{points:[sc.A,sc.B,sc.C].map(p=>T(p).join(",")).join(" "),class:"t1"});
    el("polygon",{points:[sc.A1,sc.B1,sc.C1].map(p=>T(p).join(",")).join(" "),class:"t2"});
    if(!topView&&lift>0){ const x=T(sc.X); el("circle",{cx:x[0],cy:x[1],r:4,fill:"var(--ink-3)"}); txt(x,"X",12,-6);
      [sc.A,sc.A1].forEach(Z=>{const e=el("line",{x1:x[0],y1:x[1],x2:T(Z)[0],y2:T(Z)[1],class:"ray"}); e.style.opacity=.6;}); }
    [["O",sc.O],["A",sc.A],["B",sc.B],["C",sc.C],["A′",sc.A1],["B′",sc.B1],["C′",sc.C1]].forEach(([t,p])=>{const q=T(p);el("circle",{cx:q[0],cy:q[1],r:3.5,fill:"var(--ink)"});txt(q,t,12,-8);});
    $("vd").textContent=(sc.P&&sc.Q&&sc.R)?"交線上":"—";
  }
  const draw=()=>{ if(mode3) draw3(); else draw2(); $("liftv").textContent=lift.toFixed(2); };
  function svgPt(ev){const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());return [q.x,q.y];}
  svg.addEventListener("pointerdown",ev=>{ if(running) return; if(mode3){drag={rot:[ev.clientX,ev.clientY,yaw,pitch]}; svg.setPointerCapture(ev.pointerId); return;}
    const h=ev.target.getAttribute&&ev.target.getAttribute("data-h"); if(!h) return; drag={h}; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove",ev=>{ if(!drag) return;
    if(drag.rot){ topView=false; yaw=drag.rot[2]-(ev.clientX-drag.rot[0])*0.5; pitch=Math.max(8,Math.min(88,drag.rot[3]+(ev.clientY-drag.rot[1])*0.4)); draw(); return; }
    const w=W2(svgPt(ev));
    if(drag.h[0]==="l"){ const i=+drag.h[1], base=[s.A,s.B,s.C][i], d=sub(base,s.O), t=dot(sub(w,s.O),d)/dot(d,d); if(Math.abs(t)>0.15) s.l[i]=Math.round(t*100)/100; }
    else s[drag.h]=[Math.round(w[0]*2)/2,Math.round(w[1]*2)/2];
    clearStat(); draw(); });
  const end=()=>{drag=null;}; svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);
  function clearStat(){$("stat").textContent="";$("ask").hidden=true;}
  $("pts").addEventListener("click",()=>{showPts=!showPts;$("pts").setAttribute("aria-pressed",String(showPts));draw();});
  $("home").addEventListener("click",()=>{if(running)return;s=HOME();lift=0;$("lift").value=0;topView=false;clearStat();draw();});
  $("lift").addEventListener("input",()=>{lift=+$("lift").value;draw();});
  $("up").addEventListener("click",()=>{mode3=!mode3;$("up").setAttribute("aria-pressed",String(mode3));$("liftc").hidden=!mode3;$("top").disabled=!mode3;topView=false;
    $("hint").textContent=mode3?"在圖上拖動可以旋轉；拉桿把 A 和 A′ 抬離桌面。":"橘色的點可以拖：O、A、B、C；A′、B′、C′ 只能沿著自己那條線拖。"; if(mode3&&lift===0){lift=0.6;$("lift").value=0.6;} draw();});
  $("top").addEventListener("click",()=>{topView=true;draw();});
  $("run").addEventListener("click",()=>{
    if(running||mode3)return; clearStat(); running=true; $("run").disabled=true;
    const keep=JSON.parse(JSON.stringify(s)), M=1000, reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches, step=reduce?M:25;
    let done=0, worst=0;
    const rp=()=>[Math.random()*60,Math.random()*50];
    function tick(){
      for(let i=0;i<step&&done<M;i++){
        const st={O:rp(),A:rp(),B:rp(),C:rp(),l:[0,1,2].map(()=>{let v=0;while(Math.abs(v)<0.3||Math.abs(v-1)<0.2)v=Math.random()*5-2;return v;})};
        const [P,Q,R]=pqr(st); if(!P||!Q||!R) continue; const sz=Math.max(Math.hypot(...sub(P,Q)),Math.hypot(...sub(Q,R)),Math.hypot(...sub(P,R))); if(sz>1e5) continue;
        worst=Math.max(worst,dev(P,Q,R)/sz); s=st; done++;
      }
      draw(); $("stat").innerHTML=`換了 <b>${done}</b> 組`;
      if(done<M) requestAnimationFrame(tick);
      else { running=false; $("run").disabled=false; s=keep; draw();
        $("stat").innerHTML=`${done} 組：每一次 <i>R</i> 離直線 <i>PQ</i> 都不到 <b>${worst<1e-9?"十億分之一":worst.toExponential(1)}</b>（以三點間距離為單位）`; $("ask").hidden=false; }
    }
    requestAnimationFrame(tick);
  });
  draw();
})();
</script>
