    <h1>三個中心</h1>
    <p class="lede">在三角形的每一邊上作一個正三角形，取它們的中心 <i>U</i>、<i>V</i>、<i>W</i>。拖動三角形的頂點，看三個中心。</p>
  </header>
  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 440" role="img" aria-label="三角形三邊上的正三角形與它們的中心" tabindex="0"></svg>
      <p class="hint">橘色的點可以拖。單位 mm；預設和學習單第 1 頁一樣。</p>
    </div>
    <div class="panel">
      <div class="rows">
        <div class="row"><span class="sw" style="background:var(--orange)"></span><span><i>UV</i></span><span class="val" id="v1"></span></div>
        <div class="row"><span class="sw" style="background:var(--orange)"></span><span><i>VW</i></span><span class="val" id="v2"></span></div>
        <div class="row"><span class="sw" style="background:var(--orange)"></span><span><i>WU</i></span><span class="val" id="v3"></span></div>
      </div>
      <div class="sum"><span class="k">最長減最短</span><span class="v" id="vd" style="font-size:clamp(34px,5vw,48px)"></span></div>
      <div class="controls">
        <div class="btns">
          <button type="button" class="btn primary" id="run">隨機換 1000 個</button>
          <button type="button" class="btn" id="home">回到學習單的圖</button>
        </div>
        <div class="btns"><button type="button" class="btn" id="inw" aria-pressed="false">往裡面作</button></div>
        <div class="stat" id="stat" aria-live="polite"></div>
        <p class="q" id="ask" hidden>電腦確認了一千個三角形。你還需要什麼？</p>
        <details id="more">
          <summary>更多</summary>
          <div class="btns">
            <button type="button" class="btn" id="step">轉三次：下一步</button>
            <button type="button" class="btn" id="circ" aria-pressed="false">三個外接圓</button>

<script>
(function(){
  const NS="http://www.w3.org/2000/svg", $=(id)=>document.getElementById(id), svg=$("stage");
  const HOME=()=>({A:[6,26],B:[0,0],C:[31,0]});
  let s=HOME(), inw=false, circ=false, step=0, drag=null, running=false, anim=null;
  let view={k:4,ox:0,oy:0};
  const rad=(d)=>d*Math.PI/180;
  const rot=(z,c,d)=>{const a=rad(d),x=z[0]-c[0],y=z[1]-c[1];return [c[0]+x*Math.cos(a)-y*Math.sin(a), c[1]+x*Math.sin(a)+y*Math.cos(a)];};
  const cr=(o,p,q)=>(p[0]-o[0])*(q[1]-o[1])-(p[1]-o[1])*(q[0]-o[0]);
  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  function apex(u,v,w,inward){ for(const sg of [60,-60]){ const a=rot(v,u,sg); const out=cr(u,v,a)*cr(u,v,w)<0; if(out!==inward) return a; } }
  function napo(st,inward){ const T=[[st.B,st.C,st.A],[st.C,st.A,st.B],[st.A,st.B,st.C]]; return T.map(([u,v,w])=>{const a=apex(u,v,w,inward);return {u,v,a,c:[(u[0]+v[0]+a[0])/3,(u[1]+v[1]+a[1])/3]};}); }
  function fit(){ const N=napo(s,false), pts=[s.A,s.B,s.C,...N.map(n=>n.a)];
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]); const w=Math.max(...xs)-Math.min(...xs), h=Math.max(...ys)-Math.min(...ys);
    const k=Math.min(380/w,380/h); view={k,ox:220-k*(Math.max(...xs)+Math.min(...xs))/2, oy:220+k*(Math.max(...ys)+Math.min(...ys))/2}; }
  const X=(p)=>[view.ox+p[0]*view.k, view.oy-p[1]*view.k];
  const Wd=(q)=>[(q[0]-view.ox)/view.k,(view.oy-q[1])/view.k];
  function el(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
  function txt(p,t,cls,fill,dx,dy){const q=X(p);const e=el("text",{x:q[0]+(dx||0),y:q[1]+(dy||0),class:cls,"text-anchor":"middle","dominant-baseline":"middle"});if(fill)e.style.fill=fill;e.textContent=t;return e;}
  const pg=(pts,cls)=>el("polygon",{points:pts.map(p=>X(p).join(",")).join(" "),class:cls});
  function circum(a,b,c){const d=2*(a[0]*(b[1]-c[1])+b[0]*(c[1]-a[1])+c[0]*(a[1]-b[1]));const sq=(p)=>p[0]*p[0]+p[1]*p[1];
    return [(sq(a)*(b[1]-c[1])+sq(b)*(c[1]-a[1])+sq(c)*(a[1]-b[1]))/d,(sq(a)*(c[0]-b[0])+sq(b)*(a[0]-c[0])+sq(c)*(b[0]-a[0]))/d];}
  function draw(){
    svg.innerHTML=""; const N=napo(s,inw);
    N.forEach(n=>pg([n.u,n.v,n.a],"eq"));
    if(circ&&!inw){ N.forEach(n=>{const o=circum(n.u,n.v,n.a),c=X(o);el("circle",{cx:c[0],cy:c[1],r:dist(o,n.u)*view.k,class:"cc"});});
      const A1=N[0].a; [[s.A,A1],[s.B,N[1].a],[s.C,N[2].a]].forEach(([p,q])=>{const a=X(p),b=X(q);el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:"cc"});}); }
    pg([s.A,s.B,s.C],"tri"); pg(N.map(n=>n.c),"nap");
    const G=[(s.A[0]+s.B[0]+s.C[0])/3,(s.A[1]+s.B[1]+s.C[1])/3];
    [["A",s.A],["B",s.B],["C",s.C]].forEach(([t,p])=>{const v=[p[0]-G[0],p[1]-G[1]],L=Math.hypot(...v)||1;txt(p,t,"lab",null,-v[0]/L*24,v[1]/L*24);});
    N.forEach((n,i)=>{const q=X(n.c);el("circle",{cx:q[0],cy:q[1],r:5,fill:"var(--orange)"});txt(n.c,"UVW"[i],"lab2","var(--orange)",12,-10);});
    if(step>0){ const ctr=[N[0].c,N[1].c,N[2].c]; let p=s.B; const seq=[];
      for(let i=0;i<Math.min(step,3);i++){ const sg=inw?120:-120; const q=rot(p,ctr[i],sg); seq.push([p,ctr[i],sg]); p=q; }
      seq.forEach(([p0,c,sg],i)=>{ const pts=[]; for(let t=0;t<=30;t++){ const f=(i===seq.length-1&&anim!==null)?anim:1; pts.push(X(rot(p0,c,sg*t/30*f))); } el("polyline",{points:pts.map(q=>q.join(",")).join(" "),class:"trail"}); });
      const last=seq[seq.length-1]; const f=anim===null?1:anim; const cur=rot(last[0],last[1],last[2]*f); const q=X(cur); el("circle",{cx:q[0],cy:q[1],r:7,fill:"var(--green)"}); }
    ["A","B","C"].forEach(h=>{const q=X(s[h]);el("circle",{cx:q[0],cy:q[1],r:18,class:"hit","data-h":h});el("circle",{cx:q[0],cy:q[1],r:7,class:"drag","data-h":h});});
    const d=[dist(N[0].c,N[1].c),dist(N[1].c,N[2].c),dist(N[2].c,N[0].c)];
    $("v1").textContent=d[0].toFixed(2);$("v2").textContent=d[1].toFixed(2);$("v3").textContent=d[2].toFixed(2);
    const g=Math.max(...d)-Math.min(...d); $("vd").textContent=g<0.005?"0.00":g.toFixed(2);
  }
  function svgPt(ev){const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());return [q.x,q.y];}
  svg.addEventListener("pointerdown",(ev)=>{const h=ev.target.getAttribute&&ev.target.getAttribute("data-h");if(!h||running)return;drag=h;svg.setPointerCapture(ev.pointerId);ev.preventDefault();});
  svg.addEventListener("pointermove",(ev)=>{if(!drag)return;const w=Wd(svgPt(ev));s[drag]=[Math.round(w[0]*2)/2,Math.round(w[1]*2)/2];clearStat();draw();});
  const end=()=>{if(drag){drag=null;fit();draw();}};svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
  function clearStat(){$("stat").textContent="";$("ask").hidden=true;step=0;$("stepmsg").textContent="";}
  function tog(id,f){$(id).addEventListener("click",()=>{const v=f();$(id).setAttribute("aria-pressed",String(v));draw();});}
  tog("inw",()=>{inw=!inw;step=0;$("stepmsg").textContent="";return inw;}); tog("circ",()=>circ=!circ);
  const MSG=["","繞 U 轉 120°：B 到了 C。","再繞 V 轉 120°：C 到了 A。","再繞 W 轉 120°：A 回到 B。三次接起來，B 沒有動。"];
  $("step").addEventListener("click",()=>{ if(running)return; step=step>=3?0:step+1; $("stepmsg").textContent=MSG[step];
    const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(step===0||reduce){anim=null;draw();return;} const t0=performance.now();
    function f(t){anim=Math.min(1,(t-t0)/700);draw();if(anim<1)requestAnimationFrame(f);else{anim=null;draw();}} requestAnimationFrame(f); });
  $("home").addEventListener("click",()=>{if(running)return;s=HOME();clearStat();fit();draw();});
  $("run").addEventListener("click",()=>{
    if(running)return; clearStat(); running=true; $("run").disabled=true;
    const keep=JSON.parse(JSON.stringify(s)), N=1000, reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches, stp=reduce?N:25;
    let done=0, worst=0;
    function tick(){
      for(let i=0;i<stp&&done<N;i++){ const r=()=>[Math.random()*60,Math.random()*60]; const st={A:r(),B:r(),C:r()};
        if(Math.abs(cr(st.A,st.B,st.C))<20) continue; const Nn=napo(st,inw);
        const d=[dist(Nn[0].c,Nn[1].c),dist(Nn[1].c,Nn[2].c),dist(Nn[2].c,Nn[0].c)]; worst=Math.max(worst,Math.max(...d)-Math.min(...d)); s=st; done++; }
      fit(); draw(); $("stat").innerHTML=`換了 <b>${done}</b> 個`;
      if(done<N) requestAnimationFrame(tick);
      else{ running=false; $("run").disabled=false; s=keep; fit(); draw(); $("stat").innerHTML=`${done} 個三角形：三段最多差 <b>${worst<1e-6?"＜ 0.000001":worst.toExponential(1)}</b>`; $("ask").hidden=false; }
    }
    requestAnimationFrame(tick);
  });
  fit(); draw();
})();
</script>
