<div class="wrap">

    <h1>轉兩次</h1>
    <p class="lede">旗子先繞 <i>P</i> 轉，再繞 <i>Q</i> 轉（逆時針為正）。轉兩次，像不像只轉了一次？</p>
  </header>
  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 440" role="img" aria-label="旗子繞兩點各轉一次" tabindex="0"></svg>
      <p class="hint">橘色的點可以拖：<i>P</i>、<i>Q</i>、旗桿底。一格 5 mm，預設和學習單第 1 頁一樣。</p>
    </div>
    <div class="panel">
      <div class="controls" style="margin-top:0">
        <label class="kk"><span>繞 <i>P</i> 轉</span><input type="range" id="al" min="-360" max="360" step="5" value="90"><output id="alv">90°</output></label>
        <label class="kk"><span>繞 <i>Q</i> 轉</span><input type="range" id="be" min="-360" max="360" step="5" value="90"><output id="bev">90°</output></label>
      </div>

      </div>

        </div>
        <div class="btns">
          <button type="button" class="btn primary" id="run">隨機換 1000 組</button>
          <button type="button" class="btn" id="home">回到學習單的圖</button>
        </div>
        <div class="stat" id="stat" aria-live="polite"></div>

<script>
(function(){
  const NS="http://www.w3.org/2000/svg", $=(id)=>document.getElementById(id), svg=$("stage");
  const K=5.5, OX=55, OY=-20; // mm → px
  const X=(p)=>[ (p[0]+0)*K+55, 440-(p[1])*K-20 ];
  const W=(q)=>[ (q[0]-55)/K, (440-20-q[1])/K ];
  const HOME=()=>({P:[25,55],Q:[55,55],F:[30,60],al:90,be:90});
  let s=HOME(), showMid=false, showCen=false, mir=false, drag=null, running=false;
  const flagRel=[[0,0],[0,15],[10,10],[0,5]];
  function el(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
  function txt(p,t,cls,fill,dx,dy){const q=X(p);const e=el("text",{x:q[0]+(dx||0),y:q[1]+(dy||0),class:cls,"text-anchor":"middle","dominant-baseline":"middle"});if(fill)e.style.fill=fill;e.textContent=t;return e;}
  const rad=(d)=>d*Math.PI/180;
  const rot=(z,c,d)=>{const a=rad(d),x=z[0]-c[0],y=z[1]-c[1];return [c[0]+x*Math.cos(a)-y*Math.sin(a), c[1]+x*Math.sin(a)+y*Math.cos(a)];};
  const flag=()=>flagRel.map(r=>[s.F[0]+r[0],s.F[1]+r[1]]);
  const comp=(z,st)=>rot(rot(z,st.P,st.al),st.Q,st.be);
  function center(st){ const sum=((st.al+st.be)%360+360)%360; if(sum<1e-9||Math.abs(sum-360)<1e-9) return null;
    const z0=comp([0,0],st), a=rad(st.al+st.be), ar=[Math.cos(a),Math.sin(a)];
    const den=[1-ar[0],-ar[1]], d2=den[0]*den[0]+den[1]*den[1];
    return [(z0[0]*den[0]+z0[1]*den[1])/d2, (z0[1]*den[0]-z0[0]*den[1])/d2]; }
  function poly(pts,cls){ const a=pts.map(p=>X(p)), d="M"+a[0]+" L"+a[1]+" M"+a[1]+" L"+a[2]+" L"+a[3]+" Z"; return el("path",{d,class:cls}); }
  function line(p,q,stroke,cls,dash){ const a=X(p),b=X(q); const e=el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:cls||""}); e.style.stroke=stroke; if(dash)e.style.strokeDasharray=dash; return e; }
  function dot(p,fill,r){const q=X(p);return el("circle",{cx:q[0],cy:q[1],r:r||4.5,fill});}
  function handle(p,h){const q=X(p);el("circle",{cx:q[0],cy:q[1],r:18,class:"hit","data-h":h});el("circle",{cx:q[0],cy:q[1],r:7,class:"drag","data-h":h});}
  function mirrorLine(c,dir,stroke){ const L=200; line([c[0]-dir[0]*L,c[1]-dir[1]*L],[c[0]+dir[0]*L,c[1]+dir[1]*L],stroke,"mir"); }
  function draw(){
    svg.innerHTML="";
    for(let x=-10;x<=80;x+=5){const a=X([x,-5]),b=X([x,80]);el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:"gridl"});}
    for(let y=-5;y<=80;y+=5){const a=X([-10,y]),b=X([80,y]);el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:"gridl"});}
    const F0=flag(), F1=F0.map(z=>rot(z,s.P,s.al)), F2=F0.map(z=>comp(z,s));
    const O=center(s);
    if(mir){ const d=[s.Q[0]-s.P[0],s.Q[1]-s.P[1]], L=Math.hypot(...d)||1, u=[d[0]/L,d[1]/L];
      mirrorLine(s.P,u,"var(--indigo)");
      mirrorLine(s.P,rot(u,[0,0],-s.al/2),"var(--orange)");
      mirrorLine(s.Q,rot(u,[0,0],s.be/2),"var(--green)");
      const mm=rot(u,[0,0],-s.al/2), nn=rot(u,[0,0],s.be/2);
      txt([s.P[0]+mm[0]*-14,s.P[1]+mm[1]*-14],"m","lab2","var(--orange)",10,0);
      txt([s.Q[0]+nn[0]*14,s.Q[1]+nn[1]*14],"n","lab2","var(--green)",10,0);
      txt([s.Q[0]+u[0]*12,s.Q[1]+u[1]*12],"ℓ","lab2","var(--indigo)",0,-12);
    }
    if(showMid) poly(F1,"fl1");
    poly(F2,"fl2"); poly(F0,"fl0");
    txt(F0[1],"F","lab",null,-14,0); txt(F2[1],"F″","lab","var(--indigo)",-16,0);
    if(showCen&&O){ dot(O,"var(--green)",5.5); txt(O,"O","lab","var(--green)",14,12);
      const tip=F0[2], r=Math.hypot(tip[0]-O[0],tip[1]-O[1]); const c=X(O); el("circle",{cx:c[0],cy:c[1],r:r*K,class:"arcg"}); }
    txt(s.P,"P","lab",null,-14,14); txt(s.Q,"Q","lab",null,14,14);
    handle(s.P,"P"); handle(s.Q,"Q"); handle(s.F,"F");
    const sum=s.al+s.be; $("vs").textContent=sum+"°";
    $("alv").textContent=s.al+"°"; $("bev").textContent=s.be+"°";
    if(O){ const n=((sum%360)+360)%360; $("vr").textContent="繞 O 轉 "+n+"°"; $("sk").textContent="一次就到";
      $("rowO").hidden=!showCen; $("vo").textContent=Math.hypot(O[0]-s.P[0],O[1]-s.P[1]).toFixed(1)+"　│　"+Math.hypot(O[0]-s.Q[0],O[1]-s.Q[1]).toFixed(1); }
    else { const v=[F2[0][0]-F0[0][0],F2[0][1]-F0[0][1]]; $("vr").textContent="找不到 O"; $("sk").textContent="每一點都移 "+Math.hypot(...v).toFixed(1)+" mm"; $("rowO").hidden=true; }
  }
  function svgPt(ev){const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());return [q.x,q.y];}
  const snap=(v)=>Math.round(v*2)/2;
  svg.addEventListener("pointerdown",(ev)=>{const h=ev.target.getAttribute&&ev.target.getAttribute("data-h");if(!h||running)return;drag=h;svg.setPointerCapture(ev.pointerId);ev.preventDefault();});
  svg.addEventListener("pointermove",(ev)=>{if(!drag)return;const w=W(svgPt(ev));const p=[Math.max(-8,Math.min(78,snap(w[0]))),Math.max(-3,Math.min(78,snap(w[1])))];s[drag]=p;clearStat();draw();});
  const end=()=>{drag=null;};svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
  function clearStat(){$("stat").textContent="";$("ask").hidden=true;}
  $("al").addEventListener("input",()=>{s.al=+$("al").value;clearStat();draw();});
  $("be").addEventListener("input",()=>{s.be=+$("be").value;clearStat();draw();});
  function tog(id,f){$(id).addEventListener("click",()=>{const v=f();$(id).setAttribute("aria-pressed",String(v));draw();});}
  tog("mid",()=>showMid=!showMid); tog("cen",()=>showCen=!showCen); tog("mir",()=>mir=!mir);
  $("home").addEventListener("click",()=>{if(running)return;s=HOME();$("al").value=90;$("be").value=90;clearStat();draw();});
  $("run").addEventListener("click",()=>{
    if(running)return; clearStat(); running=true; $("run").disabled=true;
    const keep=JSON.parse(JSON.stringify(s)), N=1000, reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches, step=reduce?N:25;
    let done=0, worst=0, wa=0;
    function tick(){
      for(let i=0;i<step&&done<N;i++){
        const st={P:[Math.random()*60,Math.random()*60+10],Q:[Math.random()*60,Math.random()*60+10],F:keep.F,al:Math.round(Math.random()*144-72)*5,be:Math.round(Math.random()*144-72)*5};
        const n=((st.al+st.be)%360+360)%360; if(n===0) continue;
        const O=center(st); if(!O) continue;
        flag().concat([[0,0],[50,50]]).forEach(z=>{const z2=comp(z,st),r1=Math.hypot(z[0]-O[0],z[1]-O[1]),r2=Math.hypot(z2[0]-O[0],z2[1]-O[1]);worst=Math.max(worst,Math.abs(r1-r2));
          const a1=Math.atan2(z[1]-O[1],z[0]-O[0]),a2=Math.atan2(z2[1]-O[1],z2[0]-O[0]);let da=((a2-a1)*180/Math.PI-n)%360;da=Math.min(Math.abs(da),360-Math.abs(da));if(r1>1)wa=Math.max(wa,da);});
        s=st; done++;
      }
      $("al").value=s.al;$("be").value=s.be; draw(); $("stat").innerHTML=`換了 <b>${done}</b> 組`;
      if(done<N) requestAnimationFrame(tick);
      else { running=false; $("run").disabled=false; s=keep; $("al").value=s.al;$("be").value=s.be; draw();
        $("stat").innerHTML=`${done} 組：每次都找到一點；到那一點的距離最多差 <b>${worst<1e-6?"＜ 0.000001":worst.toExponential(1)}</b>，轉角和「兩角相加」最多差 <b>${wa<1e-6?"＜ 0.000001":wa.toExponential(1)}</b>°`; $("ask").hidden=false; }
    }
    requestAnimationFrame(tick);
  });
  draw();
})();
</script>
