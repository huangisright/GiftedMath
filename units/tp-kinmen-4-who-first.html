<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>兩輛救護車，誰先到？｜金門有多大？</title>
<meta name="description" content="兩個救護據點同時接到通報，各派一輛車。哪些地方是甲先到、哪些是乙先到？剛好同時到的地方排成什麼形狀？也可以換成風獅爺：每個地方由離它最近的那一尊守護。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Crimson+Text:ital,wght@0,600;1,400;1,600&display=swap">
<style>

:root{
  --paper:#F5F2E8;
  --grid:rgba(46,90,136,.075);
  --card:#FFFDF8;
  --edge:#DFD6C4;
  --edge-soft:#EBE3D4;
  --ink:#23282D;
  --ink-2:#5C554A;
  --ink-3:#847B6C;
  --indigo:#2E5A88;
  --indigo-soft:#E7EEF6;
  --orange:#C1652F;
  --orange-soft:#FBEEE1;
  --green:#4A7C59;
  --green-soft:#E7F0E9;
  --crimson:#B23A3A;
  --black-card:#2B2F35;
  --shadow:0 1px 2px rgba(72,60,40,.06), 0 6px 18px rgba(72,60,40,.07);
  --shadow-lift:0 2px 4px rgba(72,60,40,.08), 0 14px 34px rgba(72,60,40,.12);
  --serif:"Noto Serif TC",'Songti TC','Times New Roman',serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --math:"Crimson Text","Times New Roman",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#161A1E;
    --grid:rgba(127,169,214,.07);
    --card:#1F252B;
    --edge:#333C45;
    --edge-soft:#2A323A;
    --ink:#E7E2D6;
    --ink-2:#B3AC9E;
    --ink-3:#8B857A;
    --indigo:#82ADDC;
    --indigo-soft:#1E2C3B;
    --orange:#E28B52;
    --orange-soft:#3A2718;
    --green:#82B893;
    --green-soft:#1D2C22;
    --crimson:#D66B6B;
    --black-card:#0E1114;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.28);
    --shadow-lift:0 2px 4px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#161A1E;
  --grid:rgba(127,169,214,.07);
  --card:#1F252B;
  --edge:#333C45;
  --edge-soft:#2A323A;
  --ink:#E7E2D6;
  --ink-2:#B3AC9E;
  --ink-3:#8B857A;
  --indigo:#82ADDC;
  --indigo-soft:#1E2C3B;
  --orange:#E28B52;
  --orange-soft:#3A2718;
  --green:#82B893;
  --green-soft:#1D2C22;
  --crimson:#D66B6B;
  --black-card:#0E1114;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.28);
  --shadow-lift:0 2px 4px rgba(0,0,0,.35), 0 14px 34px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(90deg, var(--grid) 0 1px, transparent 1px 26px);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:920px;margin:0 auto;padding:0 22px 100px}
em,.v{font-family:var(--math);font-style:italic;font-size:1.08em;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}

/* ---- header ---- */
header{padding:58px 0 34px}
.eyebrow{
  font-size:12.5px;letter-spacing:.22em;color:var(--orange);
  font-weight:700;margin-bottom:16px;
}
h1{
  font-family:var(--serif);font-weight:700;
  font-size:clamp(38px,7vw,62px);line-height:1.12;margin:0 0 14px;
  letter-spacing:.02em;text-wrap:balance;
}
.sub{font-size:clamp(16px,2.4vw,19px);color:var(--ink-2);margin:0 0 26px}
.thesis{
  border-left:3px solid var(--orange);
  padding:4px 0 4px 20px;margin:0;
  font-family:var(--serif);font-size:clamp(16px,2.4vw,19px);
  line-height:1.85;color:var(--ink);max-width:64ch;
}

/* ---- nav ---- */
nav{
  position:sticky;top:0;z-index:30;
  display:flex;flex-wrap:wrap;gap:8px;
  padding:11px 0;margin-bottom:8px;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(9px);
  border-bottom:1px solid var(--edge-soft);
}
nav a{
  font-size:13.5px;text-decoration:none;color:var(--ink-2);
  padding:5px 12px;border-radius:999px;border:1px solid transparent;
  transition:.16s;
}
nav a:hover,nav a:focus-visible{color:var(--indigo);border-color:var(--edge);background:var(--card)}

/* ---- sections ---- */
section{padding:44px 0 8px;scroll-margin-top:64px}
.pillar-tag{
  display:inline-flex;align-items:center;gap:9px;
  font-size:12.5px;letter-spacing:.16em;font-weight:700;
  margin-bottom:12px;
}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
h2{
  font-family:var(--serif);font-weight:700;
  font-size:clamp(25px,4.2vw,34px);line-height:1.3;margin:0 0 12px;
  text-wrap:balance;
}
h3{font-family:var(--serif);font-size:19px;margin:30px 0 8px;font-weight:500}
p{margin:0 0 15px;max-width:66ch}
.lede{font-size:17.5px;color:var(--ink-2);max-width:64ch}

/* ---- lab ---- */
.lab{
  background:var(--card);border:1px solid var(--edge);
  border-radius:5px;box-shadow:var(--shadow);
  margin:26px 0 30px;overflow:hidden;
}
.lab-head{
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding:17px 22px 13px;border-bottom:1px solid var(--edge-soft);
}
.lab-no{
  font-family:var(--math);font-size:13px;font-weight:600;font-style:normal;
  color:var(--card);background:var(--indigo);
  width:23px;height:23px;border-radius:50%;
  display:grid;place-items:center;flex:none;align-self:center;
}
.lab-title{font-family:var(--serif);font-weight:700;font-size:18px;margin:0}
.lab-why{font-size:13.5px;color:var(--ink-3);margin:0}
.lab-body{padding:22px}
.lab-foot{
  padding:14px 22px;background:var(--green-soft);
  border-top:1px solid var(--edge-soft);
  font-size:14.5px;color:var(--ink);
}
.lab-foot b{color:var(--green)}

/* ---- controls ---- */
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{
  font-family:var(--sans);font-size:14px;
  padding:7px 14px;border-radius:4px;
  border:1px solid var(--edge);background:var(--paper);color:var(--ink);
  cursor:pointer;transition:.14s;line-height:1.5;
}
button:hover:not(:disabled){border-color:var(--indigo);color:var(--indigo)}
button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
button.primary:hover{filter:brightness(1.12);color:#fff}
button.warn{border-color:var(--orange);color:var(--orange)}
button.ghost{background:transparent}
input[type=number],input[type=text]{
  font-family:var(--math);font-size:16px;
  width:66px;padding:6px 9px;border-radius:4px;
  border:1px solid var(--edge);background:var(--paper);color:var(--ink);
}
input[type=text].wide{width:190px;letter-spacing:.09em;font-family:var(--sans);font-size:15px}
input:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}
label{font-size:13.5px;color:var(--ink-2)}
input[type=range]{accent-color:var(--indigo);width:160px}

.msg{
  margin-top:12px;padding:10px 14px;border-radius:4px;font-size:14.5px;
  border:1px solid var(--edge);background:var(--paper);
}
.msg.bad{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}
.msg.good{border-color:var(--green);background:var(--green-soft);color:var(--green)}

/* ---- 按鈕與切換 ---- */
.btn{
  font-family:var(--sans);font-size:13.5px;padding:5px 11px;border-radius:5px;
  border:1px solid var(--edge);background:var(--card);color:var(--ink-2);cursor:pointer;
}
.btn:hover{border-color:var(--orange);color:var(--orange)}
.segwrap{display:inline-flex;flex-wrap:wrap;gap:0;border-radius:6px;overflow:hidden;border:1px solid var(--edge)}
.seg{
  font-family:var(--sans);font-size:13px;padding:6px 12px;border:none;
  background:var(--card);color:var(--ink-3);cursor:pointer;border-right:1px solid var(--edge-soft);
}
.seg:last-child{border-right:none}
.seg.on{background:var(--indigo);color:#fff}

.row label{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.row input[type=range]{width:min(230px,58vw);max-width:100%}
.row input[type=number]{
  font-family:var(--math);font-size:16px;width:92px;padding:3px 7px;
  border:1px solid var(--edge);border-radius:5px;background:var(--card);color:var(--ink);
}

.statrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0 2px}
.statbox{
  border:1px solid var(--edge-soft);background:var(--card);border-radius:6px;
  padding:6px 14px;text-align:center;min-width:104px;
}
.statbox .k{font-size:11.5px;color:var(--ink-3)}
.statbox .v{font-family:var(--math);font-size:19px;font-variant-numeric:tabular-nums}
.statbox.hot{border-color:var(--orange)}
.statbox.hot .v{color:var(--orange)}
.statbox.cool{border-color:var(--green)}
.statbox.cool .v{color:var(--green)}
.statbox.blue{border-color:var(--indigo)}
.statbox.blue .v{color:var(--indigo)}

/* ---- 九上2 專用 ---- */
.hint{font-size:12.5px;color:var(--ink-3);text-align:center;margin:2px 0 0}
.row .btn{margin-right:6px}
.statbox.grn{border-color:var(--green)}
.statbox.grn .v{color:var(--green)}


/* ---- 等時線單元：探索站用的畫布與收合區 ---- */
:root{--violet:#7A5AA6;--teal:#2F7A72;--gold:#9A7414}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--violet:#B497DB;--teal:#6FC2B8;--gold:#D9B34E}}
:root[data-theme="dark"]{--violet:#B497DB;--teal:#6FC2B8;--gold:#D9B34E}
.lab canvas{display:block;width:100%;max-width:100%;border:1px solid var(--edge);border-radius:8px;background:var(--card);touch-action:none;margin:12px 0 4px;cursor:pointer}
.note-s{font-size:12.5px;color:var(--ink-3);margin:2px 0 10px;max-width:none}
.ask{font-family:var(--serif);font-size:17px;line-height:1.6;margin:10px 0 0;color:var(--ink);max-width:none}
details.more{margin-top:14px;border-top:1px dashed var(--edge);padding-top:10px}
details.more summary{cursor:pointer;font-size:13.5px;color:var(--ink-3)}
details.more summary:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.more-body{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.more-body .hint{font-size:12.5px;color:var(--ink-3);margin:0}
.ticks{display:flex;flex-wrap:wrap;gap:6px 16px}
.ticks label{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ink-2);cursor:pointer}
.tbl{overflow-x:auto}
table.mini{border-collapse:collapse;font-size:13.5px;width:100%;max-width:560px}
table.mini th,table.mini td{padding:4px 8px;border-bottom:1px solid var(--edge-soft);text-align:right;font-variant-numeric:tabular-nums}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini th{color:var(--ink-3);font-weight:500}
ol.order{margin:0;padding-left:1.5em;font-size:14px;columns:2;column-gap:28px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid var(--edge)}
select{font-family:var(--sans);font-size:14px;padding:5px 8px;border:1px solid var(--edge);border-radius:6px;background:var(--card);color:var(--ink)}
.route{font-size:14px;color:var(--ink-2);margin:6px 0 0;max-width:none}
.warnline{font-size:13.5px;color:var(--orange);min-height:1.4em;margin:4px 0 0}
section.mod h2{margin-bottom:6px}
.statbox .v{font-style:normal}
.more-body .hint{text-align:left}
.btn.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
.row .btn{margin:0}
#m7pick{gap:6px}
/* ---- 專題首頁的主題卡 ---- */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:30px 0 10px}
a.mcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);
  background:var(--card);border:1px solid var(--edge);border-radius:8px;padding:16px 18px 14px;box-shadow:var(--shadow);transition:.15s}
a.mcard:hover,a.mcard:focus-visible{border-color:var(--indigo);box-shadow:var(--shadow-lift);transform:translateY(-2px)}
a.mcard:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.mcard .tag{font-size:12.5px;letter-spacing:.14em;font-weight:700;display:flex;align-items:center;gap:8px}
.mcard h3{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.4;margin:2px 0 0}
.mcard p{font-size:14px;color:var(--ink-2);margin:0;line-height:1.7}
.mcard .ft{margin-top:auto;padding-top:10px;border-top:1px solid var(--edge-soft);display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3)}
.mcard .ft b{color:var(--indigo);font-weight:600}
/* ---- 主題頁底部的上一個／下一個 ---- */
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:34px 0 0;padding-top:18px;border-top:1px solid var(--edge)}
.pager a{text-decoration:none;color:var(--indigo);font-size:14.5px;font-weight:600;padding:8px 14px;border:1px solid var(--edge);border-radius:6px;background:var(--card)}
.pager a:hover{border-color:var(--indigo)}
.pager .mid{color:var(--ink-2)}
header.sub-h{padding:46px 0 10px}
header.sub-h h1{font-size:clamp(32px,6vw,50px)}
header.sub-h .sub{margin-bottom:6px;max-width:64ch}
</style>

body{background:var(--paper)!important;background-image:none!important;font-family:"LXGW WenKai TC","Kaiti TC","KaiTi","STKaiti",serif!important;font-size:17px}
button,input,select,textarea,label{font-family:"LXGW WenKai TC","Kaiti TC","KaiTi","STKaiti",serif}
input[type=number],.row input[type=number]{font-family:var(--math,serif)}

.eyebrow{color:var(--orange)}
.thesis{border-left:none!important;padding-left:0!important;background:linear-gradient(transparent 62%,var(--hl) 62%);display:inline}

.lab-foot{background:var(--hl)!important;border:none!important;margin:6px 10px 10px;border-radius:var(--wob2)}

button,.btn{border:2px solid var(--ink)!important;border-radius:var(--wob)!important;background:transparent!important;color:var(--ink)!important;box-shadow:none!important}
button:nth-of-type(even),.btn:nth-of-type(even){border-radius:var(--wob2)!important}
button:hover:not(:disabled),.btn:hover{background:var(--hl)!important;color:var(--ink)!important}
button.primary,.seg.on,.seg.on:hover{background:var(--ink)!important;color:var(--paper)!important}

input:focus-visible,select:focus-visible{outline:none!important;background:var(--hl)!important}
input[type=range]{accent-color:var(--ink)}

.bk-top{font-family:"LXGW WenKai TC","Kaiti TC","KaiTi","STKaiti",serif!important;font-size:15px!important}
.bk-top a{color:var(--ink,#1b1b1b)!important;text-decoration:underline dotted!important}

<script>
/* ================================================================
   專題　金門有多大？　等時線互動探索站
   每一站各自包在一個函式裡；共用的只有畫布、配色與小工具。
================================================================ */
const $ = id => document.getElementById(id);
const PAL = {};
const PAL_KEYS = ['paper', 'card', 'edge', 'edge-soft', 'ink', 'ink-2', 'ink-3', 'indigo', 'indigo-soft',
  'orange', 'orange-soft', 'green', 'green-soft', 'crimson', 'violet', 'teal', 'gold'];
function readPal() {
  const cs = getComputedStyle(document.documentElement);
  PAL_KEYS.forEach(k => { PAL[k] = cs.getPropertyValue('--' + k).trim(); });
}
function rgba(c, a) {
  const h = (c || '#000000').replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
const sans = () => getComputedStyle(document.body).fontFamily;
const MATHF = '"Crimson Text","Times New Roman",Georgia,serif';
function fmt(v, d) {
  if (v === null || v === undefined || !isFinite(v)) return '—';
  return v.toFixed(d || 0).replace('-', '−');
}
const fmtMin = v => (Math.round(v * 10) / 10).toString().replace('-', '−');
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.round(m % 60)).padStart(2, '0');

const REDRAW = [];
function stage(id, W, H, draw) {
  const cv = $(id), ctx = cv.getContext('2d');
  cv.style.aspectRatio = W + ' / ' + H;
  const s = { cv, ctx, W, H, w: 0, h: 0, k: 1 };
  s.resize = () => {
    const r = cv.getBoundingClientRect();
    if (!r.width) return;
    const dpr = window.devicePixelRatio || 1;
    s.w = r.width; s.h = r.width * H / W;
    cv.width = Math.round(s.w * dpr); cv.height = Math.round(s.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    s.k = s.w / W;
    draw();
  };
  s.pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / s.k, y: (e.clientY - r.top) / s.k }; };
  new ResizeObserver(s.resize).observe(cv);
  REDRAW.push(() => { if (s.w) draw(); });
  return s;
}
function boxes(el, list) {
  el.innerHTML = list.map(b => `<div class="statbox ${b[2] || ''}"><div class="k">${b[0]}</div><div class="v">${b[1]}</div></div>`).join('');
}
function segbind(id, cb) {
  const w = $(id);
  w.querySelectorAll('.seg').forEach(b => {
    b.setAttribute('aria-pressed', b.classList.contains('on'));
    b.addEventListener('click', () => {
      w.querySelectorAll('.seg').forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); });
      cb(b.dataset.v);
    });
  });
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
/* 等高線：在格點上找變號，線性內插連線 */
function gridVals(f, x0, y0, x1, y1, nx, ny) {
  const v = new Float64Array((nx + 1) * (ny + 1)), dx = (x1 - x0) / nx, dy = (y1 - y0) / ny;
  for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) v[j * (nx + 1) + i] = f(x0 + i * dx, y0 + j * dy);
  return { v, x0, y0, dx, dy, nx, ny };
}
function contourGrid(c, g, level, X, Y, keep) {
  const { v, x0, y0, dx, dy, nx, ny } = g;
  c.beginPath();
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = v[j * (nx + 1) + i] - level, b = v[j * (nx + 1) + i + 1] - level,
      d = v[(j + 1) * (nx + 1) + i] - level, e = v[(j + 1) * (nx + 1) + i + 1] - level;
    if (![a, b, d, e].every(isFinite)) continue;
    const pts = [];
    const ed = (p, q, ax, ay, bx, by) => { if ((p < 0) !== (q < 0)) { const t = p / (p - q); pts.push([ax + (bx - ax) * t, ay + (by - ay) * t]); } };
    const xa = x0 + i * dx, ya = y0 + j * dy, xb = xa + dx, yb = ya + dy;
    ed(a, b, xa, ya, xb, ya); ed(b, e, xb, ya, xb, yb); ed(d, e, xa, yb, xb, yb); ed(a, d, xa, ya, xa, yb);
    if (pts.length >= 2) {
      if (keep && !keep((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2)) continue;
      c.moveTo(X(pts[0][0]), Y(pts[0][1])); c.lineTo(X(pts[1][0]), Y(pts[1][1]));
      if (pts.length === 4) { c.moveTo(X(pts[2][0]), Y(pts[2][1])); c.lineTo(X(pts[3][0]), Y(pts[3][1])); }
    }
  }
  c.stroke();
}
function label(c, txt, x, y, opt) {
  opt = opt || {};
  c.font = (opt.weight || '500') + ' ' + (opt.size || 13) + 'px ' + (opt.font || sans());
  c.textAlign = opt.align || 'center'; c.textBaseline = opt.base || 'alphabetic';
  if (opt.halo !== false) { c.lineWidth = 4; c.strokeStyle = opt.haloColor || PAL.card; c.lineJoin = 'round'; c.strokeText(txt, x, y); }
  c.fillStyle = opt.color || PAL.ink; c.fillText(txt, x, y);
  c.textBaseline = 'alphabetic';
}

/* ================================================================
   LAB 5　④ 誰先到
================================================================ */
function lab5() {
  const W = 8, H = 16 / 3, WALK = 4, TIE = 0.03;
  const tieEms = (a, b) => Math.abs(a - b) < TIE * Math.max(a, b);
  const tieLion = nt => nt.d2 - nt.d1 < TIE * nt.d2;
  const st = stage('m5cv', W, H, draw);
  const sx = x => x * st.k, sy = y => y * st.k;
  const C = () => ({ a: PAL.indigo, b: PAL.orange, tie: PAL.ink, panel: PAL.card, grid: PAL['edge-soft'], muted: PAL['ink-3'],
    c: [PAL.indigo, PAL.orange, PAL.green, PAL.violet, PAL.gold, PAL.teal] });
  const CV = ['--indigo', '--orange', '--green', '--violet', '--gold', '--teal'];
  const S = {
    mode: 'ems',
    ems: { A: { x: 1.0, y: 2.6 }, B: { x: 4.0, y: 2.6 }, P: { x: 3.4, y: 1.1 } },
    lions: [{ x: 1.2, y: 1.3 }, { x: 3.5, y: 1.1 }, { x: 6.1, y: 1.6 }, { x: 1.9, y: 3.9 }, { x: 4.4, y: 3.5 }, { x: 6.8, y: 4.1 }],
    probe: { x: 2.9, y: 2.5 }, coast: { y: 4.4 }, samples: [], drag: null
  };
  const pair = () => S.mode === 'ems' || S.mode === 'coast';
  const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
  const va = () => +$('m5va').value, vb = () => +$('m5vb').value, wait = () => +$('m5wait').value;
  // 海岸線模式：海岸線上方是陸地，下方是海；只看陸地上的點
  const onLand = p => S.mode !== 'coast' || p.y < S.coast.y;
  const dBof = p => S.mode === 'coast' ? Math.abs(p.y - S.coast.y) : dist(p, S.ems.B);
  const tA = p => dist(p, S.ems.A) / va() * 60, tB = p => dBof(p) / vb() * 60 + wait();
  const gap = p => tA(p) - tB(p);
  function nearestTwo(p) {
    let best = -1, second = -1, d1 = Infinity, d2 = Infinity;
    S.lions.forEach((L, i) => { const d = dist(p, L); if (d < d1) { d2 = d1; second = best; d1 = d; best = i; } else if (d < d2) { d2 = d; second = i; } });
    return { best, second, d1, d2 };
  }
  function special() {
    if (!pair() || wait() !== 0) return null;
    if (S.mode === 'coast') {
      if (va() !== vb()) return null;
      const A = S.ems.A; return { kind: 'vertex', x: A.x, y: (A.y + S.coast.y) / 2 };
    }
    const A = S.ems.A, B = S.ems.B, k = va() / vb();
    if (k === 1) return { kind: 'mid', x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
    const k2 = k * k;
    return { kind: 'center', x: (A.x - k2 * B.x) / (1 - k2), y: (A.y - k2 * B.y) / (1 - k2), r: k * dist(A, B) / Math.abs(1 - k2) };
  }

  function draw() {
    if (!st.w) return;
    const c = st.ctx, col = C(), k = st.k;
    c.fillStyle = col.panel; c.fillRect(0, 0, st.w, st.h);
    if (S.mode === 'coast') {
      const ly = sy(S.coast.y);
      c.fillStyle = PAL['indigo-soft']; c.fillRect(0, ly, st.w, st.h - ly);
      if (st.h - ly > 30) label(c, '海', st.w / 2, ly + Math.min(40, (st.h - ly) / 2 + 8), { size: 16, weight: 700, color: col.muted });
    }
    c.strokeStyle = col.grid; c.lineWidth = 1;
    for (let x = 1; x < W; x++) { c.beginPath(); c.moveTo(sx(x) + 0.5, 0); c.lineTo(sx(x) + 0.5, st.h); c.stroke(); }
    for (let y = 1; y < H; y++) { c.beginPath(); c.moveTo(0, sy(y) + 0.5); c.lineTo(st.w, sy(y) + 0.5); c.stroke(); }
    c.strokeStyle = col.muted; c.lineWidth = 2;
    const x0 = st.w - k - 14, y0 = st.h - 14;
    c.beginPath(); c.moveTo(x0, y0 - 5); c.lineTo(x0, y0); c.lineTo(x0 + k, y0); c.lineTo(x0 + k, y0 - 5); c.stroke();
    label(c, '1 公里', x0 + k / 2, y0 - 8, { size: 12, color: col.muted });
    if ($('m5fill').checked) {
      const step = Math.max(3, Math.round(st.w / 160));
      for (let px = 0; px < st.w; px += step) for (let py = 0; py < st.h; py += step) {
        const p = { x: (px + step / 2) / k, y: (py + step / 2) / k };
        if (!onLand(p)) continue;
        const cc = pair() ? (gap(p) < 0 ? col.a : col.b) : col.c[nearestTwo(p).best];
        c.fillStyle = rgba(cc, 0.16); c.fillRect(px, py, step, step);
      }
    }
    for (const s of S.samples) {
      const cc = pair() ? (s.win === 'A' ? col.a : col.b) : col.c[s.win];
      c.fillStyle = cc; c.beginPath(); c.arc(sx(s.x), sy(s.y), s.tie ? 3.2 : 2.2, 0, Math.PI * 2); c.fill();
      if (s.tie) { c.strokeStyle = col.tie; c.lineWidth = 1.5; c.beginPath(); c.arc(sx(s.x), sy(s.y), 6, 0, Math.PI * 2); c.stroke(); }
    }
    if ($('m5edge').checked) {
      c.strokeStyle = col.tie; c.lineWidth = 2.5;
      if (pair()) contourGrid(c, gridVals((x, y) => gap({ x, y }), 0, 0, W, H, 180, 120), 0, sx, sy, (x, y) => onLand({ x, y }));
      else {
        const n = S.lions.length;
        for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
          const Li = S.lions[i], Lj = S.lions[j];
          contourGrid(c, gridVals((x, y) => dist({ x, y }, Li) - dist({ x, y }, Lj), 0, 0, W, H, 180, 120), 0, sx, sy, (x, y) => {
            const nt = nearestTwo({ x, y }); return (nt.best === i && nt.second === j) || (nt.best === j && nt.second === i);
          });
        }
      }
    }
    if ($('m5special').checked) {
      const s = special();
      if (s) {
        c.fillStyle = col.tie; c.strokeStyle = col.tie; c.lineWidth = 1.5; c.setLineDash([5, 5]);
        if (s.kind === 'center') {
          c.beginPath(); c.moveTo(sx(s.x), sy(s.y)); c.lineTo(sx(s.x + s.r), sy(s.y)); c.stroke();
          c.beginPath(); c.moveTo(sx(S.ems.A.x), sy(S.ems.A.y)); c.lineTo(sx(s.x), sy(s.y)); c.stroke();
        } else if (s.kind === 'vertex') { c.beginPath(); c.moveTo(sx(S.ems.A.x), sy(S.ems.A.y)); c.lineTo(sx(S.ems.A.x), sy(S.coast.y)); c.stroke(); }
        else { c.beginPath(); c.moveTo(sx(S.ems.A.x), sy(S.ems.A.y)); c.lineTo(sx(S.ems.B.x), sy(S.ems.B.y)); c.stroke(); }
        c.setLineDash([]); c.beginPath(); c.arc(sx(s.x), sy(s.y), 5, 0, Math.PI * 2); c.fill();
      }
    }
    const r = clamp(st.w / 45, 12, 18);
    const stn = (p, cc, txt) => {
      c.fillStyle = cc; c.strokeStyle = col.panel; c.lineWidth = 3;
      c.beginPath(); c.arc(sx(p.x), sy(p.y), r, 0, Math.PI * 2); c.fill(); c.stroke();
      c.fillStyle = col.panel; c.font = '700 ' + Math.round(r * 1.05) + 'px ' + sans(); c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(txt, sx(p.x), sy(p.y) + 1); c.textBaseline = 'alphabetic';
    };
    const links = (p, list) => { c.setLineDash([4, 5]); c.lineWidth = 1.5; for (const [q, cc] of list) { c.strokeStyle = cc; c.beginPath(); c.moveTo(sx(p.x), sy(p.y)); c.lineTo(sx(q.x), sy(q.y)); c.stroke(); } c.setLineDash([]); };
    const cross = p => {
      const x = sx(p.x), y = sy(p.y); c.strokeStyle = PAL.ink; c.lineWidth = 2.5;
      c.beginPath(); c.moveTo(x - 9, y); c.lineTo(x + 9, y); c.moveTo(x, y - 9); c.lineTo(x, y + 9); c.stroke();
      c.beginPath(); c.arc(x, y, 12, 0, Math.PI * 2); c.stroke();
    };
    if (S.mode === 'ems') {
      const { A, B, P } = S.ems;
      links(P, [[A, col.a], [B, col.b]]); stn(A, col.a, '甲'); stn(B, col.b, '乙'); cross(P);
    } else if (S.mode === 'coast') {
      const { A, P } = S.ems, ly = sy(S.coast.y);
      c.strokeStyle = col.b; c.lineWidth = 5; c.beginPath(); c.moveTo(0, ly); c.lineTo(st.w, ly); c.stroke();
      label(c, '海岸線（走到海邊，算到最近的那一點）', 10, ly - 10, { size: 13, weight: 700, align: 'left', color: col.b });
      links(P, [[A, col.a], [{ x: P.x, y: S.coast.y }, col.b]]); stn(A, col.a, '甲'); cross(P);
    } else {
      const nt = nearestTwo(S.probe);
      links(S.probe, [[S.lions[nt.best], col.c[nt.best]], [S.lions[nt.second], col.c[nt.second]]]);
      S.lions.forEach((L, i) => stn(L, col.c[i], String(i + 1))); cross(S.probe);
    }
  }

  const dot = v => `<span class="dot" style="background:var(${v})"></span> `;
  function panel() {
    $('m5vav').textContent = va() + ' km/h'; $('m5vbv').textContent = vb() + ' km/h'; $('m5waitv').textContent = wait() + ' 分';
    if (pair()) {
      const P = S.ems.P, a = tA(P), b = tB(P), dA = dist(P, S.ems.A), dB = dBof(P), cst = S.mode === 'coast', nb = cst ? '海邊' : '乙';
      boxes($('m5probe'), [
        ['這個地點', cst
          ? (tieEms(a, b) ? '兩邊幾乎一樣快' : (a < b ? dot('--indigo') + '去甲比較快' : dot('--orange') + '去海邊比較快'))
          : (tieEms(a, b) ? '幾乎同時到' : (a < b ? dot('--indigo') + '甲先到' : dot('--orange') + '乙先到')), 'hot'],
        cst ? ['從這裡到甲', fmt(a, 1) + ' 分', 'blue'] : ['甲到這裡', fmt(a, 1) + ' 分', 'blue'],
        cst ? ['從這裡到海邊', fmt(b, 1) + ' 分', 'hot'] : ['乙到這裡', fmt(b, 1) + ' 分', 'hot'],
        ['到甲的距離', fmt(dA, 2) + ' 公里'], ['到' + nb + '的距離', fmt(dB, 2) + ' 公里'],
        ['到甲 ÷ 到' + nb, fmt(dA / dB, 2)], ['到甲 − 到' + nb, fmt(dA - dB, 2) + ' 公里']
      ]);
    } else {
      const nt = nearestTwo(S.probe);
      boxes($('m5probe'), [
        ['這個地點', tieLion(nt) ? '兩尊幾乎一樣近' : dot(CV[nt.best]) + '第 ' + (nt.best + 1) + ' 尊守護', 'hot'],
        ['最近：第 ' + (nt.best + 1) + ' 尊', fmt(nt.d1, 2) + ' 公里'], ['次近：第 ' + (nt.second + 1) + ' 尊', fmt(nt.d2, 2) + ' 公里'],
        ['走路到最近那尊', fmt(nt.d1 / WALK * 60, 1) + ' 分']
      ]);
    }
    const n = S.samples.length;
    if (!n) { $('m5stats').innerHTML = ''; $('m5ask').hidden = true; return; }
    const ties = S.samples.filter(s => s.tie), list = [['已經檢查', n + ' 個點']];
    if (pair()) {
      const cst = S.mode === 'coast', nb = cst ? '海邊' : '乙';
      const nA = S.samples.filter(s => !s.tie && s.win === 'A').length;
      if (cst) list.push(['去甲比較快', nA + '', 'blue'], ['去海邊比較快', (n - nA - ties.length) + '', 'hot'], ['幾乎一樣快（圈起來）', ties.length + '']);
      else list.push(['甲先到', nA + '', 'blue'], ['乙先到', (n - nA - ties.length) + '', 'hot'], ['幾乎同時（圈起來）', ties.length + '']);
      if (ties.length) {
        const R = ties.map(s => s.ratio), D = ties.map(s => s.diff);
        list.push(['圈起來的點：到甲 ÷ 到' + nb, fmt(Math.min(...R), 2) + '～' + fmt(Math.max(...R), 2)]);
        list.push(['圈起來的點：到甲 − 到' + nb, fmt(Math.min(...D), 2) + '～' + fmt(Math.max(...D), 2)]);
      }
    } else {
      const cnt = S.lions.map(() => 0); S.samples.forEach(s => { if (!s.tie) cnt[s.win]++; });
      cnt.forEach((v, i) => list.push([dot(CV[i]) + '第 ' + (i + 1) + ' 尊', v + '']));
      list.push(['兩尊幾乎一樣近（圈起來）', ties.length + '']);
    }
    boxes($('m5stats'), list);
    $('m5ask').textContent = `電腦確認了 ${n} 個點，你還需要什麼？`; $('m5ask').hidden = false;
  }
  function run() {
    for (let i = 0; i < 1000; i++) {
      let p = { x: Math.random() * W, y: Math.random() * H };
      while (!onLand(p)) p = { x: Math.random() * W, y: Math.random() * H };
      if (pair()) {
        const g = gap(p), dA = dist(p, S.ems.A), dB = dBof(p);
        S.samples.push({ ...p, tie: tieEms(tA(p), tB(p)), win: g < 0 ? 'A' : 'B', ratio: dA / dB, diff: dA - dB });
      } else { const nt = nearestTwo(p); S.samples.push({ ...p, tie: tieLion(nt), win: nt.best }); }
    }
    $('m5run').textContent = '再跑 1000 個點'; panel(); draw();
  }
  function clearS() { S.samples = []; $('m5run').textContent = '隨機跑 1000 個點'; }
  const LEADS = {
    ems: '拖曳十字標記換個事故地點，看看是哪一輛先到；也可以拖曳甲、乙兩個據點，改改兩邊的車速。',
    lions: '每一處都由離它最近的那尊風獅爺守護。拖曳十字標記看看誰在守護它；也可以搬動風獅爺。',
    coast: '十字標記是你所在的地方。從這裡去甲據點，和走到最近的海邊，哪一個比較快？拖曳甲、海岸線或十字標記，改改兩邊的速度。'
  };
  function setMode(m) {
    S.mode = m; $('m5lead').textContent = LEADS[m];
    $('m5speed').hidden = !pair(); $('m5specialwrap').hidden = !pair();
    $('m5valab').textContent = m === 'coast' ? '去甲的速度' : '甲車速';
    $('m5vblab').textContent = m === 'coast' ? '去海邊的速度' : '乙車速';
    $('m5waitlab').textContent = m === 'coast' ? '去海邊要多花幾分鐘' : '乙先等多久';
    if (m === 'coast') keepLand();
    clearS(); panel(); draw();
  }
  function hit(p) {
    const tol = 22 / st.k;
    const cand = S.mode === 'ems' ? [['P', S.ems.P], ['A', S.ems.A], ['B', S.ems.B]]
      : S.mode === 'coast' ? [['P', S.ems.P], ['A', S.ems.A]] : [['P', S.probe], ...S.lions.map((L, i) => [i, L])];
    let best = null, bd = tol;
    for (const [k, q] of cand) { const d = dist(p, q); if (d < bd) { bd = d; best = k; } }
    if (best === null && S.mode === 'coast' && Math.abs(p.y - S.coast.y) < tol * 0.7) best = 'L';
    return best;
  }
  // 海岸線模式：甲和十字標記都要在陸地上；拖海岸線時不能越過它們
  function keepLand(k) {
    if (S.mode !== 'coast') return;
    const A = S.ems.A, P = S.ems.P, m = 0.15;
    if (k === 'L') S.coast.y = clamp(S.coast.y, Math.max(A.y, P.y) + m, H - 0.05);
    else { A.y = Math.min(A.y, S.coast.y - m); P.y = Math.min(P.y, S.coast.y - 0.05); }
  }
  const target = k => k === 'L' ? S.coast : pair() ? S.ems[k] : (k === 'P' ? S.probe : S.lions[k]);
  st.cv.addEventListener('pointerdown', e => {
    const p = st.pos(e), k = hit(p);
    if (k === null) { const t = target('P'); t.x = p.x; t.y = p.y; S.drag = 'P'; keepLand(); } else S.drag = k;
    st.cv.setPointerCapture(e.pointerId); panel(); draw();
  });
  st.cv.addEventListener('pointermove', e => {
    if (S.drag === null) return;
    const p = st.pos(e), t = target(S.drag);
    if (S.drag !== 'L') t.x = clamp(p.x, 0.05, W - 0.05); t.y = clamp(p.y, 0.05, H - 0.05);
    keepLand(S.drag);
    if (S.drag !== 'P' && S.samples.length) clearS();
    panel(); draw();
  });
  const end = () => { S.drag = null; };
  st.cv.addEventListener('pointerup', end); st.cv.addEventListener('pointercancel', end);
  ['m5va', 'm5vb', 'm5wait'].forEach(id => $(id).addEventListener('input', () => { clearS(); panel(); draw(); }));
  ['m5fill', 'm5edge', 'm5special'].forEach(id => $(id).addEventListener('change', draw));
  $('m5run').addEventListener('click', run);
  $('m5clear').addEventListener('click', () => { clearS(); panel(); draw(); });
  segbind('m5seg', setMode);
  setMode('ems');
}


readPal();
lab5(); 
const recolor = () => { readPal(); REDRAW.forEach(f => f()); };
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', recolor);
new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(recolor);

</script>
