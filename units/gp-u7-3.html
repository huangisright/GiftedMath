    <h1>中點又是正三角形</h1>
    <p class="lede">兩個正三角形 <i>ABC</i>、<i>PQR</i>，對應頂點連起來取中點 <i>D</i>、<i>E</i>、<i>F</i>。兩個三角形放在哪裡都可以。</p>

      <svg id="stage" viewBox="0 0 440 400" role="img" aria-label="兩個三角形與對應頂點的中點" tabindex="0"></svg>
      <p class="hint">橘色的點可以拖：<i>A</i>、<i>B</i>、<i>P</i>、<i>Q</i>。單位 mm；預設和學習單第 1 頁一樣。</p>
    </div>

      <div class="rows">
        <div class="row"><span class="sw" style="background:var(--orange)"></span><span><i>DE</i>　<i>EF</i>　<i>FD</i></span><span class="val" id="v1" style="font-size:20px"></span></div>
        <div class="row" id="rowS" hidden><span class="sw" style="background:var(--ink)"></span><span>三邊比<br><small style="color:var(--ink-3)"><i>ABC</i>　│　<i>DEF</i></small></span><span class="val" id="v2" style="font-size:16px;white-space:nowrap"></span></div>
      </div>

<script>
(function(){
  const NS="http://www.w3.org/2000/svg", $=(id)=>document.getElementById(id), svg=$("stage");
  const HOME=()=>({A:[4,6],B:[34,6],P:[52,4],Q:[52,20]});
  let s=HOME(), flip=false, sim=false, mv=false, t=0.5, drag=null, running=false;
  let view={k:6,ox:30,oy:360};
  const X=(p)=>[view.ox+p[0]*view.k, view.oy-p[1]*view.k], Wd=(q)=>[(q[0]-view.ox)/view.k,(view.oy-q[1])/view.k];
  function fit(){ const T=pts(s), v=[T.A[0]-T.P[0],T.A[1]-T.P[1]]; let ps=[T.A,T.B,T.C,T.P,T.Q,T.R];
    if(mv) ps=ps.concat([[T.Q[0]+v[0],T.Q[1]+v[1]],[T.R[0]+v[0],T.R[1]+v[1]]]);
    const xs=ps.map(p=>p[0]), ys=ps.map(p=>p[1]), w=Math.max(...xs)-Math.min(...xs)||1, h=Math.max(...ys)-Math.min(...ys)||1;
    const k=Math.min(7, 370/w, 330/h); view={k, ox:220-k*(Math.max(...xs)+Math.min(...xs))/2, oy:200+k*(Math.max(...ys)+Math.min(...ys))/2}; }
  const mul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1]], add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  const E60=[0.5,Math.sqrt(3)/2];
  // 相似：C = A + (B−A)(1 + i·tan30°)，30°–60°–90° 三角形（直角在 B）
  function shapeK(f){ if(sim) return f?[1,-Math.tan(Math.PI/6)]:[1,Math.tan(Math.PI/6)]; return f?[0.5,-Math.sqrt(3)/2]:E60; }
  function third(a,b,f){ return add(a,mul(sub(b,a),shapeK(f))); }
  function pts(st){ const C=third(st.A,st.B,false), R=third(st.P,st.Q,flip); return {A:st.A,B:st.B,C,P:st.P,Q:st.Q,R}; }
  const lerp=(a,b,u)=>[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];
  function el(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
  function txt(p,tx,cls,fill,dx,dy){const q=X(p);const e=el("text",{x:q[0]+(dx||0),y:q[1]+(dy||0),class:cls,"text-anchor":"middle","dominant-baseline":"middle"});if(fill)e.style.fill=fill;e.textContent=tx;return e;}
  const pg=(ps,cls)=>el("polygon",{points:ps.map(p=>X(p).join(",")).join(" "),class:cls});
  function ln(a,b,cls){const p=X(a),q=X(b);el("line",{x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:cls});}
  function lab(p,c,tx){const v=sub(p,c),L=Math.hypot(...v)||1;txt(p,tx,"lab",null,v[0]/L*18,-v[1]/L*18);}
  function draw(){
    svg.innerHTML=""; const T=pts(s);
    const D=lerp(T.A,T.P,t), E=lerp(T.B,T.Q,t), F=lerp(T.C,T.R,t);
    if(mv){ const v=sub(T.A,T.P), Q2=add(T.Q,v), R2=add(T.R,v); pg([T.A,Q2,R2],"t2g");
      ln(T.B,Q2,"con"); ln(T.C,R2,"con"); const E2=lerp(T.B,Q2,t), F2=lerp(T.C,R2,t);
      ln(T.A,E2,"gl"); ln(T.A,F2,"gl"); [E2,F2].forEach((m,i)=>{const q=X(m);el("circle",{cx:q[0],cy:q[1],r:4.5,fill:"var(--green)"});txt(m,i?"F′":"E′","lab2","var(--green)",14,-10);});
      txt(Q2,"Q′","lab2","var(--orange)",14,0); txt(R2,"R′","lab2","var(--orange)",-14,0); }
    ln(T.A,T.P,"con"); ln(T.B,T.Q,"con"); ln(T.C,T.R,"con");
    pg([T.A,T.B,T.C],"t1"); pg([T.P,T.Q,T.R],"t2"); pg([D,E,F],"mid");
    const G1=[(T.A[0]+T.B[0]+T.C[0])/3,(T.A[1]+T.B[1]+T.C[1])/3], G2=[(T.P[0]+T.Q[0]+T.R[0])/3,(T.P[1]+T.Q[1]+T.R[1])/3];
    lab(T.A,G1,"A");lab(T.B,G1,"B");lab(T.C,G1,"C");lab(T.P,G2,"P");lab(T.Q,G2,"Q");lab(T.R,G2,"R");
    [[D,"D"],[E,"E"],[F,"F"]].forEach(([m,tx])=>{const q=X(m);el("circle",{cx:q[0],cy:q[1],r:4.5,fill:"var(--orange)"});txt(m,tx,"lab2","var(--orange)",12,12);});
    ["A","B","P","Q"].forEach(h=>{const q=X(s[h]);el("circle",{cx:q[0],cy:q[1],r:18,class:"hit","data-h":h});el("circle",{cx:q[0],cy:q[1],r:7,class:"drag","data-h":h});});
    const d=[dist(D,E),dist(E,F),dist(F,D)];
    $("v1").textContent=d.map(x=>x.toFixed(1)).join("　");
    if(sim){ const a=[dist(T.A,T.B),dist(T.B,T.C),dist(T.C,T.A)]; const n=(arr)=>arr.map(x=>(x/arr[0]).toFixed(2)).join(":");
      $("rowS").hidden=false; $("v2").textContent=n(a)+"　│　"+(d[0]>1e-9?n(d):"—"); $("sk").textContent="比例最多差";
      const g=d[0]>1e-9?Math.max(...d.map((x,i)=>Math.abs(x/d[0]-a[i]/a[0]))):0; $("vd").textContent=g<0.0005?"0.000":g.toFixed(3); }
    else { $("rowS").hidden=true; $("sk").textContent="最長減最短"; const g=Math.max(...d)-Math.min(...d); $("vd").textContent=g<0.005?"0.00":g.toFixed(2); }
    $("tv").textContent=Math.abs(t-0.5)<1e-9?"½":t.toFixed(2);
  }
  function svgPt(ev){const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());return [q.x,q.y];}
  svg.addEventListener("pointerdown",(ev)=>{const h=ev.target.getAttribute&&ev.target.getAttribute("data-h");if(!h||running)return;drag=h;svg.setPointerCapture(ev.pointerId);ev.preventDefault();});
  svg.addEventListener("pointermove",(ev)=>{if(!drag)return;const w=Wd(svgPt(ev));const p=[Math.round(w[0]*2)/2,Math.round(w[1]*2)/2];
    const o={...s,[drag]:p}; if(dist(o.A,o.B)<3&&dist(o.P,o.Q)<0.01&&drag!=="P"&&drag!=="Q") return; s=o; clearStat(); draw();});
  const end=()=>{if(drag){drag=null;fit();draw();}};svg.addEventListener("pointerup",end);svg.addEventListener("pointercancel",end);
  function clearStat(){$("stat").textContent="";$("ask").hidden=true;}
  function tog(id,f){$(id).addEventListener("click",()=>{const v=f();$(id).setAttribute("aria-pressed",String(v));clearStat();fit();draw();});}
  tog("flip",()=>flip=!flip); tog("sim",()=>sim=!sim); tog("mv",()=>mv=!mv);
  $("t").addEventListener("input",()=>{t=+$("t").value;clearStat();draw();});
  $("home").addEventListener("click",()=>{if(running)return;s=HOME();t=0.5;$("t").value=0.5;clearStat();fit();draw();});
  $("run").addEventListener("click",()=>{
    if(running)return; clearStat(); running=true; $("run").disabled=true;
    const keep=JSON.parse(JSON.stringify(s)), N=1000, reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches, stp=reduce?N:25;
    let done=0, worst=0;
    function tick(){
      for(let i=0;i<stp&&done<N;i++){ const r=()=>[Math.random()*55,Math.random()*45+3]; const st={A:r(),B:r(),P:r(),Q:r()};
        if(dist(st.A,st.B)<4||dist(st.P,st.Q)<2) continue; const T=pts(st);
        const D=lerp(T.A,T.P,t),E=lerp(T.B,T.Q,t),F=lerp(T.C,T.R,t); const d=[dist(D,E),dist(E,F),dist(F,D)];
        if(d[0]<1e-6) continue;
        let g; if(sim){const a=[dist(T.A,T.B),dist(T.B,T.C),dist(T.C,T.A)]; g=Math.max(...d.map((x,j)=>Math.abs(x/d[0]-a[j]/a[0])));} else g=Math.max(...d)-Math.min(...d);
        worst=Math.max(worst,g); s=st; done++; }
      fit(); draw(); $("stat").innerHTML=`放了 <b>${done}</b> 對`;
      if(done<N) requestAnimationFrame(tick);
      else{ running=false; $("run").disabled=false; s=keep; fit(); draw(); $("stat").innerHTML=`${done} 對：${sim?"比例":"三段"}最多差 <b>${worst<1e-6?"＜ 0.000001":worst.toFixed(3)}</b>`; $("ask").hidden=false; }
    }
    requestAnimationFrame(tick);
  });
  fit(); draw();
})();
</script>
