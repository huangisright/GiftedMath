<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元六　第 1 節</div>
    <h1>乘起來還是那個數</h1>
    <p class="lede">穿過 <i>P</i> 的直線和圓交在 <i>A</i>、<i>B</i>。拖 <i>P</i>，或拖藍色把手轉動直線，看 <i>PA</i> 和 <i>PB</i> 乘起來。</p>
  </header>

  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 400" role="img" aria-label="圓、可拖動的點 P 與可轉動的直線" tabindex="0"></svg>
      <p class="hint">橘色是 <i>P</i>，藍色把手轉動直線。單位 mm；半徑 30，預設和學習單第 1 頁一樣。</p>
    </div>

    <div class="panel">
      <div class="rows">
        <div class="row"><span class="sw" style="background:var(--ink-2)"></span><span><i>PA</i></span><span class="val" id="vA"></span></div>
        <div class="row"><span class="sw" style="background:var(--ink-2)"></span><span><i>PB</i></span><span class="val" id="vB"></span></div>
        <div class="row" id="rowD" hidden><span class="sw" style="background:var(--indigo)"></span><span><i>d</i>² − <i>r</i>²</span><span class="val" id="vD"></span></div>
      </div>
      <div class="sum"><span class="k"><i>PA</i> × <i>PB</i></span><span class="v" id="vP"></span></div>

        </div>
        <div class="stat" id="stat" aria-live="polite"></div>
        <p class="q" id="ask" hidden>電腦確認了一千條線。你還需要什麼？</p>
        <details id="more">

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage"), R = 30, K = 5, O0 = [205, 200];
  const HOME = { P: [18, 0], phi: Math.acos(-5/9) };
  let s = { P: HOME.P.slice(), phi: HOME.phi }, showPerp = false, signed = false, showD = false, running = false, drag = null;
  const X = (p) => [O0[0] + p[0]*K, O0[1] - p[1]*K];
  const W = (q) => [(q[0] - O0[0]) / K, (O0[1] - q[1]) / K];
  function el(tag, a){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls, fill){ const e = el("text", { x, y, class: cls, "text-anchor": "middle", "dominant-baseline": "middle" }); if (fill) e.style.fill = fill; e.textContent = t; return e; }
  function line(P, Q, cls){ const a = X(P), b = X(Q); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: cls }); }
  function dot(P, c, r){ const q = X(P); el("circle", { cx: q[0], cy: q[1], r: r || 4.2, fill: c }); }
  function meet(P, phi){ const u = [Math.cos(phi), Math.sin(phi)], b = P[0]*u[0] + P[1]*u[1], c = P[0]*P[0] + P[1]*P[1] - R*R, D = b*b - c;
    if (D < 0) return null; const sq = Math.sqrt(D); return { u, t1: -b - sq, t2: -b + sq }; }
  const f2 = (v) => Math.abs(v) < 0.005 ? "0.00" : v.toFixed(2);
  const fmt = (g) => g < 1e-6 ? "＜ 0.000001" : (g < 0.01 ? g.toExponential(1) : g.toFixed(3));
  function draw(){
    svg.innerHTML = "";
    const P = s.P, m = meet(P, s.phi), u = [Math.cos(s.phi), Math.sin(s.phi)];
    const o = X([0, 0]); el("circle", { cx: o[0], cy: o[1], r: R*K, class: "circ" });
    const far = 200; line([P[0] - u[0]*far, P[1] - u[1]*far], [P[0] + u[0]*far, P[1] + u[1]*far], "ln2");
    const d2 = P[0]*P[0] + P[1]*P[1], pw = d2 - R*R;
    if (m){
      const A = [P[0] + u[0]*m.t1, P[1] + u[1]*m.t1], B = [P[0] + u[0]*m.t2, P[1] + u[1]*m.t2];
      const lo = Math.min(0, m.t1), hi = Math.max(0, m.t2);
      line([P[0] + u[0]*lo, P[1] + u[1]*lo], [P[0] + u[0]*hi, P[1] + u[1]*hi], "ln");
      if (showPerp){ const t0 = -(P[0]*u[0] + P[1]*u[1]), F = [P[0] + u[0]*t0, P[1] + u[1]*t0]; line([0, 0], F, "perp"); dot(F, "var(--indigo)", 3.5); const q = X(F); txt(q[0] + 12, q[1] + 12, "F", "lab2", "var(--indigo)"); }
      const PA = Math.abs(m.t1), PB = Math.abs(m.t2), inside = m.t1 < 0 && m.t2 > 0, prod = PA*PB * (signed && inside ? -1 : 1);
      dot(A, "var(--ink)"); dot(B, "var(--ink)");
      [["A", A], ["B", B]].forEach(([t, V]) => { const L = Math.hypot(...V) || 1, q = X([V[0]*(1 + 6/L), V[1]*(1 + 6/L)]); txt(q[0], q[1], t, "lab"); });
      $("vA").textContent = f2(PA); $("vB").textContent = f2(PB); $("vP").textContent = f2(prod);
    } else { $("vA").textContent = "—"; $("vB").textContent = "—"; $("vP").textContent = "沒有交點"; }
    $("vD").textContent = f2(pw); $("rowD").hidden = !showD;
    dot([0, 0], "var(--ink-2)", 3.5); txt(o[0] - 12, o[1] + 14, "O", "lab2", "var(--ink-2)");
    const H = [P[0] + u[0]*42, P[1] + u[1]*42], h = X(H), p = X(P);
    el("circle", { cx: h[0], cy: h[1], r: 18, class: "hit", "data-h": "H" }); el("circle", { cx: h[0], cy: h[1], r: 7, class: "handle", "data-h": "H" });
    el("circle", { cx: p[0], cy: p[1], r: 18, class: "hit", "data-h": "P" }); el("circle", { cx: p[0], cy: p[1], r: 8, class: "drag", "data-h": "P" });
    txt(p[0] + 14, p[1] - 14, "P", "lab2", "var(--orange)");
  }
  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const w = W(svgPt(ev));
    if (drag === "P"){ if (Math.hypot(...w) > 42) return; s.P = w; }
    else { const v = [w[0] - s.P[0], w[1] - s.P[1]]; if (Math.hypot(...v) < 2) return; s.phi = Math.atan2(v[1], v[0]); }
    clearStat(); draw(); });
  const end = () => { drag = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }
  function tog(id, f){ $(id).addEventListener("click", () => { const v = f(); $(id).setAttribute("aria-pressed", String(v)); draw(); }); }
  tog("perp", () => (showPerp = !showPerp)); tog("sgn", () => (signed = !signed)); tog("dr", () => (showD = !showD));
  $("home").addEventListener("click", () => { if (running) return; s = { P: HOME.P.slice(), phi: HOME.phi }; clearStat(); draw(); });
  $("run").addEventListener("click", () => {
    if (running) return; clearStat(); running = true; $("run").disabled = true;
    const keep = s.phi, N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 25;
    let done = 0, lo = Infinity, hi = -Infinity;
    function tick(){
      for (let i = 0; i < step && done < N; i++){
        let m, phi; do { phi = Math.random()*Math.PI*2; m = meet(s.P, phi); } while (!m);
        const v = Math.abs(m.t1*m.t2); lo = Math.min(lo, v); hi = Math.max(hi, v); s.phi = phi; done++;
      }
      draw(); $("stat").innerHTML = `轉了 <b>${done}</b> 條線`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false; s.phi = keep; draw();
        $("stat").innerHTML = `${done} 條線：乘積最大和最小差 <b>${fmt(hi - lo)}</b>`; $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  svg.addEventListener("keydown", (ev) => { const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[ev.key]; if (!mv) return;
    ev.preventDefault(); s.P = [s.P[0] + mv[0], s.P[1] + mv[1]]; clearStat(); draw(); });
  draw();
})();
</script>
