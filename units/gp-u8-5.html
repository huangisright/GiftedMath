<script>
(function(){
  const NS="http://www.w3.org/2000/svg", $=(id)=>document.getElementById(id), svg=$("stage");
  const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
  function inter(p1,p2,p3,p4){const d=(p1[0]-p2[0])*(p3[1]-p4[1])-(p1[1]-p2[1])*(p3[0]-p4[0]); if(Math.abs(d)<1e-15)return null;
    const t=((p1[0]-p3[0])*(p3[1]-p4[1])-(p1[1]-p3[1])*(p3[0]-p4[0]))/d; return [p1[0]+t*(p2[0]-p1[0]),p1[1]+t*(p2[1]-p1[1])];}
  const ang=(P,Q,R)=>{const a=[P[0]-Q[0],P[1]-Q[1]],b=[R[0]-Q[0],R[1]-Q[1]];return deg(Math.acos((a[0]*b[0]+a[1]*b[1])/Math.hypot(...a)/Math.hypot(...b)));};
  let x=60,y=50,showLine=false;
  function geo(){ const B=[0,0],C=[1,0],A=inter(B,[Math.cos(rad(80)),Math.sin(rad(80))],C,[1-Math.cos(rad(80)),Math.sin(rad(80))]);
    const D=inter(A,B,C,[1-Math.cos(rad(x)),Math.sin(rad(x))]), E=inter(A,C,B,[Math.cos(rad(y)),Math.sin(rad(y))]);
    const G=inter(A,B,C,[1-Math.cos(rad(20)),Math.sin(rad(20))]); return {A,B,C,D,E,G,al:ang(C,D,E)}; }
  function el(tag,a,par){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(par||svg).appendChild(e);return e;}
  function txt(par,q,t,dx,dy,fill,sz){const e=el("text",{x:q[0]+dx,y:q[1]+dy,class:"lab","text-anchor":"middle","dominant-baseline":"middle"},par);if(fill)e.style.fill=fill;if(sz)e.style.fontSize=sz+"px";e.textContent=t;}
  function draw(){
    svg.innerHTML=""; const g=geo(), H=g.A[1], k=400/H, T=p=>[220+(p[0]-0.5)*k, 420-p[1]*k];
    const ln=(a,b,c)=>el("line",{x1:T(a)[0],y1:T(a)[1],x2:T(b)[0],y2:T(b)[1],class:c});
    el("polygon",{points:[g.A,g.B,g.C].map(p=>T(p).join(",")).join(" "),class:"tri"});
    if(showLine&&g.G){ const Eq=g.E; el("polygon",{points:[g.G,g.C,Eq].map(p=>T(p).join(",")).join(" "),class:"eq"}); ln(g.C,g.G,"sg"); txt(svg,T(g.G),"G",-16,0,"var(--orange)"); }
    if(g.D) ln(g.C,g.D,"sg"); if(g.E) ln(g.B,g.E,"sg"); if(g.D&&g.E) ln(g.D,g.E,"de");
    if(g.D&&g.E){ const d=T(g.D), a1=Math.atan2(-(T(g.E)[1]-d[1]),T(g.E)[0]-d[0]), a2=Math.atan2(-(T(g.C)[1]-d[1]),T(g.C)[0]-d[0]); const r=26;
      const p1=[d[0]+r*Math.cos(a1),d[1]-r*Math.sin(a1)], p2=[d[0]+r*Math.cos(a2),d[1]-r*Math.sin(a2)];
      el("path",{d:`M${p1} A${r},${r} 0 0 ${a1>a2?1:0} ${p2}`,class:"arc"}); const am=(a1+a2)/2; txt(svg,[d[0]+44*Math.cos(am),d[1]-44*Math.sin(am)],"α",0,0,"var(--indigo)"); }
    [["A",g.A,0,-14],["B",g.B,-14,6],["C",g.C,14,6],["D",g.D,-16,0],["E",g.E,16,0]].forEach(([t,p,dx,dy])=>{if(!p)return; const q=T(p); el("circle",{cx:q[0],cy:q[1],r:3.5,fill:"var(--ink)"}); txt(svg,q,t,dx,dy);});
    $("xv").textContent=x+"°"; $("yv").textContent=y+"°"; $("va").textContent=g.D&&g.E?g.al.toFixed(2)+"°":"—";
  }
  $("x").addEventListener("input",()=>{x=+$("x").value;$("stat").textContent="";$("ask").hidden=true;draw();});
  $("y").addEventListener("input",()=>{y=+$("y").value;$("stat").textContent="";$("ask").hidden=true;draw();});
  $("prec").addEventListener("click",()=>{const g=geo(); $("stat").innerHTML=`用三角函數算：<i>α</i> ＝ <b>${g.al.toFixed(10)}</b>°`; $("ask").hidden=false;});
  $("home").addEventListener("click",()=>{x=60;y=50;$("x").value=60;$("y").value=50;$("stat").textContent="";$("ask").hidden=true;draw();});
  $("line").addEventListener("click",()=>{showLine=!showLine;$("line").setAttribute("aria-pressed",String(showLine));draw();});
  draw();
  // ---- 牆上那一題 ----
  const W=$("wall"); let V={A:[150,40],B:[30,350],C:[380,330],P:[200,240]}, wd=null, wrun=false;
  function dl(P,U,Q){const d=[Q[0]-U[0],Q[1]-U[1]]; return Math.abs(d[0]*(P[1]-U[1])-d[1]*(P[0]-U[0]))/Math.hypot(...d);}
  function foot(P,U,Q){const d=[Q[0]-U[0],Q[1]-U[1]],t=((P[0]-U[0])*d[0]+(P[1]-U[1])*d[1])/(d[0]*d[0]+d[1]*d[1]);return [U[0]+t*d[0],U[1]+t*d[1]];}
  const sumd=P=>dl(P,V.B,V.C)+dl(P,V.C,V.A)+dl(P,V.A,V.B);
  const inside=P=>{const s=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]); const d1=s(V.A,V.B,P),d2=s(V.B,V.C,P),d3=s(V.C,V.A,P); return (d1>=0&&d2>=0&&d3>=0)||(d1<=0&&d2<=0&&d3<=0);};
  function wdraw(extra){
    W.innerHTML=""; el("polygon",{points:[V.A,V.B,V.C].map(p=>p.join(",")).join(" "),class:"tri"},W);
    if(extra) extra.forEach(p=>el("circle",{cx:p[0],cy:p[1],r:2,fill:"var(--ink-3)"},W));
    [[V.B,V.C],[V.C,V.A],[V.A,V.B]].forEach(([u,q])=>{const f=foot(V.P,u,q); el("line",{x1:V.P[0],y1:V.P[1],x2:f[0],y2:f[1],class:"dl"},W);});
    [["A",V.A,0,-16],["B",V.B,-14,10],["C",V.C,14,10],["P",V.P,14,-12]].forEach(([t,p,dx,dy])=>txt(W,p,t,dx,dy));
    Object.keys(V).forEach(h=>{el("circle",{cx:V[h][0],cy:V[h][1],r:16,class:"hit","data-h":h},W);el("circle",{cx:V[h][0],cy:V[h][1],r:6.5,class:"drag","data-h":h},W);});
    $("ws").textContent=(sumd(V.P)/10).toFixed(2);
  }
  function wpt(ev){const pt=W.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(W.getScreenCTM().inverse());return [q.x,q.y];}
  W.addEventListener("pointerdown",ev=>{const h=ev.target.getAttribute&&ev.target.getAttribute("data-h"); if(!h||wrun)return; wd=h; W.setPointerCapture(ev.pointerId); ev.preventDefault();});
  W.addEventListener("pointermove",ev=>{ if(!wd)return; const p=wpt(ev).map(v=>Math.max(8,Math.min(432,v))); if(wd==="P"&&!inside(p)) return; const old=V[wd]; V[wd]=p; if(!inside(V.P)) V[wd]=old; $("wstat").textContent=""; wdraw(); });
  const wend=()=>{wd=null;}; W.addEventListener("pointerup",wend); W.addEventListener("pointercancel",wend);
  $("weq").addEventListener("click",()=>{ if(wrun)return; V={A:[220,40],B:[220-170,40+170*Math.sqrt(3)],C:[220+170,40+170*Math.sqrt(3)],P:[220,240]}; $("wstat").textContent=""; wdraw(); });
  $("wrun").addEventListener("click",()=>{ if(wrun)return; wrun=true; $("wrun").disabled=true; let mn=1e9,mx=-1e9,pts=[],done=0;
    function tick(){ for(let i=0;i<40&&done<1000;i++){ let r1=Math.random(),r2=Math.random(); if(r1+r2>1){r1=1-r1;r2=1-r2;}
        const p=[V.A[0]+r1*(V.B[0]-V.A[0])+r2*(V.C[0]-V.A[0]), V.A[1]+r1*(V.B[1]-V.A[1])+r2*(V.C[1]-V.A[1])]; const s=sumd(p)/10; mn=Math.min(mn,s); mx=Math.max(mx,s); pts.push(p); done++; }
      wdraw(pts); $("wstat").innerHTML=`跑了 <b>${done}</b> 個點：最小 <b>${mn.toFixed(2)}</b>，最大 <b>${mx.toFixed(2)}</b>`;
      if(done<1000) requestAnimationFrame(tick); else { wrun=false; $("wrun").disabled=false; } }
    requestAnimationFrame(tick); });
  wdraw();
})();
</script>
