<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元五　第 1 節</div>
    <h1>三個點排成一列</h1>
    <p class="lede"><i>O</i> 是外心、<i>G</i> 是重心、<i>H</i> 是垂心。拖動三角形，看這三個點的位置有什麼關係。</p>
  </header>

  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 380" role="img" aria-label="可拖動頂點的三角形，以及外心、重心、垂心" tabindex="0"></svg>
      <p class="hint">拖動橘色的頂點 <i>A</i>、<i>B</i>、<i>C</i>。單位 mm；預設和學習單第 1 頁一樣（實際大小時 <i>GO</i> ＝ 10、<i>GH</i> ＝ 20）。</p>
    </div>

    <div class="panel">
      <div class="btns">
        <button type="button" class="btn" id="mid" aria-pressed="false">中點三角形</button>
      </div>
      <div class="rows" style="margin-top:12px">
        <div class="row"><span class="sw" style="background:var(--ink-3)"></span><span><i>GH</i> ÷ <i>GO</i></span><span class="val" id="vR"></span></div>
      </div>
      <div class="sum"><span class="k"><i>G</i> 離直線 <i>OH</i>（mm）</span><span class="v" id="vD" style="font-size:clamp(30px,5vw,44px)"></span></div>

      <div class="controls">
        <div class="btns">
          <button type="button" class="btn primary" id="run">隨機換 1000 個三角形</button>
          <button type="button" class="btn" id="home">回到學習單的圖</button>
        </div>
        <div class="stat" id="stat" aria-live="polite"></div>
        <p class="q" id="ask" hidden>電腦確認了一千個三角形。你還需要什麼？</p>
        <details id="more">
          <summary>更多</summary>
          <div class="btns">
            <button type="button" class="btn" id="thru" aria-pressed="false">從 <i>G</i> 連過去</button>
            <button type="button" class="btn" id="alts" aria-pressed="false">兩組高</button>
          </div>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const ang = [132, 214, 326].map(t => [Math.cos(t*Math.PI/180), Math.sin(t*Math.PI/180)]);
  const Sx = ang[0][0]+ang[1][0]+ang[2][0], Sy = ang[0][1]+ang[1][1]+ang[2][1], R0 = 30 / Math.hypot(Sx, Sy);
  const HOME = { A: [ang[0][0]*R0, ang[0][1]*R0], B: [ang[1][0]*R0, ang[1][1]*R0], C: [ang[2][0]*R0, ang[2][1]*R0] };
  let s = JSON.parse(JSON.stringify(HOME)), showM = false, showT = false, showA = false, running = false, drag = null;
  const K = 4.6, O0 = [220, 205];
  const X = (p) => [O0[0] + p[0]*K, O0[1] - p[1]*K];
  const W = (q) => [(q[0] - O0[0]) / K, (O0[1] - q[1]) / K];
  function el(tag, a){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls, fill){ const e = el("text", { x, y, class: cls, "text-anchor": "middle", "dominant-baseline": "middle" }); if (fill) e.style.fill = fill; e.textContent = t; return e; }
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const lerp = (p, q, t) => [p[0] + (q[0]-p[0])*t, p[1] + (q[1]-p[1])*t];
  const cross = (o, p, q) => (p[0]-o[0])*(q[1]-o[1]) - (p[1]-o[1])*(q[0]-o[0]);
  function foot(P, U, V){ const ux = V[0]-U[0], uy = V[1]-U[1], t = ((P[0]-U[0])*ux + (P[1]-U[1])*uy) / (ux*ux + uy*uy); return [U[0]+t*ux, U[1]+t*uy]; }
  function circ(A, B, C){ const D = 2*(A[0]*(B[1]-C[1]) + B[0]*(C[1]-A[1]) + C[0]*(A[1]-B[1]));
    const a2 = A[0]*A[0]+A[1]*A[1], b2 = B[0]*B[0]+B[1]*B[1], c2 = C[0]*C[0]+C[1]*C[1];
    return [(a2*(B[1]-C[1]) + b2*(C[1]-A[1]) + c2*(A[1]-B[1]))/D, (a2*(C[0]-B[0]) + b2*(A[0]-C[0]) + c2*(B[0]-A[0]))/D]; }
  function centers(A, B, C){ const O = circ(A, B, C), G = [(A[0]+B[0]+C[0])/3, (A[1]+B[1]+C[1])/3];
    // 垂心：兩條高的交點（不用公式，免得「讀出答案」）
    const F1 = foot(A, B, C), F2 = foot(B, C, A);
    const d = (A[0]-F1[0])*(B[1]-F2[1]) - (A[1]-F1[1])*(B[0]-F2[0]);
    const t = ((A[0]-B[0])*(B[1]-F2[1]) - (A[1]-B[1])*(B[0]-F2[0])) / d;
    const H = [A[0] + t*(F1[0]-A[0]), A[1] + t*(F1[1]-A[1])];
    return { O, G, H }; }
  function measure(A, B, C){ const { O, G, H } = centers(A, B, C); const go = dist(G, O), gh = dist(G, H), oh = dist(O, H);
    const off = oh < 1e-9 ? 0 : Math.abs(cross(O, H, G)) / oh; return { O, G, H, off, ratio: go < 1e-6 ? null : gh / go }; }
  const fmt = (g) => g < 1e-6 ? "＜ 0.000001" : (g < 0.01 ? g.toExponential(1) : g.toFixed(2));
  function seg(P, Q, cls, ext){ let p = P, q = Q; if (ext){ const u = [Q[0]-P[0], Q[1]-P[1]], L = Math.hypot(...u) || 1; p = [P[0]-u[0]/L*ext, P[1]-u[1]/L*ext]; q = [Q[0]+u[0]/L*ext, Q[1]+u[1]/L*ext]; }
    const a = X(p), b = X(q); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: cls }); }

  function draw(){
    svg.innerHTML = "";
    const { A, B, C } = s, m = measure(A, B, C);
    const D = lerp(B, C, .5), E = lerp(C, A, .5), F = lerp(A, B, .5);
    el("polygon", { points: [A, B, C].map(p => X(p).join(",")).join(" "), class: "side" });
    if (showM) el("polygon", { points: [D, E, F].map(p => X(p).join(",")).join(" "), class: "med" });
    if (showT){ seg(A, D, "thru", 4); seg(B, E, "thru", 4); seg(C, F, "thru", 4); seg(m.H, m.O, "thru", 8); }
    if (showA){ [[A, B, C], [B, C, A], [C, A, B]].forEach(([V, U, Wp]) => seg(V, foot(V, U, Wp), "alt", 0));
      [[D, B, C], [E, C, A], [F, A, B]].forEach(([M, U, Wp]) => { const v = [-(Wp[1]-U[1]), Wp[0]-U[0]], L = Math.hypot(...v);
        const toO = [m.O[0]-M[0], m.O[1]-M[1]], sgn = (toO[0]*v[0] + toO[1]*v[1]) >= 0 ? 1 : -1, len = Math.max(dist(M, m.O) + 6, 10);
        seg(M, [M[0] + sgn*v[0]/L*len, M[1] + sgn*v[1]/L*len], "alt2", 0); }); }
    if (showM) [["D", D], ["E", E], ["F", F]].forEach(([t, Q]) => { const q = X(Q); el("circle", { cx: q[0], cy: q[1], r: 3.5, fill: "var(--orange)" }); });
    [["O", m.O, "var(--indigo)"], ["G", m.G, "var(--ink)"], ["H", m.H, "var(--crimson)"]].forEach(([t, Q, c]) => {
      const q = X(Q), dy = t === "O" ? 14 : -11; el("circle", { cx: q[0], cy: q[1], r: 5, fill: c }); txt(q[0] + 13, q[1] + dy, t, "lab2", c); });
    const Gc = m.G;
    [["A", A], ["B", B], ["C", C]].forEach(([t, V]) => { const v = [V[0]-Gc[0], V[1]-Gc[1]], L = Math.hypot(...v) || 1, q = X([V[0] + v[0]/L*5, V[1] + v[1]/L*5]); txt(q[0], q[1], t, "lab"); });
    if (showM) [["D", D], ["E", E], ["F", F]].forEach(([t, Q]) => { const v = [Q[0]-Gc[0], Q[1]-Gc[1]], L = Math.hypot(...v) || 1, q = X([Q[0] + v[0]/L*4.5, Q[1] + v[1]/L*4.5]); txt(q[0], q[1], t, "lab", "var(--orange)"); });
    [["A", A], ["B", B], ["C", C]].forEach(([id, V]) => { const p = X(V); el("circle", { cx: p[0], cy: p[1], r: 18, class: "hit", "data-h": id }); el("circle", { cx: p[0], cy: p[1], r: 8, class: "drag", "data-h": id }); });
    $("vD").textContent = fmt(m.off); $("vR").textContent = m.ratio === null ? "—" : m.ratio.toFixed(3);
  }
  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const w = W(svgPt(ev)); const t = { ...s, [drag]: w };
    if (Math.abs(cross(t.A, t.B, t.C)) < 60) return; s[drag] = w; clearStat(); draw(); });
  const end = () => { drag = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }
  function tog(id, f){ $(id).addEventListener("click", () => { const v = f(); $(id).setAttribute("aria-pressed", String(v)); draw(); }); }
  tog("mid", () => (showM = !showM)); tog("thru", () => (showT = !showT)); tog("alts", () => (showA = !showA));
  $("home").addEventListener("click", () => { if (running) return; s = JSON.parse(JSON.stringify(HOME)); clearStat(); draw(); });
  $("run").addEventListener("click", () => {
    if (running) return; clearStat(); running = true; $("run").disabled = true;
    const keep = JSON.parse(JSON.stringify(s)), N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 25;
    let done = 0, worst = 0, rmin = Infinity, rmax = -Infinity;
    const rnd = () => [-36 + Math.random()*72, -26 + Math.random()*58];
    function tick(){
      for (let i = 0; i < step && done < N; i++){
        let T; do { T = { A: rnd(), B: rnd(), C: rnd() }; } while (Math.abs(cross(T.A, T.B, T.C)) < 400);
        const m = measure(T.A, T.B, T.C); if (m.ratio === null) continue; done++; worst = Math.max(worst, m.off);
        rmin = Math.min(rmin, m.ratio); rmax = Math.max(rmax, m.ratio); s = T;
      }
      draw(); $("stat").innerHTML = `換了 <b>${done}</b> 個三角形`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false; s = keep; draw();
        $("stat").innerHTML = `${done} 個三角形：<i>G</i> 離直線 <i>OH</i> 最遠 <b>${fmt(worst)}</b> mm；<i>GH</i> ÷ <i>GO</i> 最小 <b>${rmin.toFixed(6)}</b>、最大 <b>${rmax.toFixed(6)}</b>`;
        $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  svg.addEventListener("keydown", (ev) => { const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[ev.key]; if (!mv) return;
    ev.preventDefault(); s.A = [s.A[0] + mv[0], s.A[1] + mv[1]]; draw(); });
  draw();
})();
</script>
