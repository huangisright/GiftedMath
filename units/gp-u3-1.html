<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage"), R2D = 180 / Math.PI;
  const fmt = (x) => (Math.round(x * 10) / 10).toFixed(1);
  const PX = (48*48 - 24*24 + 45*45) / 90;
  const HOME = { A: [0, 0], B: [45, 0], P: [PX, Math.sqrt(48*48 - PX*PX)], k: 2 };
  const s = JSON.parse(JSON.stringify(HOME));
  let trail = [], showCD = false, showL = false, showC = false, running = false, drag = null;
  const K = 3.4, O = [70, 200];      // 固定比例：1 mm = 3.4 px
  const X = (p) => [O[0] + p[0]*K, O[1] - p[1]*K];
  const W = (q) => [(q[0] - O[0]) / K, (O[1] - q[1]) / K];
  function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls){ const e = el("text", { x, y, class: cls, "text-anchor": "middle" }); e.textContent = t; return e; }
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const line = (p, q, cls) => el("line", { x1: p[0], y1: p[1], x2: q[0], y2: q[1], class: cls });
  // C、D 與圓（k ≠ 1）
  function geo(){
    const k = s.k, A = s.A, B = s.B, d = dist(A, B), u = [(B[0]-A[0])/d, (B[1]-A[1])/d];
    const at = (t) => [A[0] + u[0]*t, A[1] + u[1]*t];
    if (Math.abs(k - 1) < 1e-9) return { line: true, M: at(d/2), u };
    const tc = d*k/(k+1), td = d*k/(k-1);
    return { C: at(tc), D: at(td), O: at((tc+td)/2), r: Math.abs(td - tc)/2, u };
  }
  // 從「近的那一點」往一個方向找比是 k 的點（二分法）
  function findOnRay(theta){
    const k = s.k; if (Math.abs(k - 1) < 1e-9) return null;
    const near = k > 1 ? s.B : s.A, far = k > 1 ? s.A : s.B, kk = k > 1 ? k : 1/k;
    const dir = [Math.cos(theta), Math.sin(theta)];
    const f = (t) => { const Q = [near[0] + dir[0]*t, near[1] + dir[1]*t]; return dist(Q, far) / dist(Q, near) - kk; };
    let lo = 1e-6, hi = 1; while (f(hi) > 0 && hi < 1e5) hi *= 2;
    if (f(hi) > 0) return null;
    for (let i = 0; i < 60; i++){ const m = (lo + hi) / 2; if (f(m) > 0) lo = m; else hi = m; }
    return [near[0] + dir[0]*lo, near[1] + dir[1]*lo];
  }

  function draw(){
    svg.innerHTML = "";
    const g = geo();
    const A = X(s.A), B = X(s.B), P = X(s.P);
    const u = g.u, far = (t) => X([s.A[0] + u[0]*t, s.A[1] + u[1]*t]);
    line(far(-60), far(200), "axis");
    if (showC){ if (g.line){ const M = g.M, v = [-u[1], u[0]]; line(X([M[0]+v[0]*-200, M[1]+v[1]*-200]), X([M[0]+v[0]*200, M[1]+v[1]*200]), "perp"); }
      else { const Oo = X(g.O); el("circle", { cx: Oo[0], cy: Oo[1], r: g.r*K, class: "circ" }); } }
    trail.forEach(q => { const t = X(q); el("circle", { cx: t[0], cy: t[1], r: 2.4, class: "trail" }); });
    line(P, A, "seg"); line(P, B, "seg");
    if (showL && !g.line){ const C = X(g.C), D = X(g.D); line(P, C, "bis1"); line(P, D, "bis2"); }
    if (showCD && !g.line){ const C = X(g.C), D = X(g.D); el("circle", { cx: C[0], cy: C[1], r: 5, class: "pt" }); el("circle", { cx: D[0], cy: D[1], r: 5, class: "pt" });
      txt(C[0] - 13, C[1] + 26, "C", "lab"); txt(D[0] + 13, D[1] + 26, "D", "lab"); }
    txt(A[0] - 4, A[1] + 26, "A", "lab"); txt(B[0] + 4, B[1] + 26, "B", "lab"); txt(P[0] + 16, P[1] - 12, "P", "lab");
    handle(A, "A", false); handle(B, "B", false); handle(P, "P", true);
    const pa = dist(s.P, s.A), pb = dist(s.P, s.B);
    $("vA").textContent = fmt(pa); $("vB").textContent = fmt(pb); $("vR").textContent = (pa / pb).toFixed(3);
    $("kv").textContent = s.k.toFixed(2);
    if (showCD || showL || showC){
      let t = "";
      if (g.line) t = "<i>k</i> ＝ 1：直線上只有中點，形狀是中垂線。";
      else { t = `<i>AC</i> ＝ ${fmt(dist(s.A, g.C))}，<i>AD</i> ＝ ${fmt(dist(s.A, g.D))}`;
        if (showL){ const a1 = ang(s.P, s.A, g.C), a2 = ang(s.P, g.C, s.B), r = ang(s.P, g.C, g.D);
          t += `　∠<i>APC</i> ＝ ${fmt(a1)}°，∠<i>CPB</i> ＝ ${fmt(a2)}°，∠<i>CPD</i> ＝ ${fmt(r)}°`; }
        if (showC) t += `　半徑 ${fmt(g.r)}`; }
      $("note").innerHTML = t; $("note").hidden = false;
    } else $("note").hidden = true;
  }
  function ang(V, P1, P2){ const a = [P1[0]-V[0], P1[1]-V[1]], b = [P2[0]-V[0], P2[1]-V[1]];
    return Math.acos(Math.max(-1, Math.min(1, (a[0]*b[0] + a[1]*b[1]) / (Math.hypot(...a) * Math.hypot(...b))))) * R2D; }
  function handle(p, id, on){
    el("circle", { cx: p[0], cy: p[1], r: 18, class: "hit", "data-h": id });
    el("circle", { cx: p[0], cy: p[1], r: 8, class: "drag" + (on ? " on" : ""), "data-h": id });
  }
  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const w = W(svgPt(ev));
    if (drag !== "P"){ const other = drag === "A" ? s.B : s.A; if (dist(w, other) < 10) return; trail = []; clearStat(); }
    s[drag] = w; draw(); });
  const end = () => { drag = null; };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }

  $("k").addEventListener("input", () => { s.k = $("k").value / 1000; if (Math.abs(s.k - 1) < 0.006) s.k = 1; trail = []; clearStat(); draw(); });
  $("clear").addEventListener("click", () => { if (running) return; trail = []; clearStat(); draw(); });
  $("home").addEventListener("click", () => { if (running) return; Object.assign(s, JSON.parse(JSON.stringify(HOME))); $("k").value = 2000; trail = []; showCD = showL = showC = false; syncBtns(); clearStat(); draw(); });
  function syncBtns(){ [["cd", showCD], ["lines", showL], ["circ", showC]].forEach(([id, v]) => $(id).setAttribute("aria-pressed", String(v))); }
  $("cd").addEventListener("click", () => { showCD = !showCD; syncBtns(); draw(); });
  $("lines").addEventListener("click", () => { showL = !showL; if (showL) showCD = true; syncBtns(); draw(); });
  $("circ").addEventListener("click", () => { showC = !showC; syncBtns(); draw(); });

  $("run").addEventListener("click", () => {
    if (running) return; clearStat();
    if (Math.abs(s.k - 1) < 1e-9){ $("stat").innerHTML = "<i>k</i> ＝ 1：這樣的點在 <i>AB</i> 的中垂線上，往兩個方向都找不完。"; return; }
    running = true; $("run").disabled = true; trail = [];
    const N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 20;
    let done = 0;
    function tick(){
      for (let i = 0; i < step && done < N; i++, done++){ const q = findOnRay(Math.random() * 2 * Math.PI); if (q) trail.push(q); }
      draw(); $("stat").innerHTML = `找了 <b>${done}</b> 個方向`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false;
        const xs = trail.map(q => q[0]), ys = trail.map(q => q[1]);
        $("stat").innerHTML = `找到 <b>${trail.length}</b> 個點。最左 ${fmt(Math.min(...xs))}、最右 ${fmt(Math.max(...xs))}、最高 ${fmt(Math.max(...ys))}、最低 ${fmt(Math.min(...ys))}（以 <i>A</i> 為原點）`;
        $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  svg.addEventListener("keydown", (ev) => { const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[ev.key]; if (!m) return;
    ev.preventDefault(); s.P = [s.P[0] + m[0], s.P[1] + m[1]]; draw(); });
  draw();
})();
</script>
