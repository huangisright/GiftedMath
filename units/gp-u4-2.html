    <h1>一條線穿過去</h1>
    <p class="lede">一條直線穿過三角形，碰到三條邊（或延長線）。三個比一直在變，什麼沒有變？</p>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage");
  // 學習單：AB 40、BC 56、CA 36；AF 24、BD 32、E 在 C 外 CE 36
  const AX = (1600 - 1296 + 3136) / 112, AY = Math.sqrt(1600 - AX*AX);
  const A0 = [AX, AY], B0 = [0, 0], C0 = [56, 0];
  const lerp = (p, q, t) => [p[0] + (q[0]-p[0])*t, p[1] + (q[1]-p[1])*t];
  const F0 = lerp(A0, B0, 24/40), E0 = [2*C0[0] - A0[0], 2*C0[1] - A0[1]];
  const HOME = { A: A0, B: B0, C: C0, U: lerp(F0, E0, -0.25), V: lerp(F0, E0, 1.08), O: [24, 10] };
  let s = JSON.parse(JSON.stringify(HOME)), mode = "line", signed = false, perp = false, running = false, drag = null;
  const K = 3.6, O = [70, 210];
  const X = (p) => [O[0] + p[0]*K, O[1] - p[1]*K];
  const W = (q) => [(q[0] - O[0]) / K, (O[1] - q[1]) / K];
  function el(tag, a){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls){ const e = el("text", { x, y, class: cls, "text-anchor": "middle", "dominant-baseline": "middle" }); e.textContent = t; return e; }
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const cross = (o, p, q) => (p[0]-o[0])*(q[1]-o[1]) - (p[1]-o[1])*(q[0]-o[0]);
  function inter(P1, P2, P3, P4){ const d = (P1[0]-P2[0])*(P3[1]-P4[1]) - (P1[1]-P2[1])*(P3[0]-P4[0]); if (Math.abs(d) < 1e-9) return null;
    const t = ((P1[0]-P3[0])*(P3[1]-P4[1]) - (P1[1]-P3[1])*(P3[0]-P4[0])) / d; return [P1[0]+t*(P2[0]-P1[0]), P1[1]+t*(P2[1]-P1[1])]; }
  function sr(P, Xp, Q){ const v = [Q[0]-P[0], Q[1]-P[1]], t = ((Xp[0]-P[0])*v[0] + (Xp[1]-P[1])*v[1]) / (v[0]*v[0] + v[1]*v[1]); return t / (1 - t); }
  function pts(st){
    const { A, B, C } = st;
    if (mode === "line") return { D: inter(B, C, st.U, st.V), E: inter(C, A, st.U, st.V), F: inter(A, B, st.U, st.V) };
    return { D: inter(A, st.O, B, C), E: inter(B, st.O, C, A), F: inter(C, st.O, A, B) };
  }
  function ratios(st, p){ if (!p.D || !p.E || !p.F) return null;
    const r = [sr(st.A, p.F, st.B), sr(st.B, p.D, st.C), sr(st.C, p.E, st.A)];
    if (r.some(x => !isFinite(x) || Math.abs(x) > 1e6)) return null; return r; }
  const fmt = (x) => (signed ? x : Math.abs(x)).toFixed(3).replace("-", "−");
  function ext(U, V, Q){ if (sr(U, Q, V) < 0){ const n = dist(Q, U) < dist(Q, V) ? U : V, a = X(n), b = X(Q); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: "extl" }); } }
  function draw(){
    svg.innerHTML = "";
    const { A, B, C } = s, p = pts(s), r = ratios(s, p);
    const pa = X(A), pb = X(B), pc = X(C);
    el("polygon", { points: [pa, pb, pc].map(q => q.join(",")).join(" "), class: "side" });
    if (r){ ext(B, C, p.D); ext(C, A, p.E); ext(A, B, p.F); }
    if (mode === "line"){
      const u = [s.V[0]-s.U[0], s.V[1]-s.U[1]], L = Math.hypot(...u), a = X([s.U[0] - u[0]/L*400, s.U[1] - u[1]/L*400]), b = X([s.U[0] + u[0]/L*400, s.U[1] + u[1]/L*400]);
      el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: "cut" });
      if (perp && r){ [["p", A], ["q", B], ["r", C]].forEach(([t, V]) => { const ux = u[0]/L, uy = u[1]/L, k = (V[0]-s.U[0])*ux + (V[1]-s.U[1])*uy, Ft = [s.U[0] + ux*k, s.U[1] + uy*k];
        const a1 = X(V), b1 = X(Ft); el("line", { x1: a1[0], y1: a1[1], x2: b1[0], y2: b1[1], class: "perp" }); const m = X(lerp(V, Ft, .5)); txt(m[0] + 12, m[1], t, "pl"); }); }
    } else if (r){
      [[A, p.D], [B, p.E], [C, p.F]].forEach(([V, Q]) => { const u = [Q[0]-V[0], Q[1]-V[1]], tt = [0, 1, ((s.O[0]-V[0])*u[0] + (s.O[1]-V[1])*u[1]) / (u[0]*u[0] + u[1]*u[1])];
        const a1 = X(lerp(V, Q, Math.min(...tt))), b1 = X(lerp(V, Q, Math.max(...tt))); el("line", { x1: a1[0], y1: a1[1], x2: b1[0], y2: b1[1], class: "cev" }); });
    }
    if (r){ [p.D, p.E, p.F].forEach(Q => { const q = X(Q); el("circle", { cx: q[0], cy: q[1], r: 3.8, class: "foot" }); });
      const G = [(A[0]+B[0]+C[0])/3, (A[1]+B[1]+C[1])/3];
      [["D", p.D], ["E", p.E], ["F", p.F]].forEach(([t, Q]) => { const v = [Q[0]-G[0], Q[1]-G[1]], L = Math.hypot(...v) || 1, q = X([Q[0] + v[0]/L*5, Q[1] + v[1]/L*5 + 3]); txt(q[0], q[1], t, "lab2"); }); }
    const G = [(A[0]+B[0]+C[0])/3, (A[1]+B[1]+C[1])/3];
    [["A", A], ["B", B], ["C", C]].forEach(([t, V]) => { const v = [V[0]-G[0], V[1]-G[1]], L = Math.hypot(...v) || 1, q = X([V[0] + v[0]/L*6, V[1] + v[1]/L*6]); txt(q[0], q[1], t, "lab"); });
    [["A", pa], ["B", pb], ["C", pc]].forEach(([id, q]) => { el("circle", { cx: q[0], cy: q[1], r: 18, class: "hit", "data-h": id }); el("circle", { cx: q[0], cy: q[1], r: 8, class: "drag", "data-h": id }); });
    if (mode === "line") [["U", s.U], ["V", s.V]].forEach(([id, P0]) => { const q = X(P0); el("circle", { cx: q[0], cy: q[1], r: 18, class: "hit", "data-h": id }); el("circle", { cx: q[0], cy: q[1], r: 7, class: "drag2", "data-h": id }); });
    else { const q = X(s.O); el("circle", { cx: q[0], cy: q[1], r: 18, class: "hit", "data-h": "O" }); el("circle", { cx: q[0], cy: q[1], r: 8, class: "drag3", "data-h": "O" }); txt(q[0] + 14, q[1] - 12, "O", "lab"); }
    if (r){ $("r1").textContent = fmt(r[0]); $("r2").textContent = fmt(r[1]); $("r3").textContent = fmt(r[2]);
      $("nIn").textContent = r.filter(x => x > 0).length + " 個"; $("prod").textContent = fmt(r[0]*r[1]*r[2]); }
    else { ["r1", "r2", "r3", "prod"].forEach(id => $(id).textContent = "—"); $("nIn").textContent = "有一條和邊平行"; }
    $("note").hidden = !(signed || perp);
    $("note").innerHTML = signed ? "點在線段上，比取正；在延長線上，取負。" : "";
    if (perp && mode === "line" && r){ const u = [s.V[0]-s.U[0], s.V[1]-s.U[1]], L = Math.hypot(...u), h = (V) => Math.abs(cross(s.U, s.V, V)) / L;
      $("note").innerHTML += ` <i>p</i> ＝ ${h(A).toFixed(1)}、<i>q</i> ＝ ${h(B).toFixed(1)}、<i>r</i> ＝ ${h(C).toFixed(1)}；<i>p</i>/<i>q</i> ＝ ${(h(A)/h(B)).toFixed(3)}、<i>q</i>/<i>r</i> ＝ ${(h(B)/h(C)).toFixed(3)}、<i>r</i>/<i>p</i> ＝ ${(h(C)/h(A)).toFixed(3)}`; $("note").hidden = false; }
    $("run").textContent = mode === "line" ? "隨機 1000 條直線" : "隨機 1000 個 O";
  }
  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const w = W(svgPt(ev)); const t = { ...s, [drag]: w };
    if (Math.abs(cross(t.A, t.B, t.C)) < 40 || dist(t.U, t.V) < 6) return; s[drag] = w; clearStat(); draw(); });
  const end = () => { drag = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { if (running) return; mode = b.dataset.m;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); clearStat(); draw(); }));
  $("home").addEventListener("click", () => { if (running) return; s = JSON.parse(JSON.stringify(HOME)); clearStat(); draw(); });
  $("sgn").addEventListener("click", () => { signed = !signed; $("sgn").setAttribute("aria-pressed", String(signed)); draw(); });
  $("perp").addEventListener("click", () => { perp = !perp; $("perp").setAttribute("aria-pressed", String(perp)); draw(); });
  $("run").addEventListener("click", () => {
    if (running) return; clearStat(); running = true; $("run").disabled = true;
    const keep = JSON.parse(JSON.stringify(s)), N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 25;
    let done = 0, lo = Infinity, hi = -Infinity; const counts = new Set();
    const rnd = () => [-30 + Math.random()*120, -40 + Math.random()*110];
    function tick(){
      for (let i = 0; i < step && done < N; i++){
        const t = { ...s }; if (mode === "line"){ t.U = rnd(); t.V = rnd(); if (dist(t.U, t.V) < 6) continue; } else t.O = rnd();
        const p = pts(t), r = ratios(t, p); if (!r) continue; done++;
        const pr = signed ? r[0]*r[1]*r[2] : Math.abs(r[0]*r[1]*r[2]); lo = Math.min(lo, pr); hi = Math.max(hi, pr); counts.add(r.filter(x => x > 0).length); s = t;
      }
      draw(); $("stat").innerHTML = `試了 <b>${done}</b> 次`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false; s = keep; draw();
        const f = (x) => x.toFixed(6).replace("-", "−");
        $("stat").innerHTML = `${done} 次，乘積最小 <b>${f(lo)}</b>、最大 <b>${f(hi)}</b>；落在邊上的點有 <b>${[...counts].sort().join("、")}</b> 個這幾種`;
        $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  svg.addEventListener("keydown", (ev) => { const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[ev.key]; if (!mv) return;
    ev.preventDefault(); s.U = [s.U[0] + mv[0], s.U[1] + mv[1]]; s.V = [s.V[0] + mv[0], s.V[1] + mv[1]]; draw(); });
  draw();
})();
</script>
