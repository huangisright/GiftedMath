<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元四　第 3 節</div>
    <h1>三組對邊，交在一條線上</h1>
    <p class="lede"><i>AA</i>′、<i>BB</i>′、<i>CC</i>′ 交在 <i>O</i>。把對應的邊延長，交出 <i>P</i>、<i>Q</i>、<i>R</i>。</p>
  </header>

  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 380" role="img" aria-label="兩個三角形、一個點與三個交點" tabindex="0"></svg>
      <p class="hint">拖橘色的 <i>O</i>、藍色的 <i>A</i>、<i>B</i>、<i>C</i>；灰色的 <i>A</i>′、<i>B</i>′、<i>C</i>′ 只能沿著射線拖。預設和學習單第 1 頁一樣。</p>
    </div>

    <div class="panel">
      <div class="rows">
        <div class="row"><span class="sw" style="background:var(--orange)"></span><span><i>P</i>＝<i>BC</i> 與 <i>B</i>′<i>C</i>′ 的交點</span><span class="val" id="vP" style="font-size:18px"></span></div>
        <div class="row"><span class="sw" style="background:var(--orange)"></span><span><i>Q</i>＝<i>CA</i> 與 <i>C</i>′<i>A</i>′ 的交點</span><span class="val" id="vQ" style="font-size:18px"></span></div>
        <div class="row"><span class="sw" style="background:var(--orange)"></span><span><i>R</i>＝<i>AB</i> 與 <i>A</i>′<i>B</i>′ 的交點</span><span class="val" id="vR" style="font-size:18px"></span></div>
      </div>
      <div class="sum"><span class="k"><i>R</i> 離直線 <i>PQ</i>（mm）</span><span class="v" id="vD" style="font-size:clamp(30px,5vw,44px)"></span></div>
      <div class="controls">
        <div class="btns">
          <button type="button" class="btn primary" id="run">隨機 1000 組</button>
          <button type="button" class="btn" id="par">讓 <i>A</i>′<i>B</i>′ ∥ <i>AB</i></button>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const HOME = { O: [0, 0], A: [20.5, -1.4], B: [40, 14], C: [21.8, 25.8], l: [3.12, 1.985, 1.61] };
  const MID = { O: [10, 10], A: [36.25, 11.25], B: [26.75, 0.75], C: [21.25, 16.75], l: [-1.08, -0.526, -2.407] };
  let s = JSON.parse(JSON.stringify(HOME)), hl = 0, running = false, drag = null;
  const K = 2.9, O0 = [140, 285];
  const X = (p) => [O0[0] + p[0]*K, O0[1] - p[1]*K];
  const W = (q) => [(q[0] - O0[0]) / K, (O0[1] - q[1]) / K];
  function el(tag, a){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls){ const e = el("text", { x, y, class: cls, "text-anchor": "middle", "dominant-baseline": "middle" }); e.textContent = t; return e; }
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const lerp = (p, q, t) => [p[0] + (q[0]-p[0])*t, p[1] + (q[1]-p[1])*t];
  const cross = (o, p, q) => (p[0]-o[0])*(q[1]-o[1]) - (p[1]-o[1])*(q[0]-o[0]);
  function inter(P1, P2, P3, P4){ const d = (P1[0]-P2[0])*(P3[1]-P4[1]) - (P1[1]-P2[1])*(P3[0]-P4[0]);
    const scale = dist(P1, P2) * dist(P3, P4); if (Math.abs(d) < 1e-6 * scale) return null;
    const t = ((P1[0]-P3[0])*(P3[1]-P4[1]) - (P1[1]-P3[1])*(P3[0]-P4[0])) / d; const r = [P1[0]+t*(P2[0]-P1[0]), P1[1]+t*(P2[1]-P1[1])];
    return Math.hypot(...r) > 1e5 ? null : r; }
  function sr(P, Xp, Q){ const v = [Q[0]-P[0], Q[1]-P[1]], t = ((Xp[0]-P[0])*v[0] + (Xp[1]-P[1])*v[1]) / (v[0]*v[0] + v[1]*v[1]); return t / (1 - t); }
  function geo(st){
    const { O, A, B, C } = st, [A2, B2, C2] = [A, B, C].map((p, i) => lerp(O, p, st.l[i]));
    return { O, A, B, C, A2, B2, C2, P: inter(B, C, B2, C2), Q: inter(C, A, C2, A2), R: inter(A, B, A2, B2) };
  }
  function devi(g){ const ps = [g.P, g.Q, g.R].filter(Boolean); if (ps.length < 3) return null;
    // 最遠兩點連線，第三點到它的距離
    const pr = [[0,1,2],[1,2,0],[0,2,1]].map(([i,j,k]) => [dist(ps[i], ps[j]), i, j, k]).sort((a, b) => b[0] - a[0])[0];
    return Math.abs(cross(ps[pr[1]], ps[pr[2]], ps[pr[3]])) / pr[0]; }
  const fmtD = (g) => g === null ? "—" : (g < 1e-6 ? "＜ 0.000001" : g.toFixed(6));
  function seg(p, q, cls){ const a = X(p), b = X(q); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: cls }); }
  function draw(){
    svg.innerHTML = "";
    const g = geo(s);
    // 射線（從 O 到較遠的那一點，再多一點）
    [[g.A, g.A2], [g.B, g.B2], [g.C, g.C2]].forEach(([p, q]) => { const far = dist(g.O, p) > dist(g.O, q) ? p : q, near = far === p ? q : p;
      const sameSide = (p[0]-g.O[0])*(q[0]-g.O[0]) + (p[1]-g.O[1])*(q[1]-g.O[1]) > 0;
      const u = [far[0]-g.O[0], far[1]-g.O[1]], L = Math.hypot(...u), e1 = [far[0] + u[0]/L*6, far[1] + u[1]/L*6];
      if (sameSide) seg(g.O, e1, "ray"); else { const v = [near[0]-g.O[0], near[1]-g.O[1]], M = Math.hypot(...v); seg([near[0] + v[0]/M*6, near[1] + v[1]/M*6], e1, "ray"); } });
    // 對邊延長
    [[g.B, g.C, g.P], [g.B2, g.C2, g.P], [g.C, g.A, g.Q], [g.C2, g.A2, g.Q], [g.A, g.B, g.R], [g.A2, g.B2, g.R]].forEach(([u, v, x]) => { if (!x) return; if (sr(u, x, v) < 0) seg(dist(x, u) < dist(x, v) ? u : v, x, "extl"); });
    const ps = [g.P, g.Q, g.R].filter(Boolean);
    if (ps.length >= 2){ const pr = ps.length === 3 ? [[0,1],[1,2],[0,2]].map(([i,j]) => [dist(ps[i], ps[j]), i, j]).sort((a, b) => b[0] - a[0])[0] : [0, 0, 1];
      const a = ps[pr[1]], b = ps[pr[2]], u = [b[0]-a[0], b[1]-a[1]], L = Math.hypot(...u); seg([a[0] - u[0]/L*8, a[1] - u[1]/L*8], [b[0] + u[0]/L*8, b[1] + u[1]/L*8], "axis"); }
    else if (ps.length === 1 && g.R === null){ /* 平行：畫過 P 平行 AB 的線 */ const a = ps[0], u = [g.B[0]-g.A[0], g.B[1]-g.A[1]], L = Math.hypot(...u); seg([a[0] - u[0]/L*200, a[1] - u[1]/L*200], [a[0] + u[0]/L*200, a[1] + u[1]/L*200], "axis"); }
    if (hl){ const T = [[g.O, g.B, g.C, g.B2, g.C2], [g.O, g.C, g.A, g.C2, g.A2], [g.O, g.A, g.B, g.A2, g.B2]][hl - 1];
      el("polygon", { points: [T[0], T[1], T[2]].map(p => X(p).join(",")).join(" "), class: "hl" });
      const x = [g.P, g.Q, g.R][hl - 1]; if (x){ const ends = [T[3], T[4], x].sort((p, q) => p[0] - q[0] || p[1] - q[1]); seg(ends[0], ends[2], "hl2"); } }
    el("polygon", { points: [g.A, g.B, g.C].map(p => X(p).join(",")).join(" "), class: "t1" });
    el("polygon", { points: [g.A2, g.B2, g.C2].map(p => X(p).join(",")).join(" "), class: "t2" });
    [["P", g.P], ["Q", g.Q], ["R", g.R]].forEach(([t, x]) => { if (!x) return; const q = X(x); el("circle", { cx: q[0], cy: q[1], r: 5, class: "pq" }); txt(q[0], q[1] - 16, t, "labp"); });
    const G1 = [(g.A[0]+g.B[0]+g.C[0])/3, (g.A[1]+g.B[1]+g.C[1])/3], G2 = [(g.A2[0]+g.B2[0]+g.C2[0])/3, (g.A2[1]+g.B2[1]+g.C2[1])/3];
    const labAt = (p, G, t, cls) => { const v = [p[0]-G[0], p[1]-G[1]], L = Math.hypot(...v) || 1, q = X([p[0] + v[0]/L*5.5, p[1] + v[1]/L*5.5]); txt(q[0], q[1], t, cls); };
    labAt(g.A, G1, "A", "lab1"); labAt(g.B, G1, "B", "lab1"); labAt(g.C, G1, "C", "lab1");
    labAt(g.A2, G2, "A′", "lab"); labAt(g.B2, G2, "B′", "lab"); labAt(g.C2, G2, "C′", "lab");
    const handle = (p, id, cls) => { const q = X(p); el("circle", { cx: q[0], cy: q[1], r: 18, class: "hit", "data-h": id }); el("circle", { cx: q[0], cy: q[1], r: 7, class: cls, "data-h": id }); };
    handle(g.A2, "A2", "drag2"); handle(g.B2, "B2", "drag2"); handle(g.C2, "C2", "drag2");
    handle(g.A, "A", "drag1"); handle(g.B, "B", "drag1"); handle(g.C, "C", "drag1"); handle(g.O, "O", "drag");
    const qo = X(g.O); txt(qo[0] - 14, qo[1] + 14, "O", "lab");
    const fp = (x) => x ? "有" : "平行，沒有交點";
    $("vP").textContent = fp(g.P); $("vQ").textContent = fp(g.Q); $("vR").textContent = fp(g.R);
    const dv = devi(g);
    if (dv === null && !g.R && g.P && g.Q){ const u = [g.Q[0]-g.P[0], g.Q[1]-g.P[1]], v = [g.B[0]-g.A[0], g.B[1]-g.A[1]];
      const ang = Math.abs(Math.atan2(u[0]*v[1] - u[1]*v[0], u[0]*v[0] + u[1]*v[1])) * 180 / Math.PI;
      $("vD").textContent = (Math.min(ang, 180 - ang) < 1e-6 ? "PQ ∥ AB" : Math.min(ang, 180 - ang).toFixed(3) + "°"); }
    else $("vD").textContent = fmtD(dv);
    if (hl){ const names = ["△OBC 與直線 B′C′（經過 P）", "△OCA 與直線 C′A′（經過 Q）", "△OAB 與直線 A′B′（經過 R）"];
      const T = [[g.B, g.P, g.C, g.C2, g.O, g.B2], [g.C, g.Q, g.A, g.A2, g.O, g.C2], [g.A, g.R, g.B, g.B2, g.O, g.A2]][hl - 1];
      let pr = null; if (T[1]){ pr = sr(T[0], T[1], T[2]) * sr(T[2], T[3], T[4]) * sr(T[4], T[5], T[0]); }
      $("note").innerHTML = names[hl - 1] + (pr === null ? "" : `：繞一圈三個有號的比相乘 ＝ ${pr.toFixed(3).replace("-", "−")}`); $("note").hidden = false; }
    else $("note").hidden = true;
  }
  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const w = W(svgPt(ev));
    if (drag.endsWith("2")){ const i = "ABC".indexOf(drag[0]), V = s[drag[0]], u = [V[0]-s.O[0], V[1]-s.O[1]];
      let t = ((w[0]-s.O[0])*u[0] + (w[1]-s.O[1])*u[1]) / (u[0]*u[0] + u[1]*u[1]); if (Math.abs(t) < 0.15 || Math.abs(t - 1) < 0.08) return; s.l[i] = t; }
    else { const t = JSON.parse(JSON.stringify(s)); t[drag] = w; if (Math.abs(cross(t.A, t.B, t.C)) < 30 || dist(t.O, t.A) < 3 || dist(t.O, t.B) < 3 || dist(t.O, t.C) < 3) return; s[drag] = w; }
    clearStat(); draw(); });
  const end = () => { drag = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }
  $("home").addEventListener("click", () => { if (running) return; s = JSON.parse(JSON.stringify(HOME)); clearStat(); draw(); });
  $("mid").addEventListener("click", () => { if (running) return; s = JSON.parse(JSON.stringify(MID)); clearStat(); draw(); });
  $("par").addEventListener("click", () => { if (running) return;
    // 讓 A'B' ∥ AB：B' 的倍數改成和 A' 一樣
    s.l[1] = s.l[0]; clearStat(); draw(); });
  $("hl").addEventListener("click", () => { hl = (hl + 1) % 4; $("hl").setAttribute("aria-pressed", String(hl > 0)); $("hl").textContent = hl ? `描出一個三角形（${hl}/3）` : "描出一個三角形"; draw(); });
  $("run").addEventListener("click", () => {
    if (running) return; clearStat(); running = true; $("run").disabled = true;
    const keep = JSON.parse(JSON.stringify(s)), N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 20;
    let done = 0, worst = 0;
    const rnd = () => [-20 + Math.random()*80, -10 + Math.random()*50];
    function tick(){
      for (let i = 0; i < step && done < N; i++){
        const t = { O: rnd(), A: rnd(), B: rnd(), C: rnd(), l: [0, 0, 0].map(() => (Math.random() < .5 ? -1 : 1) * (0.4 + Math.random()*2.6)) };
        if (Math.abs(cross(t.A, t.B, t.C)) < 150) continue; const g = geo(t), dv = devi(g); if (dv === null) continue;
        const scale = Math.max(dist(g.P, g.Q), dist(g.Q, g.R), dist(g.R, g.P)); done++; worst = Math.max(worst, dv / Math.max(1, scale) * 100); s = t;
      }
      draw(); $("stat").innerHTML = `試了 <b>${done}</b> 組`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false; s = keep; draw();
        $("stat").innerHTML = `${done} 組，第三點離另外兩點連線最遠 <b>${worst < 1e-6 ? "＜ 0.000001" : worst.toExponential(1)}</b>（以三點最遠距離為 100 換算）`;
        $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  svg.addEventListener("keydown", (ev) => { const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[ev.key]; if (!mv) return;
    ev.preventDefault(); s.O = [s.O[0] + mv[0], s.O[1] + mv[1]]; draw(); });
  draw();
})();
</script>
