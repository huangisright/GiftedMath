<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元五　第 2 節</div>
    <h1>九個點，一個圓</h1>
    <p class="lede">灰色的圓穿過三邊的中點。一組一組按，看看還有誰也在這個圓上。<i>H</i> 是垂心。</p>
  </header>

  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 400" role="img" aria-label="可拖動頂點的三角形與穿過三邊中點的圓" tabindex="0"></svg>
      <p class="hint">拖動橘色的頂點 <i>A</i>、<i>B</i>、<i>C</i>。單位 mm；預設和學習單第 1 頁一樣。</p>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const HOME = { A: [26 - 41, 54 - 20], B: [-41, -20], C: [41, -20] };
  let s = JSON.parse(JSON.stringify(HOME)), grp = [true, false, false], showC = false, showP = false, showA = false, running = false, drag = null;
  const K = 3.4, O0 = [220, 220];
  const X = (p) => [O0[0] + p[0]*K, O0[1] - p[1]*K];
  const W = (q) => [(q[0] - O0[0]) / K, (O0[1] - q[1]) / K];
  function el(tag, a){ const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
  function txt(x, y, t, cls, fill){ const e = el("text", { x, y, class: cls, "text-anchor": "middle", "dominant-baseline": "middle" }); if (fill) e.style.fill = fill; e.textContent = t; return e; }
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const lerp = (p, q, t) => [p[0] + (q[0]-p[0])*t, p[1] + (q[1]-p[1])*t];
  const cross = (o, p, q) => (p[0]-o[0])*(q[1]-o[1]) - (p[1]-o[1])*(q[0]-o[0]);
  function foot(P, U, V){ const ux = V[0]-U[0], uy = V[1]-U[1], t = ((P[0]-U[0])*ux + (P[1]-U[1])*uy) / (ux*ux + uy*uy); return [U[0]+t*ux, U[1]+t*uy]; }
  function circ(A, B, C){ const D = 2*(A[0]*(B[1]-C[1]) + B[0]*(C[1]-A[1]) + C[0]*(A[1]-B[1]));
    const a2 = A[0]*A[0]+A[1]*A[1], b2 = B[0]*B[0]+B[1]*B[1], c2 = C[0]*C[0]+C[1]*C[1];
    return [(a2*(B[1]-C[1]) + b2*(C[1]-A[1]) + c2*(A[1]-B[1]))/D, (a2*(C[0]-B[0]) + b2*(A[0]-C[0]) + c2*(B[0]-A[0]))/D]; }
  function ortho(A, B, C){ const F1 = foot(A, B, C), F2 = foot(B, C, A);
    const d = (A[0]-F1[0])*(B[1]-F2[1]) - (A[1]-F1[1])*(B[0]-F2[0]);
    const t = ((A[0]-B[0])*(B[1]-F2[1]) - (A[1]-B[1])*(B[0]-F2[0])) / d; return [A[0] + t*(F1[0]-A[0]), A[1] + t*(F1[1]-A[1])]; }
  function measure(A, B, C){
    const M = [lerp(B, C, .5), lerp(C, A, .5), lerp(A, B, .5)], Nc = circ(...M), r = dist(Nc, M[0]);
    const H = ortho(A, B, C), Fe = [foot(A, B, C), foot(B, C, A), foot(C, A, B)], T = [lerp(A, H, .5), lerp(B, H, .5), lerp(C, H, .5)];
    const off = Math.max(...[...Fe, ...T].map(p => Math.abs(dist(Nc, p) - r)));
    const sg = Math.sign(cross(A, B, C)), inside = [cross(A, B, H), cross(B, C, H), cross(C, A, H)].every(v => v * sg > -1e-9);
    return { M, Fe, T, Nc, r, H, off, inside };
  }
  const fmt = (g) => g < 1e-6 ? "＜ 0.000001" : (g < 0.01 ? g.toExponential(1) : g.toFixed(2));
  function line(P, Q, cls){ const a = X(P), b = X(Q); el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: cls }); }
  function dot(P, c, r){ const q = X(P); el("circle", { cx: q[0], cy: q[1], r: r || 4.2, fill: c }); }

  function draw(){
    svg.innerHTML = "";
    const { A, B, C } = s, m = measure(A, B, C), O = circ(A, B, C), R = dist(O, A);
    if (showC){ const q = X(O); el("circle", { cx: q[0], cy: q[1], r: R*K, class: "circ" }); }
    el("polygon", { points: [A, B, C].map(p => X(p).join(",")).join(" "), class: "side" });
    if (grp[1] || grp[2]){ [[A, m.Fe[0]], [B, m.Fe[1]], [C, m.Fe[2]]].forEach(([V, F]) => { line(V, F, "alt"); line(F, m.H, "alt"); }); }
    if (showP){ [A, B, C].forEach(V => line(m.H, V, "pull")); }
    if (showA){ const Ap = [2*O[0]-A[0], 2*O[1]-A[1]]; line(A, Ap, "alt"); line(m.H, Ap, "pull"); dot(Ap, "var(--indigo)", 4); const q = X(Ap); txt(q[0] + 14, q[1] + 8, "A′", "lab2", "var(--indigo)"); }
    const q = X(m.Nc); el("circle", { cx: q[0], cy: q[1], r: m.r*K, class: "nine" + (showP ? " hot" : "") });
    if (showC || showP){ dot(O, "var(--ink-2)", 3.5); const o = X(O); txt(o[0] + 12, o[1] - 10, "O", "lab2", "var(--ink-2)"); }
    if (grp[0]) m.M.forEach(p => dot(p, "var(--ink)"));
    if (grp[1]) m.Fe.forEach(p => dot(p, "var(--indigo)"));
    if (grp[2]) m.T.forEach(p => dot(p, "var(--orange)"));
    dot(m.H, "var(--crimson)", 4.5); { const h = X(m.H); txt(h[0] + 13, h[1] - 10, "H", "lab2", "var(--crimson)"); }
    const Gc = [(A[0]+B[0]+C[0])/3, (A[1]+B[1]+C[1])/3];
    [["A", A], ["B", B], ["C", C]].forEach(([t, V]) => { const v = [V[0]-Gc[0], V[1]-Gc[1]], L = Math.hypot(...v) || 1, p = X([V[0] + v[0]/L*6, V[1] + v[1]/L*6]); txt(p[0], p[1], t, "lab"); });
    [["A", A], ["B", B], ["C", C]].forEach(([id, V]) => { const p = X(V); el("circle", { cx: p[0], cy: p[1], r: 18, class: "hit", "data-h": id }); el("circle", { cx: p[0], cy: p[1], r: 8, class: "drag", "data-h": id }); });
    $("vD").textContent = fmt(m.off); $("vIn").textContent = m.inside ? "裡面" : "外面";
    $("vN").textContent = (grp[0] ? 3 : 0) + (grp[1] ? 3 : 0) + (grp[2] ? 3 : 0) + " 個";
  }
  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const q = pt.matrixTransform(svg.getScreenCTM().inverse()); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const w = W(svgPt(ev)); const t = { ...s, [drag]: w };
    if (Math.abs(cross(t.A, t.B, t.C)) < 80) return; s[drag] = w; clearStat(); draw(); });
  const end = () => { drag = null; }; svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
  function clearStat(){ $("stat").textContent = ""; $("ask").hidden = true; }
  document.querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", () => { const i = +b.dataset.g; grp[i] = !grp[i]; b.setAttribute("aria-pressed", String(grp[i])); draw(); }));
  function tog(id, f){ $(id).addEventListener("click", () => { const v = f(); $(id).setAttribute("aria-pressed", String(v)); draw(); }); }
  tog("cc", () => (showC = !showC)); tog("pull", () => (showP = !showP)); tog("anti", () => (showA = !showA));
  $("home").addEventListener("click", () => { if (running) return; s = JSON.parse(JSON.stringify(HOME)); clearStat(); draw(); });
  $("run").addEventListener("click", () => {
    if (running) return; clearStat(); running = true; $("run").disabled = true;
    const keep = JSON.parse(JSON.stringify(s)), N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, step = reduce ? N : 25;
    let done = 0, worst = 0, out = 0;
    const rnd = () => [-45 + Math.random()*90, -30 + Math.random()*72];
    function tick(){
      for (let i = 0; i < step && done < N; i++){
        let T; do { T = { A: rnd(), B: rnd(), C: rnd() }; } while (Math.abs(cross(T.A, T.B, T.C)) < 500);
        const m = measure(T.A, T.B, T.C); done++; worst = Math.max(worst, m.off); if (!m.inside) out++; s = T;
      }
      draw(); $("stat").innerHTML = `換了 <b>${done}</b> 個三角形`;
      if (done < N) requestAnimationFrame(tick);
      else { running = false; $("run").disabled = false; s = keep; draw();
        $("stat").innerHTML = `${done} 個三角形：九個點離圓最遠 <b>${fmt(worst)}</b> mm；<i>H</i> 在三角形外面 <b>${out}</b> 次`;
        $("ask").hidden = false; }
    }
    requestAnimationFrame(tick);
  });
  svg.addEventListener("keydown", (ev) => { const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[ev.key]; if (!mv) return;
    ev.preventDefault(); s.A = [s.A[0] + mv[0], s.A[1] + mv[1]]; draw(); });
  draw();
})();
</script>
