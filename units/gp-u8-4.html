  <header>
    <div class="eyebrow">幾何明珠　單元八　第 4 節</div>
    <h1>翻譯過來的句子</h1>
    <p class="lede">六條直線都和圓相切，圍成六邊形 <i>ABCDEF</i>。三組對頂點的連線，會怎樣？</p>
  </header>
  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 440" role="img" aria-label="圓外切六邊形與三條對角線" tabindex="0"></svg>
      <p class="hint" id="hint">橘色的切點可以沿著圓拖；兩個切點拖到一起，兩條邊就合成一條。</p>
    </div>
    <div class="panel">
      <div class="rows" style="margin-top:0">
        <div class="row"><span class="sw" style="background:var(--indigo)"></span><span><i>CF</i> 離 <i>AD</i>、<i>BE</i> 的交點</span><span class="val" id="vd">—</span></div>
      </div>
      <div class="controls">
        <div class="btns">
          <button type="button" class="btn" id="dg" aria-pressed="false">顯示三條線</button>
          <button type="button" class="btn" id="home">回到學習單的圖</button>
        </div>
        <div class="btns"><button type="button" class="btn primary" id="run">隨機換 1000 組</button></div>
        <div class="stat" id="stat" aria-live="polite"></div>
        <p class="q" id="ask" hidden>電腦確認了一千組。你還需要什麼？</p>
        <details id="more">
          <summary>更多</summary>
          <div class="btns">
            <button type="button" class="btn" id="cc" aria-pressed="false">造三個圓</button>
            <button type="button" class="btn" id="pp" aria-pressed="false">每一點對應一條線</button>
          </div>
        </details>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  const NS="http://www.w3.org/2000/svg", $=(id)=>document.getElementById(id), svg=$("stage");
  const R=60;
  const HOME=()=>({ang:[20,75,130,190,245,300], Q:[95,40]});
  let s=HOME(), showD=false, showC=false, showP=false, drag=null, running=false, fitK=1, fitC=[0,0];
  const rad=a=>a*Math.PI/180;
  function inter(p1,p2,p3,p4){const d=(p1[0]-p2[0])*(p3[1]-p4[1])-(p1[1]-p2[1])*(p3[0]-p4[0]); if(Math.abs(d)<1e-12)return null;
    const t=((p1[0]-p3[0])*(p3[1]-p4[1])-(p1[1]-p3[1])*(p3[0]-p4[0]))/d; return [p1[0]+t*(p2[0]-p1[0]),p1[1]+t*(p2[1]-p1[1])];}
  const tp=a=>[R*Math.cos(rad(a)),R*Math.sin(rad(a))], tdir=a=>[-Math.sin(rad(a)),Math.cos(rad(a))];
  function verts(ang){ return ang.map((a,i)=>{const b=ang[(i+5)%6]; const p=tp(b),q=tp(a);
      if(Math.abs(((a-b)%360+360)%360)<1e-6) return p; return inter(p,[p[0]+tdir(b)[0],p[1]+tdir(b)[1]],q,[q[0]+tdir(a)[0],q[1]+tdir(a)[1]]);}); }
  // 頂點 i 在切線 i-1 與 i 之間 → 把它叫 A..F 時，邊 AB 在切線 0 上
  const dev=(P,Q,R_)=>{const d=[Q[0]-P[0],Q[1]-P[1]]; return Math.abs(d[0]*(R_[1]-P[1])-d[1]*(R_[0]-P[0]))/Math.hypot(...d);};
  function center(V){ return inter(V[0],V[3],V[1],V[4]); }
  function el(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
  const T=p=>[220+(p[0]-fitC[0])*fitK, 220-(p[1]-fitC[1])*fitK], Ti=q=>[(q[0]-220)/fitK+fitC[0],(220-q[1])/fitK+fitC[1]];
  const ln=(a,b,cls)=>el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:cls});
  function txt(q,t,dx,dy,fill){const e=el("text",{x:q[0]+dx,y:q[1]+dy,class:"lab","text-anchor":"middle","dominant-baseline":"middle"});if(fill)e.style.fill=fill;e.textContent=t;}
  function mkfit(pts){let x0=-R-15,y0=-R-15,x1=R+15,y1=R+15; pts.forEach(p=>{if(!p)return; const q=[Math.max(-400,Math.min(400,p[0])),Math.max(-400,Math.min(400,p[1]))]; x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);});
    fitK=Math.min(390/(x1-x0),390/(y1-y0)); fitC=[(x0+x1)/2,(y0+y1)/2];}
  function circles(ang,V){ // 書證法 1：每個切點往 B、D、F 方向量 k
    const k=R*0.7, t=[0,1,2,3,4,5].map(i=>tp(ang[i])); // t[i] 在邊 V[i]V[i+1] 上
    const toward=(i,j)=>{const a=t[i],b=V[j],L=Math.hypot(b[0]-a[0],b[1]-a[1])||1; return [a[0]+(b[0]-a[0])/L*k,a[1]+(b[1]-a[1])/L*k];};
    // 邊 AB=V0V1 上 t0，往 B=V1；BC=V1V2 上 t1 往 B=V1；CD 上 t2 往 D=V3；DE 上 t3 往 D=V3；EF 上 t4 往 F=V5；FA 上 t5 往 F=V5
    const tt=[toward(0,1),toward(1,1),toward(2,3),toward(3,3),toward(4,5),toward(5,5)];
    const circ=(i,j)=>{const ni=tp(ang[i]),nj=tp(ang[j]); const c=inter(tt[i],[tt[i][0]+ni[0],tt[i][1]+ni[1]],tt[j],[tt[j][0]+nj[0],tt[j][1]+nj[1]]); return c?[c,Math.hypot(c[0]-tt[i][0],c[1]-tt[i][1])]:null;};
    return [circ(1,4),circ(0,3),circ(2,5)];
  }
  function draw(keep){
    svg.innerHTML=""; const V=verts(s.ang), O=center(V);
    const C3=showC?circles(s.ang,V):[];
    if(!keep) mkfit(V.concat(showC?C3.flatMap(c=>c?[[c[0][0]-c[1],c[0][1]-c[1]],[c[0][0]+c[1],c[0][1]+c[1]]]:[]):[]));
    const c0=T([0,0]); el("circle",{cx:c0[0],cy:c0[1],r:R*fitK,class:"cir"});
    s.ang.forEach(a=>{const p=tp(a),d=tdir(a); ln(T([p[0]-d[0]*500,p[1]-d[1]*500]),T([p[0]+d[0]*500,p[1]+d[1]*500]),"tg");});
    el("polygon",{points:V.map(p=>T(p).join(",")).join(" "),class:"hx"});
    if(showC) C3.forEach((c,i)=>{ if(!c) return; const q=T(c[0]); el("circle",{cx:q[0],cy:q[1],r:c[1]*fitK,class:"c"+(i+1)}); });
    if(showD||showC){ for(let i=0;i<3;i++){const a=V[i],b=V[i+3],d=[b[0]-a[0],b[1]-a[1]]; ln(T([a[0]-d[0]*0.15,a[1]-d[1]*0.15]),T([b[0]+d[0]*0.15,b[1]+d[1]*0.15]),"dg");}
      if(O){const q=T(O); el("circle",{cx:q[0],cy:q[1],r:5,fill:"var(--indigo)"});} }
    if(showP){ const Q=s.Q, d2=Q[0]*Q[0]+Q[1]*Q[1]; // 極線：x·Qx + y·Qy = R²
      const foot=[Q[0]*R*R/d2,Q[1]*R*R/d2], dir=[-Q[1],Q[0]], L=Math.hypot(...dir);
      ln(T([foot[0]-dir[0]/L*400,foot[1]-dir[1]/L*400]),T([foot[0]+dir[0]/L*400,foot[1]+dir[1]/L*400]),"pol");
      const q=T(Q); el("circle",{cx:q[0],cy:q[1],r:6,fill:"#c0392b"}); txt(q,"點",0,-16,"#c0392b");
      el("circle",{cx:q[0],cy:q[1],r:16,class:"hit","data-h":"Q"}); }
    $("hint").textContent=showP?"拖紅點：圓讓每一個點對應一條紅線。點拖到圓上時，紅線就是那一點的切線。":"橘色的切點可以沿著圓拖；兩個切點拖到一起，兩條邊就合成一條。";
    V.forEach((p,i)=>{const q=T(p),v=[q[0]-c0[0],q[1]-c0[1]],L=Math.hypot(...v)||1; txt(q,"ABCDEF"[i],v[0]/L*16,v[1]/L*16);});
    s.ang.forEach((a,i)=>{const q=T(tp(a)); el("circle",{cx:q[0],cy:q[1],r:16,class:"hit","data-h":i}); el("circle",{cx:q[0],cy:q[1],r:6,class:"drag","data-h":i});});
    $("vd").textContent=O?(dev(V[2],V[5],O)<1e-9?"0":dev(V[2],V[5],O).toExponential(1)):"—";
  }
  function svgPt(ev){const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());return [q.x,q.y];}
  svg.addEventListener("pointerdown",ev=>{const h=ev.target.getAttribute&&ev.target.getAttribute("data-h"); if(h===null||running)return; drag=h; svg.setPointerCapture(ev.pointerId); ev.preventDefault();});
  svg.addEventListener("pointermove",ev=>{ if(drag===null)return; const w=Ti(svgPt(ev));
    if(drag==="Q"){ s.Q=w; draw(true); return; }
    const i=+drag; let a=Math.atan2(w[1],w[0])*180/Math.PI; a=(a+360)%360;
    // 不准越過相鄰的切點（保持順序），靠近 3° 以內就吸附合併
    const prev=s.ang[(i+5)%6], next=s.ang[(i+1)%6], gap=x=>((x%360)+360)%360;
    if(gap(a-prev)>gap(next-prev)) return; if(gap(a-prev)<3) a=prev; if(gap(next-a)<3) a=next;
    if(gap(next-prev)>=360-1e-9){} s.ang[i]=Math.round(a*2)/2; clearStat(); draw(true); });
  const end=()=>{if(drag!==null){drag=null;draw();}}; svg.addEventListener("pointerup",end); svg.addEventListener("pointercancel",end);
  function clearStat(){$("stat").textContent="";$("ask").hidden=true;}
  function tog(id,f){$(id).addEventListener("click",()=>{const v=f();$(id).setAttribute("aria-pressed",String(v));clearStat();draw();});}
  tog("dg",()=>showD=!showD); tog("cc",()=>showC=!showC); tog("pp",()=>showP=!showP);
  $("home").addEventListener("click",()=>{if(running)return; s=HOME(); clearStat(); draw();});
  $("run").addEventListener("click",()=>{
    if(running)return; clearStat(); running=true; $("run").disabled=true;
    const keep=JSON.parse(JSON.stringify(s)), M=1000, reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches, step=reduce?M:25;
    let done=0, worst=0;
    function tick(){
      for(let i=0;i<step&&done<M;i++){
        const a=[0,1,2,3,4,5].map(()=>Math.random()*360).sort((x,y)=>x-y);
        let ok=true; for(let j=0;j<6;j++){const g=((a[(j+1)%6]-a[j])%360+360)%360; if(g>170||g<4) ok=false;} if(!ok) continue;
        const V=verts(a), O=center(V); if(!O) continue;
        const sz=Math.max(...V.map(p=>Math.hypot(...p))); worst=Math.max(worst,dev(V[2],V[5],O)/sz); s={ang:a,Q:keep.Q}; done++;
      }
      draw(); $("stat").innerHTML=`換了 <b>${done}</b> 組`;
      if(done<M) requestAnimationFrame(tick);
      else { running=false; $("run").disabled=false; s=keep; draw();
        $("stat").innerHTML=`${done} 組：每一次 <i>CF</i> 離另兩條線的交點都不到 <b>${worst<1e-9?"十億分之一":worst.toExponential(1)}</b>（以六邊形大小為單位）`; $("ask").hidden=false; }
    }
    requestAnimationFrame(tick);
  });
  draw();
})();
</script>
