<div class="wrap">
  <header>
    <div class="eyebrow">幾何明珠　單元二　第 1 節</div>
    <h1>光走的那一條</h1>
    <p class="lede">從 <i>P</i> 出發，先碰一下直線，再走到 <i>Q</i>。碰在哪裡，路最短？</p>
  </header>

  <div class="main">
    <div class="panel stage">
      <svg id="stage" viewBox="0 0 440 340" role="img" aria-label="直線與兩點的最短路徑" tabindex="0"></svg>
      <p class="hint" id="hint">拖動橘色的點。單位 mm；預設和學習單第 1 頁一樣大。</p>
    </div>

    <div class="panel">
      <div class="seg" role="group" aria-label="模式">
        <button type="button" id="m1" aria-pressed="true">一條直線</button>
        <button type="button" id="m2" aria-pressed="false">兩條公路</button>
      </div>

      <div id="read1" class="rows" style="margin-top:12px">
        <div class="row"><span class="sw" style="background:var(--indigo)"></span><span><i>PR</i></span><span class="val" id="vPR"></span></div>
        <div class="row"><span class="sw" style="background:var(--indigo)"></span><span><i>RQ</i></span><span class="val" id="vRQ"></span></div>
        <div class="row"><span class="sw" style="background:var(--crimson)"></span><span>∠1　／　∠2</span><span class="val" id="vAng" style="min-width:8ch"></span></div>
        <div class="sum"><span class="k"><i>PR</i> ＋ <i>RQ</i></span><span class="v" id="vSum"></span></div>
      </div>

      <div id="read2" class="rows" style="margin-top:12px" hidden>
        <label class="sl"><span>夾角</span><input type="range" id="th" min="20" max="150" step="1" value="50"><span class="num" id="vth">50°</span></label>
        <div class="row"><span class="sw" style="background:var(--ink-3)"></span><span>郵筒到路口 <i>O</i>（<i>a</i>／<i>b</i>）</span><span class="val" id="vMN" style="min-width:8ch;font-size:22px"></span></div>
        <div class="sum"><span class="k">郵差走的路</span><span class="v" id="vPer"></span></div>
      </div>

      <div class="controls">
        <div class="btns">
          <button type="button" class="btn primary" id="run">隨機跑 1000 個位置</button>
          <button type="button" class="btn" id="home">回到學習單的圖</button>
        </div>
        <div class="stat" id="stat" aria-live="polite"></div>
        <p class="q" id="ask" hidden>電腦試了一千次。你還需要什麼？</p>
        <details id="more">
          <summary>更多</summary>
          <div class="btns">
            <button type="button" class="btn" id="other" aria-pressed="false">另一邊的 <i>P</i></button>
          </div>
          <p class="hint" id="otherNote" hidden></p>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg", $ = (id) => document.getElementById(id);
  const svg = $("stage");
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const fmt = (x) => (Math.round(x * 10) / 10).toFixed(1);
  let mode = 1, showOther = false, running = false, drag = null;
  // 模式一（mm）：直線 y＝0
  const S1 = { P: [0, 36], Q: [63, 48], r: 27 };
  const s1 = JSON.parse(JSON.stringify(S1));
  // 模式二：夾角 th（度），P 以極座標，郵筒 tN（公路 a 上）、tM（公路 b 上）
  const S2 = { th: 50, pr: 55, pf: 22, tN: 60, tM: 20 };
  const s2 = JSON.parse(JSON.stringify(S2));
  const L2 = 100;

  function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).appendChild(e); return e; }
  function txt(x, y, t, cls, anchor){ const e = el("text", { x, y, class: cls, "text-anchor": anchor || "middle" }); e.textContent = t; return e; }
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  function angBetween(u, v){ const c = (u[0]*v[0] + u[1]*v[1]) / (Math.hypot(...u) * Math.hypot(...v)); return Math.acos(Math.max(-1, Math.min(1, c))) * R2D; }
  function reflect(P, A, B){ const ux = B[0]-A[0], uy = B[1]-A[1], L = ux*ux + uy*uy; const t = ((P[0]-A[0])*ux + (P[1]-A[1])*uy) / L; const F = [A[0] + t*ux, A[1] + t*uy]; return [2*F[0] - P[0], 2*F[1] - P[1]]; }
  function arcPath(C, r, a0, a1){ // svg 座標，角度為數學方向（度）
    const p = (a) => [C[0] + r*Math.cos(a*D2R), C[1] - r*Math.sin(a*D2R)];
    const A = p(a0), B = p(a1), large = Math.abs(a1 - a0) > 180 ? 1 : 0, sweep = a1 > a0 ? 0 : 1;
    return `M${A[0]},${A[1]} A${r},${r} 0 ${large} ${sweep} ${B[0]},${B[1]}`;
  }

  // ---------- 模式一 ----------
  let K1 = 4, O1 = [90, 300];
  function fit(pts, xlo, xhi){ // 世界座標點集 → 縮放與原點（拖曳中不重算）
    let x0 = Math.min(xlo, ...pts.map(p => p[0])), x1 = Math.max(xhi, ...pts.map(p => p[0]));
    let y0 = Math.min(...pts.map(p => p[1])), y1 = Math.max(...pts.map(p => p[1]));
    const k = Math.min(380 / (x1 - x0 || 1), 270 / (y1 - y0 || 1));
    return { k, o: [30 + (380 - (x1 - x0) * k) / 2 - x0 * k, 30 + (270 - (y1 - y0) * k) / 2 + y1 * k] };
  }
  function frame1(){ if (drag) return; const pts = [s1.P, s1.Q, [s1.r, 0], [-20, 0], [85, 0]];
    if (showOther) pts.push([s1.P[0], -s1.P[1]]); const f = fit(pts, -20, 85); K1 = f.k; O1 = f.o; }
  const X1 = (p) => [O1[0] + p[0]*K1, O1[1] - p[1]*K1];
  const W1 = (q) => [(q[0] - O1[0]) / K1, (O1[1] - q[1]) / K1];
  function vals1(r){ const R = [r, 0]; const a = dist(s1.P, R), b = dist(R, s1.Q);
    const a1 = angBetween([s1.P[0]-r, s1.P[1]], [-1, 0]), a2 = angBetween([s1.Q[0]-r, s1.Q[1]], [1, 0]); return { a, b, sum: a + b, a1, a2 }; }
  function draw1(){
    frame1(); svg.innerHTML = "";
    const R = [s1.r, 0], P = X1(s1.P), Q = X1(s1.Q), Rs = X1(R);
    const xa = X1([-20, 0])[0] - 10, xb = X1([85, 0])[0] + 10;
    el("line", { x1: xa, y1: O1[1], x2: xb, y2: O1[1], class: "ln" });
    txt(xa + 6, O1[1] + 24, "S", "lab"); txt(xb - 6, O1[1] + 24, "T", "lab");
    if (showOther){
      const Pp = X1([s1.P[0], -s1.P[1]]);
      el("line", { x1: P[0], y1: P[1], x2: Pp[0], y2: Pp[1], class: "ghost" });
      el("line", { x1: Pp[0], y1: Pp[1], x2: Rs[0], y2: Rs[1], class: "ghost" });
      el("line", { x1: Pp[0], y1: Pp[1], x2: Q[0], y2: Q[1], class: "ghost2" });
      el("circle", { cx: Pp[0], cy: Pp[1], r: 5, class: "pt2" }); txt(Pp[0] - 16, Pp[1] + 6, "P′", "lab2");
    }
    el("polyline", { points: [P, Rs, Q].map(p => p.join(",")).join(" "), class: "path" });
    const v = vals1(s1.r), aP = Math.atan2(s1.P[1], s1.P[0] - s1.r) * R2D, aQ = Math.atan2(s1.Q[1], s1.Q[0] - s1.r) * R2D;
    el("path", { d: arcPath(Rs, 30, aP, 180), class: "arc" }); el("path", { d: arcPath(Rs, 30, 0, aQ), class: "arc" });
    txt(Rs[0] - 44, Rs[1] - 8, "1", "alab"); txt(Rs[0] + 44, Rs[1] - 8, "2", "alab");
    txt(P[0] - 16, P[1] - 10, "P", "lab"); txt(Q[0] + 16, Q[1] - 10, "Q", "lab"); txt(Rs[0], Rs[1] + 26, "R", "lab");
    handle(P, "P"); handle(Q, "Q"); handle(Rs, "R");
    $("vPR").textContent = fmt(v.a); $("vRQ").textContent = fmt(v.b); $("vSum").textContent = fmt(v.sum);
    $("vAng").textContent = `${fmt(v.a1)}°／${fmt(v.a2)}°`;
  }

  // ---------- 模式二 ----------
  let K2 = 3, O2 = [60, 310];
  function frame2(){ if (drag) return; const u = ub(), Pw = P2w();
    const pts = [[0, 0], [L2, 0], [L2*u[0], L2*u[1]], Pw];
    if (showOther) pts.push(reflect(Pw, [0,0], [1,0]), reflect(Pw, [0,0], u));
    const f = fit(pts, 0, 0); K2 = f.k; O2 = f.o; }
  const X2 = (p) => [O2[0] + p[0]*K2, O2[1] - p[1]*K2];
  const W2 = (q) => [(q[0] - O2[0]) / K2, (O2[1] - q[1]) / K2];
  const ub = () => [Math.cos(s2.th * D2R), Math.sin(s2.th * D2R)];
  const P2w = () => [s2.pr * Math.cos(s2.pf * D2R), s2.pr * Math.sin(s2.pf * D2R)];
  function per(tN, tM){ const P = P2w(), u = ub(), N = [tN, 0], M = [tM*u[0], tM*u[1]]; return dist(P, N) + dist(N, M) + dist(M, P); }
  function draw2(){
    frame2(); svg.innerHTML = "";
    const u = ub(), O = X2([0, 0]), A = X2([L2, 0]), B = X2([L2*u[0], L2*u[1]]);
    el("line", { x1: O[0], y1: O[1], x2: A[0], y2: A[1], class: "ln" }); el("line", { x1: O[0], y1: O[1], x2: B[0], y2: B[1], class: "ln" });
    txt(A[0] - 6, A[1] + 22, "a", "lab"); txt(B[0] + (u[0] >= 0 ? 16 : -16), B[1] + 6, "b", "lab"); txt(O[0] - 4, O[1] + 22, "O", "lab");
    el("path", { d: arcPath(O, 26, 0, s2.th), class: "arc" });
    const Pw = P2w(), P = X2(Pw), N = X2([s2.tN, 0]), M = X2([s2.tM*u[0], s2.tM*u[1]]);
    if (showOther){
      const P1 = X2(reflect(Pw, [0,0], [1,0])), P2 = X2(reflect(Pw, [0,0], u));
      el("line", { x1: P[0], y1: P[1], x2: P1[0], y2: P1[1], class: "ghost" }); el("line", { x1: P[0], y1: P[1], x2: P2[0], y2: P2[1], class: "ghost" });
      el("line", { x1: P1[0], y1: P1[1], x2: P2[0], y2: P2[1], class: "ghost2" });
      el("circle", { cx: P1[0], cy: P1[1], r: 5, class: "pt2" }); el("circle", { cx: P2[0], cy: P2[1], r: 5, class: "pt2" });
      txt(P1[0] + 18, P1[1] + 6, "P₁", "lab2"); txt(P2[0] - 18, P2[1] + 6, "P₂", "lab2");
    }
    el("polygon", { points: [P, N, M].map(p => p.join(",")).join(" "), class: "path" });
    txt(P[0] + 16, P[1] - 8, "P", "lab");
    handle(P, "P2"); handle(N, "N"); handle(M, "M");
    $("vth").textContent = s2.th + "°";
    $("vMN").textContent = `${fmt(s2.tN)}／${fmt(s2.tM)}`;
    $("vPer").textContent = fmt(per(s2.tN, s2.tM));
    if (showOther){
      const P1 = reflect(Pw, [0,0], [1,0]), P2 = reflect(Pw, [0,0], u);
      $("otherNote").textContent = s2.th < 90 ? `P₁P₂ ＝ ${fmt(dist(P1, P2))}` : `P₁P₂ ＝ ${fmt(dist(P1, P2))}，但它碰不到兩條公路。`;
    }
  }

  function handle(p, id){
    el("circle", { cx: p[0], cy: p[1], r: 18, class: "hit", "data-h": id });
    el("circle", { cx: p[0], cy: p[1], r: 8, class: "drag" + (id === "R" || id === "N" || id === "M" ? " on" : ""), "data-h": id });
  }

  function draw(){ mode === 1 ? draw1() : draw2(); }

  function svgPt(ev){ const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const m = svg.getScreenCTM().inverse(); const q = pt.matrixTransform(m); return [q.x, q.y]; }
  svg.addEventListener("pointerdown", (ev) => { const h = ev.target.getAttribute && ev.target.getAttribute("data-h"); if (!h || running) return; drag = h; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); clearStat(); });
  svg.addEventListener("pointermove", (ev) => {
    if (!drag) return; const q = svgPt(ev);
    if (mode === 1){ const w = W1(q);
      if (drag === "R") s1.r = Math.max(-20, Math.min(85, w[0]));
      else { const p = [Math.max(-20, Math.min(85, w[0])), Math.max(1, Math.min(70, w[1]))]; if (drag === "P") s1.P = p; else s1.Q = p; }
    } else { const w = W2(q), u = ub();
      if (drag === "N") s2.tN = Math.max(0, Math.min(L2, w[0]));
      else if (drag === "M") s2.tM = Math.max(0, Math.min(L2, w[0]*u[0] + w[1]*u[1]));
      else { let f = Math.atan2(w[1], w[0]) * R2D; f = Math.max(2, Math.min(s2.th - 2, f)); s2.pf = f; s2.pr = Math.max(8, Math.min(90, Math.hypot(...w))); }
    }
    draw();
  });
  const end = () => { drag = null; };
  svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);

  function clearStat(){ $("stat").textContent = ""; $("stat").className = "stat"; $("ask").hidden = true; }

  function setMode(m){ if (running) return; mode = m; $("m1").setAttribute("aria-pressed", String(m === 1)); $("m2").setAttribute("aria-pressed", String(m === 2));
    $("read1").hidden = m !== 1; $("read2").hidden = m !== 2;
    $("hint").textContent = m === 1 ? "拖動橘色的點。單位 mm；預設和學習單第 1 頁一樣大。" : "拖動 P 和兩個郵筒（藍色）。預設和學習單第 2 頁一樣：夾角 50°，OP ＝ 55。";
    $("otherNote").hidden = !(showOther && m === 2); clearStat(); draw(); }
  $("m1").addEventListener("click", () => setMode(1));
  $("m2").addEventListener("click", () => setMode(2));
  $("th").addEventListener("input", (e) => { s2.th = +e.target.value; s2.pf = Math.min(s2.pf, s2.th - 2); clearStat(); draw(); });
  $("home").addEventListener("click", () => { if (running) return; Object.assign(s1, JSON.parse(JSON.stringify(S1))); Object.assign(s2, JSON.parse(JSON.stringify(S2))); $("th").value = S2.th; clearStat(); draw(); });
  $("other").addEventListener("click", (e) => { showOther = !showOther; e.currentTarget.setAttribute("aria-pressed", String(showOther));
    $("otherNote").hidden = !(showOther && mode === 2); draw(); });

  $("run").addEventListener("click", () => {
    if (running) return; running = true; $("run").disabled = true; clearStat();
    const N = 1000, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches, per_ = reduce ? N : 10;
    let done = 0, best = Infinity, arg = null; const st = $("stat");
    function tick(){
      for (let i = 0; i < per_ && done < N; i++, done++){
        if (mode === 1){ const r = -20 + Math.random() * 105, v = vals1(r).sum; if (v < best){ best = v; arg = r; } s1.r = r; }
        else { const a = Math.random() * L2, b = Math.random() * L2, v = per(a, b); if (v < best){ best = v; arg = [a, b]; } s2.tN = a; s2.tM = b; }
      }
      draw();
      st.innerHTML = `試了 <b>${done}</b> 個位置，目前最短 <b>${fmt(best)}</b>`;
      if (done < N) requestAnimationFrame(tick);
      else {
        if (mode === 1){ s1.r = arg; const v = vals1(arg); draw();
          st.innerHTML = `試了 <b>${N}</b> 個位置：最短 <b>${fmt(best)}</b>，那時 ∠1 ＝ <b>${fmt(v.a1)}°</b>、∠2 ＝ <b>${fmt(v.a2)}°</b>`; }
        else { s2.tN = arg[0]; s2.tM = arg[1]; draw();
          st.innerHTML = `試了 <b>${N}</b> 組：最短 <b>${fmt(best)}</b>，郵筒距 <i>O</i> <b>${fmt(arg[0])}</b>／<b>${fmt(arg[1])}</b>`; }
        $("ask").hidden = false; running = false; $("run").disabled = false;
      }
    }
    requestAnimationFrame(tick);
  });

  svg.addEventListener("keydown", (ev) => { // 鍵盤：左右鍵移動 R（模式一）或郵筒 N（模式二）
    if (ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return; ev.preventDefault(); const d = ev.key === "ArrowLeft" ? -1 : 1;
    if (mode === 1) s1.r = Math.max(-20, Math.min(85, s1.r + d)); else s2.tN = Math.max(0, Math.min(L2, s2.tN + d)); clearStat(); draw(); });

  draw();
})();
</script>
