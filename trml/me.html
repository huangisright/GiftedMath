<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRML 我的分析</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=20261112a">
</head>
<body>
<div class="wrap stack">
  <a class="back" href="./">← 回首頁</a>
  <div class="stack" style="gap:6px">
    <div class="eyebrow">TRML 國中數學競賽・練習紀錄</div>
    <h1>我的分析</h1>
    <div class="muted">看自己哪些題型強、哪些要加強，還有寫錯的題目。要輸入你自己的<b>分析密碼</b>（每個人不一樣，不是小組代碼），只有你自己看得到。第一次交任何一份卷子時，結果畫面會顯示一次你的分析密碼；忘了請問老師。</div>
  </div>
  <div class="sheet stack">
    <div class="row">
      <label class="f" for="team">隊伍<select id="team"></select></label>
      <label class="f" for="name">姓名<select id="name"></select></label>
      <label class="f" for="pin">分析密碼<input type="password" id="pin" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="4 碼數字"></label>
    </div>
    <div class="row"><button class="primary" id="go">看分析</button><span id="msg" class="muted"></span></div>
  </div>
  <div id="out"></div>
</div>
<script src="config.js"></script>
<script src="note.js?v=20261119a"></script>
<script src="profile.js?v=20261116a"></script>
<script>
(function(){
'use strict';
var API=(window.TRML_CONFIG&&window.TRML_CONFIG.apiUrl)||'', IMG=(window.TRML_CONFIG&&window.TRML_CONFIG.imgBase)||'img/';
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var teams=[];
function fillNames(sel){ var t=teams.filter(function(x){return x.team===$('team').value;})[0];
  $('name').innerHTML='<option value="">選姓名</option>'+(t?t.members.map(function(n){return '<option>'+esc(n)+'</option>';}).join(''):''); if(sel) $('name').value=sel; }
if(!API){ $('msg').textContent='還沒接上題庫。'; return; }
fetch(API+'?action=init').then(function(r){return r.json();}).then(function(d){
  if(!d.ok) throw new Error(d.error);
  teams=d.teams; var who=load('trml-who')||{};
  $('team').innerHTML='<option value="">選隊伍</option>'+teams.map(function(t){return '<option>'+esc(t.team)+'</option>';}).join('');
  if(who.team) $('team').value=who.team; fillNames(who.name);
  $('team').onchange=function(){ fillNames(); $('pin').value=''; $('out').innerHTML=''; };
  $('name').onchange=function(){ $('pin').value=''; $('out').innerHTML=''; };
}).catch(function(e){ $('msg').innerHTML='<span class="err">讀不到名單：'+esc(e.message)+'</span>'; });
function qsrc(q){ var f=q.img||(q.text?'':q.qid+'.png'); return !f?'':/^(https?:|data:|\/)/.test(f)?f:IMG+f; }
function loadReview(auth){
  var box=document.createElement('div'); box.className='sheet stack'; box.id='revBox'; box.innerHTML='<div class="muted">錯題小複習讀取中…</div>';
  $('out').insertBefore(box,$('out').firstChild);
  postJ(API,{action:'review',team:auth.team,name:auth.name,apin:auth.apin}).then(function(R){
    if(!R.ok){ box.innerHTML='<span class="err">'+esc(R.error||'讀不到小複習')+'</span>'; return; }
    var md=function(x){return String(x).slice(5).replace('-','/');};
    var head='<div><h2 style="margin:0">錯題小複習　'+md(R.from)+'～'+md(R.to)+'</h2><div class="muted">從你上週以前寫錯的題目挑的，最多 3 題。不計時，每題這週只能答一次，只告訴你對或錯。答對就不會再出現，答錯下週可能再出現。答對一題投入榜 +2。</div></div>';
    if(!R.items.length){ box.innerHTML=head+'<div>這週沒有要複習的題目。</div>'; return; }
    box.innerHTML=head+R.items.map(function(it,i){
      return '<div class="stack" style="gap:6px;border-top:1px solid var(--line,#ddd);padding-top:10px" data-q="'+esc(it.qid)+'"><b>第 '+(i+1)+' 題</b>'+
        (qsrc(it)?'<img src="'+esc(qsrc(it))+'" alt="第 '+(i+1)+' 題題目" style="max-width:100%">':'')+(it.text?'<div style="white-space:pre-wrap">'+esc(it.text)+'</div>':'')+
        '<div class="row"><input type="text" class="rv-a" autocomplete="off" spellcheck="false" placeholder="答案" aria-label="第 '+(i+1)+' 題答案"><button class="primary rv-go">送出</button><span class="rv-m"></span></div></div>';
    }).join('');
    R.items.forEach(function(it){
      var el=box.querySelector('[data-q="'+it.qid.replace(/"/g,'\\"')+'"]'), inp=el.querySelector('.rv-a'), bt=el.querySelector('.rv-go'), m=el.querySelector('.rv-m');
      var mark=function(ok,a){ inp.value=a||''; inp.disabled=true; bt.disabled=true; m.innerHTML=ok?'<span class="mark-ok">○ 答對了</span>':'<span class="mark-no">× 不對</span>，下週可能再出現'; };
      if(it.done) mark(it.done.correct,it.done.answer);
      bt.onclick=function(){ var a=inp.value.trim(); if(!a){ m.textContent='先填答案。'; return; }
        if(!confirm('每題這週只能答一次，確定送出？')) return;
        bt.disabled=true; m.textContent='送出中…';
        postJ(API,{action:'reviewAns',team:auth.team,name:auth.name,apin:auth.apin,qid:it.qid,answer:a}).then(function(x){
          if(!x.ok){ bt.disabled=false; m.innerHTML='<span class="err">'+esc(x.error||'送出失敗')+'</span>'; return; } mark(x.correct,a); })
        .catch(function(){ bt.disabled=false; m.innerHTML='<span class="err">連不上，請再試一次。</span>'; }); };
    });
  }).catch(function(){ box.innerHTML='<span class="err">讀不到小複習，請重新整理。</span>'; });
}
function boardHtml(B,meId){
  var md=function(x){return String(x).slice(5).replace('-','/');}, mine=B.ppl.filter(function(p){return p.id===meId;})[0];
  var row=function(c){return '<tr>'+c.join('')+'</tr>';};
  return '<div class="sheet stack"><div><h2 style="margin:0">本週投入榜　'+md(B.from)+'～'+md(B.to)+'</h2>'+
    '<div class="muted">排的是練習量，不是分數。每週二晚上截止、週三重新開始。有效卷（第一次作答、至少一半題目有寫）+5，詳解下面的回饋勾了「卡在哪裡」每題 +1，小複習答對每題 +2。✓＝這週競速和個人都至少交一份；★＝全隊都 ✓。</div></div>'+
    '<div><b>你這週：'+(mine?mine.pts+' 點'+(mine.base?' ✓':'，還差'+'競速和個人各一份才 ✓'):'還沒有點數，交一份就有 5 點')+'</b></div>'+
    '<div class="row" style="align-items:flex-start;gap:24px;flex-wrap:wrap">'+
    '<div><b>隊伍（平均點數）</b><table>'+B.teams.map(function(t,i){return row(['<td>'+(i+1)+'</td>','<td>'+esc(t.team)+(t.star?' ★':'')+'</td>','<td style="text-align:right">'+t.avg+'</td>']);}).join('')+'</table></div>'+
    '<div><b>個人</b>'+(B.ppl.length?'<table>'+B.ppl.map(function(p,i){var me=p.id===meId; return row(['<td>'+(i+1)+'</td>','<td>'+(me?'<b>':'')+esc(p.team+'・'+p.name)+(p.base?' ✓':'')+(me?'</b>':'')+'</td>','<td style="text-align:right">'+p.pts+'</td>']);}).join('')+'</table>':'<div class="muted">這週還沒有人交卷。</div>')+'</div>'+
    '</div></div>';
}
function go(){
  var b={action:'profile',team:$('team').value,name:$('name').value,apin:$('pin').value.trim()};
  if(!b.team||!b.name){ $('msg').textContent='先選隊伍和姓名。'; return; }
  if(!b.apin){ $('msg').textContent='請輸入分析密碼。'; return; }
  $('msg').textContent='讀取中…'; $('go').disabled=true;
  postJ(API,b).then(function(d){
    $('go').disabled=false;
    if(!d.ok){ $('msg').innerHTML='<span class="err">'+esc(d.error||'讀取失敗')+'</span>'; return; }
    $('msg').textContent=d.me.name+'・'+d.me.team+'・'+d.me.year+' 年度';
    TRMLProfile.render($('out'),d,{imgBase:IMG,api:API,auth:{team:b.team,name:b.name,apin:b.apin}});
    loadReview(b);
    if(d.board){ var bx=document.createElement('div'); bx.innerHTML=boardHtml(d.board,d.me.id); $('out').insertBefore(bx.firstChild,$('out').firstChild); }
  }).catch(function(){ $('go').disabled=false; $('msg').innerHTML='<span class="err">連不上題庫，請確認網路後再試。</span>'; });
}
$('go').onclick=go;
$('pin').addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.isComposing) go(); });
})();
</script>
</body>
</html>
