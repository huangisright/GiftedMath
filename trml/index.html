<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRML 競速練習</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 版面：方格紙底上一張答案卷；作答時上方吸附計時條，中間一題，下方 26 格答案格 */
:root{
  --paper:#f3f4ee; --grid:rgba(47,63,143,.07); --card:#ffffff; --ink:#1c2230; --muted:#5b6272; --line:#d6d9cc;
  --indigo:#2f3f8f; --indigo-soft:#e4e7f5; --ochre:#b85a1f; --ochre-soft:#f7e6d8; --moss:#3f6f2e; --moss-soft:#e1eed9; --danger:#b3261e;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13151b; --grid:rgba(143,160,255,.06); --card:#1b1e26; --ink:#e7e8ec; --muted:#9ba1ad; --line:#2d313b;
  --indigo:#9aa8ff; --indigo-soft:#262b45; --ochre:#ec9a5f; --ochre-soft:#3a2a1f; --moss:#93c47d; --moss-soft:#22301d; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13151b; --grid:rgba(143,160,255,.06); --card:#1b1e26; --ink:#e7e8ec; --muted:#9ba1ad; --line:#2d313b;
  --indigo:#9aa8ff; --indigo-soft:#262b45; --ochre:#ec9a5f; --ochre-soft:#3a2a1f; --moss:#93c47d; --moss-soft:#22301d; --danger:#ff8a80; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:900;letter-spacing:.02em}
h2{font-size:1.2rem}
.eyebrow{font-size:.78rem;letter-spacing:.12em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);flex:1 1 180px;min-width:0}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--indigo);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px}
button.primary{background:var(--indigo);border-color:var(--indigo);color:var(--card);font-weight:700}
button.warn{background:var(--ochre);border-color:var(--ochre);color:var(--card);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.demo{font-size:.82rem;background:var(--ochre-soft);color:var(--ochre);border-radius:4px;padding:6px 10px}

/* 卷子清單 */
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.set{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.set .meta{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.set .done{font-size:.8rem;color:var(--moss)}
.set button{margin-top:auto;align-self:flex-start}
.set.locked{background:transparent;border-style:dashed}
.set .note{font-size:.85rem;color:var(--muted)}
.set .lock{font-size:.85rem;color:var(--ochre);font-weight:700}
.set .unlock{display:flex;gap:6px;margin-top:auto}
.set .unlock input{font-family:var(--f-mono);padding:7px 9px;flex:1 1 auto;min-width:0}
.set .unlock button{padding:7px 12px;white-space:nowrap}
.set .err{font-size:.82rem}
.confirm{border:1px dashed var(--indigo);background:var(--indigo-soft);border-radius:6px;padding:16px}

/* 作答 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar .in{max-width:760px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center}
.bar .ttl{min-width:0;font-size:.85rem;line-height:1.35}
.bar .ttl b{display:block;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:420px){.clock{font-size:1.5rem}.bar button{padding:8px 12px}}
.clock{font-family:var(--f-mono);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--indigo)}
.clock.warn{color:var(--ochre)}
.clock.danger{color:var(--danger);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.clock.danger{animation:none}}
.qcard{display:flex;flex-direction:column;gap:14px}
.qno{font-family:var(--f-mono);font-weight:700;color:var(--indigo);font-size:1.05rem}
.qbody{font-size:1.1rem;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}
.qbody img{display:block;max-width:100%;height:auto;border-radius:2px;background:#fff}
.ans{display:flex;gap:8px;align-items:stretch}
.ans input{font-family:var(--f-mono);font-size:1.3rem;padding:10px 12px}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys button{font-family:var(--f-mono);padding:6px 0;width:44px;font-size:1.05rem}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.cell{font-family:var(--f-mono);font-size:.9rem;padding:8px 0;text-align:center;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--muted)}
.cell.filled{background:var(--indigo-soft);color:var(--indigo);border-color:var(--indigo)}
.cell.cur{outline:2px solid var(--ochre);outline-offset:1px;color:var(--ink)}
.cell.ok{background:var(--moss-soft);color:var(--moss);border-color:var(--moss)}
.cell.no{background:var(--ochre-soft);color:var(--ochre);border-color:var(--ochre)}
.hint{font-size:.82rem;color:var(--muted)}

/* 結果 */
.score{display:flex;gap:24px;align-items:baseline;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-weight:900;font-size:3.2rem;line-height:1;color:var(--indigo)}
.score .big small{font-size:1.4rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.8rem;letter-spacing:.06em}
td.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbar{display:block;height:10px;border-radius:2px;background:var(--moss);min-width:2px}
.tbar.no{background:var(--ochre)}
.mark-ok{color:var(--moss);font-weight:700}
.mark-no{color:var(--ochre);font-weight:700}
.err{color:var(--danger)}
</style>
</head>
<body>
<div id="v-login" class="wrap stack">
  <div class="stack" style="gap:6px">
    <div class="eyebrow">TRML 國中數學競賽・競速賽練習</div>
    <h1>競速練習</h1>
    <div class="muted">選好隊伍和姓名，挑一份卷子開始。時間一到自動交卷。</div>
  </div>
  <div id="demoNote" class="demo" hidden>範例模式：還沒接上題庫，下面是示範用的題目與名單，作答紀錄不會送出。</div>
  <div id="resume" class="confirm" hidden></div>
  <div class="sheet stack">
    <div class="row">
      <label class="f" for="team">隊伍<select id="team"></select></label>
      <label class="f" for="name">姓名<select id="name"></select></label>
      <label class="f" for="pin" id="pinWrap">代碼<input type="text" id="pin" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="老師給的代碼"></label>
    </div>
  </div>
  <div id="loadErr" class="err" hidden></div>
  <div class="stack" style="gap:10px">
    <h2>可以寫的卷子</h2>
    <div id="sets" class="sets"></div>
  </div>
  <div id="confirm" class="confirm stack" hidden></div>
  <div id="pending" class="confirm" hidden></div>
</div>

<div id="v-run" hidden>
  <div class="bar"><div class="in">
    <div class="ttl"><b id="rTitle"></b><span id="rWho" class="muted"></span>　<span class="muted" id="rCount"></span></div>
    <div class="clock" id="clock">--:--</div>
    <button class="warn" id="btnSubmit">交卷</button>
  </div></div>
  <div class="wrap stack">
    <div id="subConfirm" class="confirm stack" hidden></div>
    <div class="sheet qcard">
      <div class="qno" id="qno"></div>
      <div class="qbody" id="qbody"></div>
      <div class="ans">
        <input type="text" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" aria-label="答案">
      </div>
      <div class="keys" id="keys"></div>
      <div class="hint">分數寫 3/4，根號按 √，圓周率按 π，多個答案用逗號隔開。按 Enter 到下一題。</div>
      <div class="nav">
        <button id="prev">上一題</button>
        <button id="next" class="primary">下一題</button>
      </div>
    </div>
    <div class="stack" style="gap:8px">
      <div class="eyebrow">答案格　點題號可以跳題</div>
      <div class="cells" id="cells"></div>
    </div>
  </div>
</div>

<div id="v-result" class="wrap stack" hidden>
  <div class="stack" style="gap:6px">
    <div class="eyebrow" id="resWho"></div>
    <h1 id="resTitle"></h1>
  </div>
  <div class="sheet stack">
    <div class="score">
      <div class="big" id="resScore"></div>
      <div class="stack" style="gap:2px">
        <div>用時 <b class="mono" id="resUsed"></b></div>
        <div class="muted" id="resNote"></div>
      </div>
    </div>
    <div class="cells" id="resCells"></div>
  </div>
  <div class="sheet stack">
    <h2>時間花在哪</h2>
    <div class="muted" id="resSlow"></div>
    <div class="tbl-wrap"><table id="resTable"></table></div>
  </div>
  <div class="row"><button class="primary" id="btnBack">回到卷子清單</button></div>
</div>

<script src="config.js"></script>
<script src="grade.js"></script>
<script>
(function(){
'use strict';
var API = (window.TRML_CONFIG && window.TRML_CONFIG.apiUrl) || '';
var IMG_BASE = (window.TRML_CONFIG && window.TRML_CONFIG.imgBase) || 'img/';
var DEMO = !API;
var $ = function(id){ return document.getElementById(id); };

/* ---------- 範例資料（沒接題庫時才用） ---------- */
var DEMO_DATA = {
  teams:[{team:'範例一隊',members:['王小明','林小華','陳小安','李小青']},{team:'範例二隊',members:['張小宇','黃小晴','吳小哲','劉小芸']}],
  sets:[{id:'demo',title:'範例卷　改寫自歷屆競速題',minutes:8,questions:[
    {qid:'D1',text:'解方程式\n2x/(1×2) + 2x/(2×3) + 2x/(3×4) + … + 2x/(2017×2018) = 2017\n求 x。'},
    {qid:'D2',text:'數列滿足 a₁ = 1，a₂ₙ = aₙ，a₂ₙ₊₁ = aₙ + 1。求 a₁₀₄。'},
    {qid:'D3',text:'某正整數的所有正因數和為 56，所有正因數的倒數和為 2。求這個正整數。'},
    {qid:'D4',text:'圓外一點 P 到圓上各點的最遠距離為 x，最近距離為 4；由 P 作圓的切線，切線長為 6。求 x。'},
    {qid:'D5',text:'正整數 n 使 n + 168 與 n + 100 都是完全平方數。求 n。'},
    {qid:'D6',text:'1/(1×2) + 1/(2×3) + … + 1/(9×10) = ？（寫成最簡分數）'},
    {qid:'D7',text:'正方形的對角線長為 6，求邊長。'}
  ]}]
};
var DEMO_ANS = {D1:'1009',D2:'3',D3:'28',D4:'9',D5:'156',D6:'9/10',D7:'3√2'};

/* ---------- 儲存（只是方便：重新整理不會掉答案） ---------- */
function load(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function save(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
var RUN_KEY='trml-run', PEND_KEY='trml-pending', HIST_KEY='trml-history', WHO_KEY='trml-who', PASS_KEY='trml-pass';

var cfg=null, run=null, timer=null, lastTick=0;

function fmt(sec){ sec=Math.max(0,Math.round(sec)); var m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function show(v){ ['v-login','v-run','v-result'].forEach(function(id){ $(id).hidden = id!==v; }); window.scrollTo(0,0); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

/* ---------- 讀名單與卷子 ---------- */
function boot(){
  if(DEMO){ $('demoNote').hidden=false; $('pinWrap').hidden=true; cfg=DEMO_DATA; renderLogin(); return; }
  $('sets').innerHTML='<div class="muted">讀取中…</div>';
  fetch(API+'?action=init').then(function(r){return r.json();}).then(function(d){
    if(!d.ok) throw new Error(d.error||'讀取失敗');
    cfg=d; renderLogin(); autoUnlock();
  }).catch(function(e){
    $('sets').innerHTML=''; $('loadErr').hidden=false;
    $('loadErr').textContent='讀不到題庫：'+e.message+'。請確認網路，或請老師檢查設定。';
  });
}

function renderLogin(){
  var who=load(WHO_KEY)||{};
  var ts=$('team'); ts.innerHTML='<option value="">選隊伍</option>'+cfg.teams.map(function(t){return '<option>'+esc(t.team)+'</option>';}).join('');
  if(who.team) ts.value=who.team;
  fillNames(who.name);
  if(who.pin) $('pin').value=who.pin;
  var remember=function(){ save(WHO_KEY,{team:ts.value,name:$('name').value,pin:$('pin').value.trim()}); };
  ts.onchange=function(){ fillNames(); $('pin').value=''; remember(); renderSets(); };
  $('name').onchange=function(){ $('pin').value=''; remember(); renderSets(); };
  $('pin').oninput=remember;
  renderSets(); renderResume(); renderPending();
}
function fillNames(sel){
  var t=cfg.teams.filter(function(x){return x.team===$('team').value;})[0];
  $('name').innerHTML='<option value="">選姓名</option>'+(t?t.members.map(function(n){return '<option>'+esc(n)+'</option>';}).join(''):'');
  if(sel) $('name').value=sel;
}
function isOpen(s){ return !!s.questions; }
function renderSets(){
  var hist=load(HIST_KEY)||{}, team=$('team').value, name=$('name').value, ready=!!(team&&name);
  if(!cfg.sets.length){ $('sets').innerHTML='<div class="muted">目前沒有開放的卷子。</div>'; return; }
  // 開放的排前面，鎖住的排後面
  var order=cfg.sets.map(function(s,i){return i;}).sort(function(a,b){ return (isOpen(cfg.sets[b])?1:0)-(isOpen(cfg.sets[a])?1:0) || a-b; });
  $('sets').innerHTML=order.map(function(i){
    var s=cfg.sets[i], n=hist[s.id+'|'+team+'|'+name], cnt=s.questions?s.questions.length:(s.count||'');
    var head='<b>'+esc(s.title)+'</b><div class="meta">'+cnt+' 題・'+s.minutes+' 分鐘</div>'+(s.note?'<div class="note">'+esc(s.note)+'</div>':'');
    if(isOpen(s)) return '<div class="set">'+head+
      (n?'<div class="done">這台裝置上已交過 '+n.count+' 次，最近一次 '+n.score+'/'+n.total+'</div>':'')+
      '<button class="primary" data-start="'+i+'"'+(ready?'':' disabled')+'>開始</button></div>';
    if(s.status==='scheduled') return '<div class="set locked">'+head+'<div class="lock">'+esc(s.openDate||'')+' 開放</div></div>';
    return '<div class="set locked">'+head+'<div class="lock">需要通關密碼</div>'+
      '<div class="unlock"><input type="text" id="pass-'+i+'" autocomplete="off" spellcheck="false" placeholder="通關密碼" aria-label="'+esc(s.title)+' 的通關密碼"><button data-unlock="'+i+'">解鎖</button></div>'+
      '<div class="err" id="perr-'+i+'"></div></div>';
  }).join('') + (ready?'':'<div class="muted">先選隊伍和姓名。</div>');
  Array.prototype.forEach.call($('sets').querySelectorAll('[data-start]'),function(b){
    b.onclick=function(){ askStart(cfg.sets[+b.dataset.start]); };
  });
  Array.prototype.forEach.call($('sets').querySelectorAll('[data-unlock]'),function(b){
    var i=+b.dataset.unlock, inp=$('pass-'+i);
    b.onclick=function(){ unlock(i, inp.value.trim()); };
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.isComposing) unlock(i, inp.value.trim()); });
  });
}
function unlock(i, pass, silent){
  var s=cfg.sets[i]; if(!pass) return;
  var err=$('perr-'+i); if(err&&!silent) err.textContent='確認中…';
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'unlock',setId:s.id,pass:pass})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.ok){ if(!silent&&$('perr-'+i)) $('perr-'+i).textContent=d.error||'通關密碼不對'; return; }
      s.questions=d.questions; s.setPass=pass;
      var m=load(PASS_KEY)||{}; m[s.id]=pass; save(PASS_KEY,m);
      renderSets();
    })
    .catch(function(){ if(!silent&&$('perr-'+i)) $('perr-'+i).textContent='連不上題庫，請確認網路後再試。'; });
}
function autoUnlock(){
  var m=load(PASS_KEY)||{};
  cfg.sets.forEach(function(s,i){ if(!s.questions && s.status==='locked' && m[s.id]) unlock(i,m[s.id],true); });
}
function askStart(set){
  var c=$('confirm'); c.hidden=false;
  c.innerHTML='<div><b>'+esc(set.title)+'</b>：'+set.questions.length+' 題，倒數 '+set.minutes+' 分鐘。</div>'+
    '<div class="muted">開始後不能暫停；切到別的畫面時間照樣走。時間到會自動交卷。</div>'+
    '<div class="row"><button class="primary" id="go">開始計時</button><button id="cancel">先不要</button></div>';
  c.scrollIntoView({block:'center',behavior:'smooth'});
  $('cancel').onclick=function(){ c.hidden=true; };
  $('go').onclick=function(){
    if(DEMO){ c.hidden=true; startRun(set); return; }
    var btn=$('go'); btn.disabled=true; btn.textContent='確認代碼中…';
    fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'login',team:$('team').value,name:$('name').value,pin:$('pin').value.trim()})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.ok){ c.hidden=true; startRun(set); return; }
        btn.disabled=false; btn.textContent='開始計時';
        var msg=d.error||'代碼不對，請再確認一次。';
        var e=c.querySelector('.err'); if(!e){ e=document.createElement('div'); e.className='err'; c.appendChild(e); }
        e.textContent=msg; $('pin').focus();
      })
      .catch(function(){ btn.disabled=false; btn.textContent='開始計時';
        var e=c.querySelector('.err'); if(!e){ e=document.createElement('div'); e.className='err'; c.appendChild(e); }
        e.textContent='連不上題庫，請確認網路後再按一次。'; });
  };
}
function renderResume(){
  var r=load(RUN_KEY), box=$('resume');
  if(!r){ box.hidden=true; return; }
  var left=(r.deadline-Date.now())/1000;
  box.hidden=false;
  if(left>0){
    box.innerHTML='<div class="row" style="justify-content:space-between"><div><b>'+esc(r.set.title)+'</b> 還沒交（'+esc(r.name)+'），剩 '+fmt(left)+'。</div><button class="primary" id="resumeGo">繼續作答</button></div>';
    $('resumeGo').onclick=function(){ run=r; enterRun(); };
  }else{
    box.innerHTML='<div class="row" style="justify-content:space-between"><div><b>'+esc(r.set.title)+'</b> 的時間已經到了，還沒送出（'+esc(r.name)+'）。</div><button class="warn" id="resumeGo">現在交卷</button></div>';
    $('resumeGo').onclick=function(){ run=r; submit(true); };
  }
}
function renderPending(){
  var p=load(PEND_KEY), box=$('pending');
  if(!p||DEMO){ box.hidden=true; return; }
  box.hidden=false;
  box.innerHTML='<div class="row" style="justify-content:space-between"><div>有一份〈'+esc(p.setTitle)+'〉的答案上次沒送出去。</div><button class="primary" id="pendGo">重新送出</button></div>';
  $('pendGo').onclick=function(){ sendPayload(p, null); };
}

/* ---------- 作答 ---------- */
function startRun(set){
  var now=Date.now();
  run={ set:set, setPass:set.setPass||'', team:$('team').value, name:$('name').value, pin:$('pin').value.trim(), startedAt:now, deadline:now+set.minutes*60000,
        answers:{}, secs:{}, cur:0, clientId:'c'+now.toString(36)+Math.random().toString(36).slice(2,8) };
  set.questions.forEach(function(q){ run.answers[q.qid]=''; run.secs[q.qid]=0; });
  save(RUN_KEY,run); enterRun();
}
function enterRun(){
  show('v-run');
  $('rTitle').textContent=run.set.title;
  $('rWho').textContent=run.team+'・'+run.name;
  $('subConfirm').hidden=true;
  buildKeys(); buildCells(); renderQ();
  lastTick=Date.now();
  clearInterval(timer); timer=setInterval(tick,500); tick();
}
function curQ(){ return run.set.questions[run.cur]; }
function account(){
  var now=Date.now();
  if(run && document.visibilityState!=='hidden'){ var q=curQ(); run.secs[q.qid]+= (now-lastTick)/1000; }
  lastTick=now;
}
function tick(){
  if(!run) return;
  account();
  var left=(run.deadline-Date.now())/1000, c=$('clock');
  c.textContent=fmt(left);
  c.className='clock'+(left<=60?' danger':left<=300?' warn':'');
  if(left<=0){ submit(true); return; }
  save(RUN_KEY,run);
}
document.addEventListener('visibilitychange',function(){ if(run){ if(document.visibilityState==='hidden') account(); else lastTick=Date.now(); }});

function imgSrc(q){
  var f=q.img||((q.text)?'':q.qid+'.png');
  if(!f) return '';
  return /^(https?:|data:|\/)/.test(f)?f:IMG_BASE+f;
}
function renderQ(){
  var q=curQ(), n=run.set.questions.length;
  $('qno').textContent='第 '+(run.cur+1)+' 題　／ 共 '+n+' 題';
  var b=$('qbody'); b.innerHTML='';
  var src=imgSrc(q);
  if(src){ var im=new Image(); im.src=src; im.alt='第 '+(run.cur+1)+' 題題目'; im.onerror=function(){ b.textContent='（題目圖片讀不到：'+src+'）'; }; b.appendChild(im); }
  if(q.text){ var t=document.createElement('div'); t.textContent=q.text; b.appendChild(t); }
  var a=$('answer'); a.value=run.answers[q.qid]||'';
  $('prev').disabled=run.cur===0;
  $('next').textContent=run.cur===n-1?'看答案格':'下一題';
  updateCells();
  if(window.matchMedia('(pointer:fine)').matches) a.focus();
}
function go(i){
  account();
  var n=run.set.questions.length;
  if(i>=n){ $('cells').scrollIntoView({behavior:'smooth',block:'center'}); return; }
  run.cur=Math.max(0,Math.min(n-1,i)); save(RUN_KEY,run); renderQ();
}
$('answer').addEventListener('input',function(){ run.answers[curQ().qid]=this.value; updateCells(); save(RUN_KEY,run); });
$('answer').addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); go(run.cur+1); }});
$('prev').onclick=function(){ go(run.cur-1); };
$('next').onclick=function(){ go(run.cur+1); };

function buildKeys(){
  var keys=['√','π','/','^','(',')',',','-'];
  $('keys').innerHTML=keys.map(function(k){return '<button type="button" data-k="'+k+'" aria-label="輸入 '+k+'">'+k+'</button>';}).join('');
  Array.prototype.forEach.call($('keys').querySelectorAll('button'),function(b){
    b.onmousedown=function(e){ e.preventDefault(); };
    b.onclick=function(){
      var a=$('answer'), s=a.selectionStart==null?a.value.length:a.selectionStart, e2=a.selectionEnd==null?s:a.selectionEnd;
      a.value=a.value.slice(0,s)+b.dataset.k+a.value.slice(e2);
      a.setSelectionRange(s+1,s+1); a.dispatchEvent(new Event('input')); a.focus();
    };
  });
}
function buildCells(){
  $('cells').innerHTML=run.set.questions.map(function(q,i){return '<button type="button" class="cell" data-i="'+i+'">'+(i+1)+'</button>';}).join('');
  Array.prototype.forEach.call($('cells').querySelectorAll('.cell'),function(c){ c.onclick=function(){ go(+c.dataset.i); window.scrollTo({top:0,behavior:'smooth'}); }; });
}
function updateCells(){
  var filled=0;
  Array.prototype.forEach.call($('cells').querySelectorAll('.cell'),function(c,i){
    var q=run.set.questions[i], has=!!(run.answers[q.qid]||'').trim();
    if(has) filled++;
    c.className='cell'+(has?' filled':'')+(i===run.cur?' cur':'');
  });
  $('rCount').textContent='已填 '+filled+'/'+run.set.questions.length;
}

$('btnSubmit').onclick=function(){
  var empty=run.set.questions.filter(function(q){return !(run.answers[q.qid]||'').trim();}).length;
  var c=$('subConfirm'); c.hidden=false;
  c.innerHTML='<div>'+(empty?'還有 <b>'+empty+'</b> 題沒填。':'每一題都填了。')+'交卷後就不能再改。</div>'+
    '<div class="row"><button class="warn" id="subGo">確定交卷</button><button id="subNo">繼續寫</button></div>';
  window.scrollTo({top:0,behavior:'smooth'});
  $('subNo').onclick=function(){ c.hidden=true; };
  $('subGo').onclick=function(){ submit(false); };
};

/* ---------- 交卷 ---------- */
function submit(auto){
  if(!run||run._sending) return;
  account(); clearInterval(timer);
  run._sending=true;
  var used=Math.min(run.set.minutes*60,(Math.min(Date.now(),run.deadline)-run.startedAt)/1000);
  var payload={ action:'submit', setId:run.set.id, setTitle:run.set.title, team:run.team, name:run.name, pin:run.pin||'', setPass:run.setPass||'', clientId:run.clientId,
    startedAt:run.startedAt, usedSec:Math.round(used), auto:!!auto,
    responses:run.set.questions.map(function(q){ return {qid:q.qid, answer:(run.answers[q.qid]||'').trim(), seconds:Math.round(run.secs[q.qid]||0)}; }) };
  var snapshot=run;
  save(PEND_KEY,payload); save(RUN_KEY,null); run=null;
  sendPayload(payload, snapshot);
}
function sendPayload(payload, snapshot){
  var set=snapshot?snapshot.set:(cfg.sets.filter(function(s){return s.id===payload.setId;})[0]);
  if(DEMO){
    var results=payload.responses.map(function(r){ var ok=!!r.answer&&TRMLGrade.isCorrect(r.answer,DEMO_ANS[r.qid]); return {qid:r.qid,correct:ok,expected:DEMO_ANS[r.qid]}; });
    var sc=results.filter(function(r){return r.correct;}).length;
    return done({ok:true,score:sc,total:results.length,results:results,showAnswers:true,attemptNo:1});
  }
  show('v-result');
  $('resTitle').textContent=payload.setTitle; $('resWho').textContent=payload.team+'・'+payload.name;
  $('resScore').textContent='送出中…'; $('resUsed').textContent=fmt(payload.usedSec); $('resNote').textContent=''; $('resCells').innerHTML=''; $('resTable').innerHTML=''; $('resSlow').textContent='';
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(function(r){return r.json();})
    .then(function(d){ if(!d.ok) throw new Error(d.error||'送出失敗'); done(d); })
    .catch(function(e){
      $('resScore').textContent='沒送出去';
      $('resNote').innerHTML='<span class="err">'+esc(e.message)+'</span>。答案已經存在這台裝置上，回到清單按「重新送出」即可。';
    });
  function done(d){
    save(PEND_KEY,null);
    var hist=load(HIST_KEY)||{}, k=payload.setId+'|'+payload.team+'|'+payload.name, h=hist[k]||{count:0};
    hist[k]={count:h.count+1,score:d.score,total:d.total}; save(HIST_KEY,hist);
    renderResult(payload,d,set);
  }
}
function renderResult(p,d,set){
  show('v-result');
  $('resTitle').textContent=p.setTitle; $('resWho').textContent=p.team+'・'+p.name+(d.attemptNo>1?'・第 '+d.attemptNo+' 次':'');
  $('resScore').innerHTML=d.score+'<small> / '+d.total+'</small>';
  $('resUsed').textContent=fmt(p.usedSec);
  $('resNote').textContent=(p.auto?'時間到自動交卷。':'')+(d.attemptNo>1?'老師的統計以第一次為準。':'');
  var resp={}; p.responses.forEach(function(r){resp[r.qid]=r;});
  $('resCells').innerHTML=d.results.map(function(r,i){return '<div class="cell '+(r.correct?'ok':'no')+'">'+(i+1)+'</div>';}).join('');
  var max=Math.max.apply(null,p.responses.map(function(r){return r.seconds;}).concat([1]));
  var order=p.responses.map(function(r,i){return {i:i,s:r.seconds};}).sort(function(a,b){return b.s-a.s;}).slice(0,3).filter(function(x){return x.s>0;});
  $('resSlow').textContent=order.length?'花最久的是第 '+order.map(function(x){return (x.i+1)+' 題（'+fmt(x.s)+'）';}).join('、第 ')+'。':'';
  var showA=d.showAnswers;
  $('resTable').innerHTML='<tr><th>題</th><th>作答</th>'+(showA?'<th>正確答案</th>':'')+'<th></th><th>用時</th><th style="width:40%"></th></tr>'+
    d.results.map(function(r,i){ var x=resp[r.qid]||{answer:'',seconds:0};
      return '<tr><td class="mono">'+(i+1)+'</td><td class="mono">'+(x.answer?esc(x.answer):'<span class="muted">（空白）</span>')+'</td>'+
        (showA?'<td class="mono">'+esc(r.expected||'')+'</td>':'')+
        '<td class="'+(r.correct?'mark-ok">○':'mark-no">×')+'</td><td class="mono">'+fmt(x.seconds)+'</td>'+
        '<td><span class="tbar'+(r.correct?'':' no')+'" style="width:'+(100*x.seconds/max).toFixed(1)+'%"></span></td></tr>';
    }).join('');
}
$('btnBack').onclick=function(){ show('v-login'); renderSets(); renderResume(); renderPending(); };

boot();
})();
</script>
